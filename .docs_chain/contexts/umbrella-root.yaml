context: umbrella-root
description: Project-root Markdown (README, CONTINUATION, the four governance carriers) -> html + pdf (§11.4.65)
# GENERATED by scripts/gen-docs-chain-contexts.sh — do not hand-edit.
# Regenerate after adding or removing an in-scope Markdown document;
# scripts/verify-docs-chain.sh FAILS while this file and the tree disagree.
# Format set: .html + .pdf per constitution §11.4.65.
nodes:
  agents_md:   { kind: markdown, path: AGENTS.md }
  agents_html: { kind: html,     path: AGENTS.html }
  agents_pdf:  { kind: pdf,      path: AGENTS.pdf }
  claude_md:   { kind: markdown, path: CLAUDE.md }
  claude_html: { kind: html,     path: CLAUDE.html }
  claude_pdf:  { kind: pdf,      path: CLAUDE.pdf }
  continuation_md:   { kind: markdown, path: CONTINUATION.md }
  continuation_html: { kind: html,     path: CONTINUATION.html }
  continuation_pdf:  { kind: pdf,      path: CONTINUATION.pdf }
  constitution_md:   { kind: markdown, path: Constitution.md }
  constitution_html: { kind: html,     path: Constitution.html }
  constitution_pdf:  { kind: pdf,      path: Constitution.pdf }
  gemini_md:   { kind: markdown, path: GEMINI.md }
  gemini_html: { kind: html,     path: GEMINI.html }
  gemini_pdf:  { kind: pdf,      path: GEMINI.pdf }
  qwen_md:   { kind: markdown, path: QWEN.md }
  qwen_html: { kind: html,     path: QWEN.html }
  qwen_pdf:  { kind: pdf,      path: QWEN.pdf }
  readme_md:   { kind: markdown, path: README.md }
  readme_html: { kind: html,     path: README.html }
  readme_pdf:  { kind: pdf,      path: README.pdf }
edges:
  - { type: derive-from, from: agents_md,   to: agents_html, transform: md2html }
  - { type: derive-from, from: agents_html, to: agents_pdf,  transform: html2pdf }
  - { type: derive-from, from: claude_md,   to: claude_html, transform: md2html }
  - { type: derive-from, from: claude_html, to: claude_pdf,  transform: html2pdf }
  - { type: derive-from, from: continuation_md,   to: continuation_html, transform: md2html }
  - { type: derive-from, from: continuation_html, to: continuation_pdf,  transform: html2pdf }
  - { type: derive-from, from: constitution_md,   to: constitution_html, transform: md2html }
  - { type: derive-from, from: constitution_html, to: constitution_pdf,  transform: html2pdf }
  - { type: derive-from, from: gemini_md,   to: gemini_html, transform: md2html }
  - { type: derive-from, from: gemini_html, to: gemini_pdf,  transform: html2pdf }
  - { type: derive-from, from: qwen_md,   to: qwen_html, transform: md2html }
  - { type: derive-from, from: qwen_html, to: qwen_pdf,  transform: html2pdf }
  - { type: derive-from, from: readme_md,   to: readme_html, transform: md2html }
  - { type: derive-from, from: readme_html, to: readme_pdf,  transform: html2pdf }
transforms:
  md2html:  { builtin: pandoc-html }
  html2pdf: { builtin: weasyprint-pdf }
