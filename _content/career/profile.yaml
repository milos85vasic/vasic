# ---------------------------------------------------------------------------
# Summary. `long` is the CV summary; `short` is the ATS/hero variant.
# ---------------------------------------------------------------------------
summary:
  - id: summary.lead
    i18n: summary.lead
    text: >-
      AI/software engineer who builds AI-development systems end to end — from multi-provider
      LLM infrastructure and autonomous agents to the QA and governance layers that keep them
      honest. I don't ship demos; I ship platforms.
  - id: summary.body
    i18n: summary.body
    text: >-
      Over 16 years of professional engineering across mobile SDKs, real-time hardware
      integration, and distributed backends now converge on one focus: making autonomous AI
      development trustworthy at scale. I architect fleets, not monoliths — large product
      applications standing on dozens of small, decoupled, independently-tested modules, every
      one of them inheriting a shared engineering Constitution and verified by an anti-bluff,
      evidence-gated QA discipline.
  - id: summary.value
    i18n: summary.value
    text: >-
      What I bring: the ability to take an AI capability from a research idea to a governed,
      self-verifying, production-shaped system — LLM routing that proves each model actually
      works before trusting it, agents that debate and reach consensus instead of guessing,
      memory and RAG layers that don't lose context, and a whole ecosystem wired so that
      "the tests are green" can never quietly mean "the feature is broken."

