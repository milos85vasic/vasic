# ============================================================================
# career.profile.v1 — the single source of truth for every career artifact.
#
# Every string here is either (a) a fact transcribed from the candidate's own
# verified record (_content/docs/cv.md, itself sourced from milosvasic.ru and
# repository READMEs), or (b) a presentation string that carries an `i18n` id
# and is translated in _content/career/locales/<lang>.yaml.
#
# NOTHING in this file may be invented. If a claim is not in the verified
# record it does not belong here (Constitution §11.4.6).
#
# The `i18n` key on a string is its stable translation id. The English `text`
# is the master. Renderers never read this file directly: they consume the
# resolved DocumentModel produced by model.py.
# ============================================================================
