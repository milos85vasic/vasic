  exp.leica.b2: Спраектаваў апрацоўку даных на прыладзе і канвееры сінхранізацыі для вялікіх аб’ёмаў хмар кропак
  exp.leica.b3: Выканаў інтэграцыю з партнёрам Autodesk у кліентах для Android і iOS
  exp.leica.location: Хербруг, Швейцарыя
  exp.leica.role: Інжынер-праграміст
  exp.leica.summary: 'Распрацоўка iOS- і Android-праграм для 3D-сканераў Leica Geosystems — сувязь з абсталяваннем у рэжыме рэальнага часу, апрацоўка і сінхранізацыя даных. Партнёр: Autodesk.'
