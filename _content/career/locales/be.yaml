  comp.ai.item1: Абстракцыя LLM для многіх правайдэраў (40+ правайдэраў), інтэграцыя інструментаў MCP, RAG, вектарныя базы даных і эмбедынгі
  comp.ai.item2: Аркестрацыя агентаў — headless CLI-агенты, графавыя працоўныя працэсы, шматраундавыя дэбаты і кансенсус
  comp.ai.item3: Планаванне (HiPlan / MCTS / Tree-of-Thoughts), LLMOps, бенчмаркінг (SWE-bench, HumanEval, MMLU)
  comp.ai.item4: Верыфікацыя LLM, абарончыя guardrails для LLM, камп’ютарны зрок і LLM-зрок
  comp.backend.item1: Go (Gin), gRPC + Protobuf, HTTP/3 (QUIC), WebSockets
  comp.backend.item2: Размеркаваныя сістэмы, уключаючы фармальныя спецыфікацыі на TLA+
  comp.backend.item3: Высокапрадукцыйныя REST-сэрвісы і паралельныя воркеры
  comp.data.item1: PostgreSQL, SQLite, SQLCipher (шыфраванне захаваных даных), Redis, Neo4j, ClickHouse
  comp.data.item2: Аб’ектнае сховішча — MinIO, S3, GCS, Azure Blob
  comp.android.item1: Kotlin і Java на Android, Android TV і AOSP; Jetpack Compose, Leanback, ExoPlayer
  comp.android.item2: Інтэграцыя з абсталяваннем у рэжыме рэальнага часу — Bluetooth, OBD2, 3D-сканеры, канвееры даных датчыкаў
  comp.android.item3: Праектаванне SDK, інжынерыя зборкі Gradle, тэсціраванне прылад праз ADB, аўтаматызацыя рэлізаў
  comp.cross.item1: Flutter/Dart і React Native на ўзроўні SDK — апублікаваныя пакеты, якімі карыстаюцца AWS, Google і банкі
  comp.cross.item2: Kotlin Multiplatform і агульная бізнес-логіка для Android і iOS
  comp.cross.item3: iOS на Swift; натыўныя масты і платформенныя каналы
  comp.frontend.item1: TypeScript/React (Tailwind, Redux Toolkit, i18next), Angular
  comp.frontend.item2: Дэсктопныя праграмы на Electron і Tauri/Rust
  comp.frontend.item3: Даступнасць (WCAG 2.2 AA), бюджэты прадукцыйнасці, дызайн-сістэмы
  comp.infra.item1: Docker і Compose, Kubernetes + Helm, Prometheus + Grafana, OpenTelemetry
  comp.infra.item2: QEMU, Libvirt, Parallels; інструменты для вобразаў віртуальных машын і іх канфігураванне
  comp.infra.item3: CI/CD праз GitHub Actions, Gradle і Make
  comp.qa.item1: Anti-bluff QA з абавязковым пацверджаннем доказамі (HelixQA); challenge-харнэсы з мутацыйнымі шлюзамі
  comp.qa.item2: go test -race, візуальна-рэгрэсійнае тэсціраванне, тэсціраванне прылад праз ADB
  comp.qa.item3: SonarQube і сканаванне бяспекі — Semgrep, gosec, Trivy, Snyk, Gitleaks, Nancy
  comp.gov.item1: Канстытуцыя як Git-падмодуль з наследаваннем і шлюзамі распаўсюджвання
  comp.gov.item2: Дысцыпліна дакументацыі і пакрыцця тэстамі у парку з больш чым 140 рэпазіторыяў
