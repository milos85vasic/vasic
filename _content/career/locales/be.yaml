  proj.catalogizer.blurb: Шматпратакольнае, зашыфраванае кіраванне медыякалекцыяй з магчымасцю самастойнага разгортвання (Go/Gin + React), устойлівае да збояў сеткавых сховішчаў і пабудаванае на 21 падмодулі шматразовага выкарыстання.
  proj.coursescreator.blurb: Канвеер ШІ-курсаў з Markdown у відэа з TTS і прайгравальнікамі для дэсктопа, мабільных прылад і вэбу.
  proj.helixagent.blurb: 'Прамысловы ансамблевы сэрвіс LLM, які не давярае адной модэлі: ён накіроўвае запыт многім правайдэрам, праводзіць структураваныя шматраундавыя дэбаты (Proposal → Critique → Review → Synthesis) і маршрутызуе па выніках жывой верыфікацыі з плаўным пераключэннем на рэзервовыя варыянты — праз API, сумяшчальны з OpenAI, з высокадаступным слоем даных, назіральнасцю і guardrails.'
  proj.helixcode.blurb: Размеркаваная платформа распрацоўкі з ШІ, якая дзеліць працу на задачы з улікам залежнасцей паміж воркерамі, якімі кіруюць праз SSH, а затым стварае кантрольныя кропкі і выконвае адкат, каб нічога не губілася пры перапыненні задачы, — з выбарам мадэлі з улікам абсталявання і поўным цыклам plan/build/test/refactor праз REST, CLI, TUI і MCP.
  proj.helixconstitution.blurb: Універсальны збор інжынерных правіл, які распаўсюджваецца як Git-падмодуль і наследуецца больш чым 140 рэпазіторыямі — інжынернае права, якое выпускаецца і фіксуецца па версіях гэтак жа, як код. Шлюзы распаўсюджвання (propagation gates) правяраюць у кожным рэпазіторыі наяўнасць абавязковых палажэнняў, а кожная такая праверка спалучана з мутацыйным метатэстам, які даказвае, што сама яна не фікцыя.
  proj.helixllm.blurb: 'Адзін бінарны файл, шэсць рэжымаў разгортвання: інферэнс, сумяшчальны з OpenAI і Anthropic, праз HTTP/3, які маштабуецца ад наўтбука да кластара з некалькіх хастоў, з лакальным інферэнсам на llama.cpp (CUDA/Metal/ROCm) і ланцужком аблачных рэзервовых варыянтаў з аўтавыяўленнем і ацэнкай па выніках верыфікацыі, які ў выніку заўсёды вяртаецца да гарантавана даступнай лакальнай мадэлі.'
  proj.helixmemory.blurb: Адзіны механізм кагнітыўнай памяці, які аб’ядноўвае чатыры лепшыя ў сваім класе backend-сістэмы — Mem0, Cognee, Letta, Graphiti — за адзіным інтэрфейсам з паралельным пошукам і пераранжыраваннем вынікаў з розных крыніц.
  proj.helixqa.blurb: 'Anti-bluff QA-аркестрацыя на Go, пабудаваная на адным правіле: мерка — не «тэсты праходзяць», а «карыстальнікі могуць карыстацца функцыяй». Яна запускае напісаныя YAML-наборы тэстаў і цалкам аўтаномныя сесіі на аснове LLM і камп’ютарнага зроку, якія адкрываюць сапраўдную праграму, правяраюць кожную задакументаваную функцыю, шукаюць недакументаваныя памылкі ў Android, Android TV, Web і Desktop і адмаўляюцца ставіць PASS без зафіксаваных доказаў працы падчас выканання і без заявак, гатовых да выпраўлення ШІ.'
  proj.helixspecifier.blurb: Рухавік распрацоўкі на аснове спецыфікацый, які падганяе ўласны працэс пад памер задачы і падмацоўвае спецыфікацыі шматагентнымі дэбатамі.
  proj.helixtrack.blurb: 'Альтэрнатыва JIRA + Confluence для свабоднага свету: мікрасэрвісы на Go за адзіным API з маршрутызацыяй па дзеяннях праз HTTP/3, шыфраванне захаваных даных (SQLCipher) і натыўныя кліенты для Web, Desktop, Android і iOS.'
  proj.llmorchestrator.blurb: Патокабяспечная плоскасць кіравання (control plane), якая запускае і вядзе headless CLI-агентаў — OpenCode, Claude Code, Gemini, Junie, Qwen Code — праз гібрыдны пратакол на аснове каналаў і файлаў.
  proj.llmprovider.blurb: Адзіны інтэрфейс для 43 правайдэраў з circuit breaker, маніторынгам стану, паўторамі са зменнай затрымкай (jitter) і сумленным выяўленнем мадэляў без жорстка прапісаных рэзервовых варыянтаў.
  proj.llmsverifier.blurb: Крыніца ісціны для верыфікацыі, абавязковая праверка якой «Ці бачыш ты мой код?» гарантуе, што працоўнымі або даступнымі для экспарту лічацца толькі мадэлі, якія сапраўды даказалі сваю працаздольнасць.
  proj.mailserverfactory.blurb: Дэкларатыўны JSON, з якога ствараюцца цалкам канфігураваныя паштовыя серверы ў Docker для 12 тыпаў злучэння і 25 дыстрыбутываў Linux; паведамляецца пра 439 пройдзеных тэстаў і чыстую праверку SonarQube.
  proj.serverfactorycore.blurb: Агульны рухавік разгортвання і інструменты для вобразаў віртуальных машын, на якіх трымаецца лінейка Server Factory, — драйверы QEMU, Libvirt і Parallels у межах адзінага фрэймворка.
  proj.visionengine.blurb: Камп’ютарны зрок і ўспрыманне UI праз LLM-зрок некалькіх правайдэраў з навігацыйнымі графамі.
  pub.fundamentalkotlin.detail: Аўтар, які выдае кнігу самастойна; апошняя перагледжаная рэдакцыя — верасень 2022 года (3-е выданне). Таксама пісаў для выдавецтва Packt Publishing (Вялікабрытанія).
