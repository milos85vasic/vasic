  exp.bosch.summary: Вядучы распрацоўшчык SDK для Connected Vehicles — сувязь з шынай OBD2 праз Bluetooth у рэжыме рэальнага часу, высокапрадукцыйная апрацоўка і захаванне даных.
  exp.harness.b1: Узначальваў сямейства SDK для падраздзялення Feature Flag — Android, iOS, Flutter, React Native і серверныя асяроддзі выканання
  exp.harness.b2: Выпусціў SDK, якімі карысталіся AWS, Google і банкаўскія партнёры, з агульным рухавіком ацэнкі флагаў і ідыяматычнымі API для кожнай платформы
  exp.harness.b3: Адказваў за рэліз-інжынерыю для сямі моў праграмавання і чатырох экасістэм пакетаў
