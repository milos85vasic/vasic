  proj.catalogizer.blurb: "Gestion de collections multimédias multiprotocole, chiffrée et auto-hébergeable (Go/Gin + React), résiliente aux défaillances du stockage réseau et construite sur 21 sous-modules réutilisables."
  proj.coursescreator.blurb: "Un pipeline de cours IA, du Markdown à la vidéo, avec synthèse vocale (TTS) et lecteurs de bureau, mobiles et web."
  proj.helixagent.blurb: "Un service LLM d’ensemble de niveau production qui refuse de se fier à un seul modèle : il diffuse un prompt auprès de nombreux fournisseurs, mène un débat structuré en plusieurs tours (Proposal → Critique → Review → Synthesis) et route selon des scores de vérification en temps réel, avec repli en douceur — derrière une API compatible OpenAI dotée d’une couche de données haute disponibilité, d’observabilité et de garde-fous."
  proj.helixcode.blurb: "Une plateforme de développement IA distribuée qui découpe le travail en tâches tenant compte des dépendances sur un parc de workers géré par SSH, puis crée des points de contrôle et effectue des retours arrière pour que rien ne soit perdu si une tâche est interrompue — avec une sélection de modèles adaptée au matériel et un cycle complet planification / build / test / refactoring derrière REST, CLI, TUI et MCP."
  proj.helixconstitution.blurb: "Un référentiel d’ingénierie universel distribué comme sous-module Git et hérité par plus de 140 dépôts : une loi d’ingénierie livrée et épinglée par version exactement comme du code. Des gates de propagation parcourent chaque dépôt consommateur à la recherche des clauses requises, et chaque gate est associé à un méta-test de mutation prouvant que le gate lui-même n’est pas factice."
  proj.helixllm.blurb: "Un seul binaire, six modes de déploiement : une inférence compatible OpenAI et Anthropic sur HTTP/3, qui monte en charge d’un ordinateur portable à un cluster multi-hôtes, avec inférence locale llama.cpp (CUDA/Metal/ROCm) et une chaîne de repli cloud à découverte automatique, classée selon des scores de vérification, qui bascule toujours sur un modèle local garanti."
  proj.helixmemory.blurb: "Un moteur de mémoire cognitive unifié qui fédère quatre backends de premier plan — Mem0, Cognee, Letta, Graphiti — derrière une seule interface, avec recherche parallèle et reclassement inter-sources."
  proj.helixqa.blurb: "Orchestration QA « anti-bluff » en Go, fondée sur une seule règle : le critère n’est pas « les tests passent » mais « les utilisateurs peuvent utiliser la fonctionnalité ». Elle exécute des banques de tests YAML écrites ainsi que des sessions entièrement autonomes LLM + vision qui ouvrent l’application réelle, vérifient chaque fonctionnalité documentée, traquent les bugs non documentés sur Android, Android TV, Web et Desktop, et refusent d’attribuer un PASS sans preuves d’exécution capturées, tout en produisant des tickets prêts pour un correctif par IA."
  proj.helixspecifier.blurb: "Un moteur de fusion du développement piloté par les spécifications, qui adapte sa propre cérémonie à la taille du travail et appuie les spécifications sur un débat multi-agents."
  proj.helixtrack.blurb: "Une alternative libre à JIRA + Confluence : des microservices Go derrière une API unifiée à routage par actions sur HTTP/3, chiffrement SQLCipher au repos, et des clients natifs Web, Desktop, Android et iOS."
  proj.llmorchestrator.blurb: "Un plan de contrôle thread-safe qui lance et pilote des agents CLI headless — OpenCode, Claude Code, Gemini, Junie, Qwen Code — via un protocole hybride tubes et fichiers."
  proj.llmprovider.blurb: "Une seule interface pour 43 fournisseurs, avec disjoncteurs, surveillance de l’état de santé, nouvelles tentatives à backoff avec gigue et découverte de modèles honnête, sans repli codé en dur."
  proj.llmsverifier.blurb: "Source de référence pour la vérification, dont le gate obligatoire « Do you see my code? » garantit que seuls les modèles dont le bon fonctionnement est prouvé sont marqués utilisables ou exportés."
  proj.mailserverfactory.blurb: "Du JSON déclaratif à des serveurs de messagerie entièrement provisionnés et conteneurisés avec Docker, sur 12 types de connexion et 25 distributions Linux ; selon ses rapports, 439 tests réussis et un quality gate SonarQube sans anomalie."
  proj.serverfactorycore.blurb: "Le moteur de provisionnement partagé et l’outillage d’images de VM à la base de la gamme Server Factory : pilotes QEMU, Libvirt et Parallels au sein d’un même framework."
  proj.visionengine.blurb: "Perception de l’interface par vision par ordinateur et par vision LLM multifournisseur, avec graphes de navigation."
  pub.fundamentalkotlin.detail: "Auteur indépendant (auto-édition) ; dernière édition révisée en septembre 2022 (3e édition). Également auteur pour Packt Publishing (Royaume-Uni)."
