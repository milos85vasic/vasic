  cl.open.ai: "Infrastructure LLM, agents autonomes et la gouvernance qui les rend fiables."
  comp.ai.label: "Systèmes IA / LLM"
  comp.ai.item1: "Abstraction LLM multifournisseur (40+ fournisseurs), intégration d’outils MCP, RAG, bases de données vectorielles et embeddings"
  comp.ai.item2: "Orchestration d’agents — agents CLI headless, workflows à base de graphes, débat multi-tours et consensus"
  comp.ai.item3: "Planification (HiPlan / MCTS / Tree-of-Thoughts), LLMOps, benchmarking (SWE-bench, HumanEval, MMLU)"
  comp.ai.item4: "Vérification de LLM, garde-fous défensifs pour LLM, vision par ordinateur et vision par LLM"
  comp.android.label: "Android et Android TV"
  comp.android.item1: "Kotlin et Java sur Android, Android TV et AOSP ; Jetpack Compose, Leanback, ExoPlayer"
  comp.android.item2: "Intégration matérielle en temps réel — Bluetooth, OBD2, scanners 3D, pipelines de capteurs"
  comp.android.item3: "Conception de SDK, ingénierie de build Gradle, tests sur appareils via ADB, automatisation des releases"
  comp.backend.label: "Ingénierie backend"
  comp.backend.item1: "Go (Gin), gRPC + Protobuf, HTTP/3 (QUIC), WebSockets"
  comp.backend.item2: "Systèmes distribués, y compris des spécifications formelles TLA+"
  comp.backend.item3: "Services REST à fort débit et workers concurrents"
  comp.cross.label: "SDK multiplateformes et mobiles"
  comp.cross.item1: "Flutter/Dart et React Native au niveau SDK — packages publiés et utilisés par AWS, Google et des banques"
  comp.cross.item2: "Kotlin Multiplatform et logique métier partagée entre Android et iOS"
  comp.cross.item3: "iOS avec Swift ; ponts natifs et canaux de plateforme"
  comp.data.label: "Données"
  comp.data.item1: "PostgreSQL, SQLite, SQLCipher (chiffrement au repos), Redis, Neo4j, ClickHouse"
  comp.data.item2: "Stockage objet — MinIO, S3, GCS, Azure Blob"
  comp.frontend.label: "Frontend et applications de bureau"
  comp.frontend.item1: "TypeScript/React (Tailwind, Redux Toolkit, i18next), Angular"
  comp.frontend.item2: "Applications de bureau Electron et Tauri/Rust"
  comp.frontend.item3: "Accessibilité (WCAG 2.2 AA), budgets de performance, design systems"
  comp.gov.label: "Gouvernance de l’ingénierie"
  comp.gov.item1: "Constitution en sous-module avec héritage et gates de propagation"
  comp.gov.item2: "Rigueur en matière de documentation et de couverture de tests sur un parc de plus de 140 dépôts"
  comp.infra.label: "Infrastructure et DevOps"
  comp.infra.item1: "Docker et Compose, Kubernetes + Helm, Prometheus + Grafana, OpenTelemetry"
  comp.infra.item2: "QEMU, Libvirt, Parallels ; outillage d’images de VM et provisionnement"
  comp.infra.item3: "CI/CD via GitHub Actions, Gradle et Make"
  comp.qa.label: "Assurance qualité et ingénierie qualité"
  comp.qa.item1: "QA anti-bluff fondée sur les preuves (HelixQA) ; harnais de challenges avec gates de mutation"
  comp.qa.item2: "go test -race, tests de régression visuelle, tests sur appareils via ADB"
  comp.qa.item3: "SonarQube et analyse de sécurité — Semgrep, gosec, Trivy, Snyk, Gitleaks, Nancy"
