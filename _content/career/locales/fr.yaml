  summary.body: "Plus de 16 ans d’ingénierie professionnelle, couvrant les SDK mobiles, l’intégration matérielle en temps réel et les backends distribués, convergent aujourd’hui vers un seul objectif : rendre le développement autonome par IA fiable à grande échelle. Je conçois des parcs de composants, pas des monolithes : de grandes applications produit reposant sur des dizaines de petits modules découplés et testés indépendamment, chacun héritant d’une Constitution d’ingénierie commune et vérifié par une démarche QA anti-bluff, fondée sur les preuves."
  summary.lead: "Ingénieur IA/logiciel qui construit des systèmes de développement par IA de bout en bout — de l’infrastructure LLM multifournisseur et des agents autonomes jusqu’aux couches d’assurance qualité et de gouvernance qui les maintiennent fiables et vérifiables. Je ne livre pas des démos : je livre des plateformes."
  summary.value: "Ce que j’apporte : la faculté de porter une fonctionnalité d’IA, de l’idée de recherche jusqu’à un système gouverné, auto-vérifié et prêt pour la production — un routage LLM qui prouve que chaque modèle fonctionne réellement avant de lui faire confiance, des agents qui débattent et atteignent un consensus au lieu de deviner, des couches de mémoire et de RAG qui ne perdent pas le contexte, et tout un écosystème conçu pour que « les tests sont au vert » ne puisse jamais signifier en silence « la fonctionnalité est cassée »."
