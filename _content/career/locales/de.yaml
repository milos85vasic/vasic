  summary.body: 'Mehr als 16 Jahre professionelles Engineering rund um mobile SDKs, Echtzeit-Hardwareintegration und verteilte Backends laufen heute in einem Fokus zusammen: autonome KI-Entwicklung im großen Maßstab vertrauenswürdig zu machen. Ich konzipiere und baue Flotten, keine Monolithen — große Produktanwendungen, die auf Dutzenden kleiner, entkoppelter, unabhängig getesteter Module stehen, von denen jedes eine gemeinsame Engineering-Verfassung erbt und durch eine Anti-Bluff-Qualitätssicherung mit Nachweispflicht verifiziert wird.'
  summary.lead: KI-/Software-Engineer, der KI-Entwicklungssysteme von Anfang bis Ende baut — von Multi-Anbieter-LLM-Infrastruktur und autonomen Agenten bis zu den QA- und Governance-Schichten, die sie ehrlich halten. Ich liefere keine Demos, sondern Plattformen.
  summary.value: 'Das bringe ich mit: die Fähigkeit, eine KI-Fähigkeit von der Forschungsidee zu einem gesteuerten, selbstverifizierenden, produktionsreifen System zu führen — LLM-Routing, das belegt, dass jedes Modell tatsächlich funktioniert, bevor ihm vertraut wird, Agenten, die debattieren und einen Konsens finden, statt zu raten, Memory- und RAG-Schichten, die keinen Kontext verlieren, und ein Gesamtsystem, das so verdrahtet ist, dass „die Tests sind grün“ nie stillschweigend „das Feature ist kaputt“ bedeuten kann.'
  tmpl.cl.emphasis: In diesen Projekten liegt mein Schwerpunkt auf {list} — und dieselbe Disziplin prägt alles, was ich ausliefere.
