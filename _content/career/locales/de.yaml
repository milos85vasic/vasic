  comp.ai.label: KI- und LLM-Systeme
  comp.ai.item1: Abstraktion über mehrere LLM-Anbieter (40+ Anbieter), MCP-Tool-Integration, RAG, Vektordatenbanken und Embeddings
  comp.ai.item2: Agenten-Orchestrierung — Headless-CLI-Agenten, Graph-Workflows, mehrstufige Debatte und Konsensbildung
  comp.ai.item3: Planung (HiPlan / MCTS / Tree-of-Thoughts), LLMOps, Benchmarking (SWE-bench, HumanEval, MMLU)
  comp.ai.item4: LLM-Verifikation, defensive LLM-Guardrails, Computer Vision und LLM-Vision
  comp.android.label: Android und Android TV
  comp.android.item1: Kotlin und Java auf Android, Android TV und AOSP; Jetpack Compose, Leanback, ExoPlayer
  comp.android.item2: Echtzeit-Hardware-Integration — Bluetooth, OBD2, 3D-Scanner, Sensor-Pipelines
  comp.android.item3: SDK-Design, Gradle-Build-Engineering, ADB-Gerätetests, Release-Automatisierung
  comp.backend.label: Backend-Engineering
  comp.backend.item1: Go (Gin), gRPC + Protobuf, HTTP/3 (QUIC), WebSockets
  comp.backend.item2: Verteilte Systeme, einschließlich formaler TLA+-Spezifikationen
  comp.backend.item3: Hochdurchsatz-REST-Services und nebenläufige Worker
  comp.cross.label: Plattformübergreifende und mobile SDKs
  comp.cross.item1: Flutter/Dart und React Native auf SDK-Ebene — veröffentlichte Pakete, die von AWS, Google und Banken genutzt werden
  comp.cross.item2: Kotlin Multiplatform und gemeinsame Geschäftslogik für Android und iOS
  comp.cross.item3: iOS mit Swift; native Bridges und Platform Channels
  comp.data.label: Daten
  comp.data.item1: PostgreSQL, SQLite, SQLCipher (Verschlüsselung ruhender Daten), Redis, Neo4j, ClickHouse
  comp.data.item2: Objektspeicher — MinIO, S3, GCS, Azure Blob
  comp.frontend.label: Frontend und Desktop
  comp.frontend.item1: TypeScript/React (Tailwind, Redux Toolkit, i18next), Angular
  comp.frontend.item2: Desktop-Anwendungen mit Electron und Tauri/Rust
  comp.frontend.item3: Barrierefreiheit (WCAG 2.2 AA), Performance-Budgets, Designsysteme
  comp.gov.label: Engineering-Governance
  comp.gov.item1: Verfassung (Constitution) als Git-Submodul mit Vererbung und Propagations-Gates
  comp.gov.item2: Dokumentations- und Abdeckungsdisziplin über eine Flotte von mehr als 140 Repositories
  comp.infra.label: Infrastruktur und DevOps
  comp.infra.item1: Docker und Compose, Kubernetes + Helm, Prometheus + Grafana, OpenTelemetry
  comp.infra.item2: QEMU, Libvirt, Parallels; Tooling und Provisionierung für VM-Images
  comp.infra.item3: CI/CD mit GitHub Actions, Gradle und Make
  comp.qa.label: QA und Qualitätssicherung
  comp.qa.item1: Anti-Bluff-QA mit Evidenz-Gates (HelixQA); Challenge-Harnesses mit Mutation-Gates
  comp.qa.item2: go test -race, Visual-Regression-Tests, ADB-Gerätetests
  comp.qa.item3: SonarQube und Security-Scans — Semgrep, gosec, Trivy, Snyk, Gitleaks, Nancy
