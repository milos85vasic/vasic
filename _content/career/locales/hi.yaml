  comp.ai.label: AI / LLM सिस्टम
  comp.ai.item1: 'मल्टी-प्रोवाइडर LLM एब्स्ट्रैक्शन (40+ प्रोवाइडर), MCP टूल इंटीग्रेशन, RAG, वेक्टर डेटाबेस और एम्बेडिंग'
  comp.ai.item2: 'एजेंट ऑर्केस्ट्रेशन — headless CLI एजेंट, ग्राफ़ वर्कफ़्लो, बहु-राउंड डिबेट और सहमति'
  comp.ai.item3: 'प्लानिंग (HiPlan / MCTS / Tree-of-Thoughts), LLMOps, बेंचमार्किंग (SWE-bench, HumanEval, MMLU)'
  comp.ai.item4: 'LLM वेरिफ़िकेशन, डिफ़ेंसिव-LLM गार्डरेल, कंप्यूटर विज़न और LLM-विज़न'
  comp.android.label: Android और Android TV
  comp.android.item1: 'Android, Android TV और AOSP पर Kotlin व Java; Jetpack Compose, Leanback, ExoPlayer'
  comp.android.item2: 'रियल-टाइम हार्डवेयर इंटीग्रेशन — Bluetooth, OBD2, 3D स्कैनर, सेंसर पाइपलाइन'
  comp.android.item3: 'SDK डिज़ाइन, Gradle बिल्ड इंजीनियरिंग, ADB डिवाइस टेस्टिंग, रिलीज़ ऑटोमेशन'
  comp.backend.label: बैकएंड इंजीनियरिंग
  comp.backend.item1: 'Go (Gin), gRPC + Protobuf, HTTP/3 (QUIC), WebSockets'
  comp.backend.item2: 'डिस्ट्रिब्यूटेड सिस्टम, जिनमें TLA+ औपचारिक स्पेसिफ़िकेशन शामिल हैं'
  comp.backend.item3: 'हाई-थ्रूपुट REST सर्विसेज़ और समवर्ती वर्कर'
  comp.cross.label: क्रॉस-प्लेटफ़ॉर्म और मोबाइल SDK
  comp.cross.item1: 'SDK स्तर पर Flutter/Dart और React Native — प्रकाशित पैकेज, जिनका उपयोग AWS, Google और बैंक करते हैं'
  comp.cross.item2: 'Kotlin Multiplatform और Android व iOS में साझा बिज़नेस लॉजिक'
  comp.cross.item3: 'Swift के साथ iOS; नेटिव ब्रिज और प्लेटफ़ॉर्म चैनल'
  comp.data.label: डेटा
  comp.data.item1: 'PostgreSQL, SQLite, SQLCipher (डेटा-एट-रेस्ट एन्क्रिप्शन), Redis, Neo4j, ClickHouse'
  comp.data.item2: 'ऑब्जेक्ट स्टोरेज — MinIO, S3, GCS, Azure Blob'
  comp.frontend.label: फ़्रंटएंड और डेस्कटॉप
  comp.frontend.item1: 'TypeScript/React (Tailwind, Redux Toolkit, i18next), Angular'
  comp.frontend.item2: 'Electron और Tauri/Rust डेस्कटॉप एप्लिकेशन'
  comp.frontend.item3: 'एक्सेसिबिलिटी (WCAG 2.2 AA), परफ़ॉर्मेंस बजट, डिज़ाइन सिस्टम'
  comp.gov.label: इंजीनियरिंग गवर्नेंस
  comp.gov.item1: 'इनहेरिटेंस और प्रोपेगेशन गेट के साथ सबमॉड्यूल के रूप में संविधान (Constitution)'
  comp.gov.item2: '140+ रिपॉज़िटरी के फ़्लीट में दस्तावेज़ीकरण और कवरेज अनुशासन'
  comp.infra.label: इन्फ्रास्ट्रक्चर और DevOps
  comp.infra.item1: 'Docker और Compose, Kubernetes + Helm, Prometheus + Grafana, OpenTelemetry'
  comp.infra.item2: 'QEMU, Libvirt, Parallels; VM इमेज टूलिंग और प्रोविज़निंग'
  comp.infra.item3: 'GitHub Actions, Gradle और Make के ज़रिए CI/CD'
  comp.qa.label: QA और क्वालिटी इंजीनियरिंग
  comp.qa.item1: 'Anti-bluff, प्रमाण-आधारित QA (HelixQA); म्यूटेशन गेट वाले चैलेंज हार्नेस'
  comp.qa.item2: 'go test -race, विज़ुअल-रिग्रेशन टेस्टिंग, ADB डिवाइस टेस्टिंग'
  comp.qa.item3: 'SonarQube और सुरक्षा स्कैनिंग — Semgrep, gosec, Trivy, Snyk, Gitleaks, Nancy'
