  exp.bosch.b1: Connected Vehicles SDK का नेतृत्व किया — Bluetooth के ज़रिए OBD2 बस से रियल-टाइम संचार
  exp.bosch.b2: लगातार आने वाली वाहन टेलीमेट्री के लिए हाई-परफ़ॉर्मेंस पार्सिंग, बफ़रिंग और परसिस्टेंस इंजीनियर किए
  exp.bosch.b3: ऐसा SDK शिप किया जिसे ऑटोमोटिव पार्टनर इंटीग्रेशन में व्यापक रूप से अपनाया गया
  exp.bosch.location: बेलग्रेड, सर्बिया
  exp.bosch.role: SDK डेवलपर
  exp.bosch.summary: Connected Vehicles SDK के लीड डेवलपर — Bluetooth के ज़रिए OBD2 बस से रियल-टाइम संचार, हाई-परफ़ॉर्मेंस डेटा प्रोसेसिंग और परसिस्टेंस।
  exp.harness.b1: Feature Flag डिवीज़न के लिए मल्टी-प्लेटफ़ॉर्म SDK परिवार का नेतृत्व किया — Android, iOS, Flutter, React Native और सर्वर-साइड रनटाइम
  exp.harness.b2: ऐसे SDK शिप किए जिन्हें AWS, Google और बैंकिंग पार्टनर उपयोग करते हैं — साझा इवैल्यूएशन इंजन और हर प्लेटफ़ॉर्म की अपनी शैली के अनुरूप API के साथ
  exp.harness.b3: सात भाषाओं और चार पैकेज इकोसिस्टम में रिलीज़ इंजीनियरिंग की ज़िम्मेदारी संभाली
