  proj.catalogizer.blurb: マルチプロトコル対応、暗号化、セルフホスト可能なメディアコレクション管理（Go/Gin + React）。不安定なネットワークストレージにも耐え、再利用可能な21個のサブモジュールで構成。
  proj.coursescreator.blurb: MarkdownからTTS付き動画を生成するAIコースパイプライン。デスクトップ、モバイル、Webの各プレーヤーを備える。
  proj.helixagent.blurb: 単一モデルを信用しない、プロダクショングレードのアンサンブルLLMサービス。プロンプトを多数のプロバイダーに展開し、構造化された複数ラウンドの議論（Proposal → Critique → Review → Synthesis）を行い、リアルタイムの検証スコアに基づいてルーティングし、適切にフォールバックする。HA対応のデータ層、オブザーバビリティ、ガードレールを備えたOpenAI互換APIとして提供。
  proj.helixcode.blurb: 依存関係を考慮してタスクを分割し、SSH管理のワーカー群に分散させる分散AI開発プラットフォーム。チェックポイントとロールバックにより、タスクが中断されても何も失われない。ハードウェアを考慮したモデル選択と、plan/build/test/refactorの全ライフサイクルをREST、CLI、TUI、MCPから利用できる。
  proj.helixconstitution.blurb: Gitサブモジュールとして配布され、140以上のリポジトリに継承される汎用エンジニアリング憲章 — エンジニアリングの規則をコードと同様にバージョン固定して配布する。伝播ゲートが利用側の全リポジトリで必須条項をgrepし、各ゲートには、ゲート自体が形骸化していないことを証明するミューテーションメタテストが対になっている。
  proj.helixllm.blurb: 1つのバイナリ、6つのデプロイモード：ノートPCからマルチホストクラスターまでスケールする、HTTP/3上のOpenAI／Anthropic互換推論サーバー。llama.cpp（CUDA/Metal/ROCm）によるローカル推論と、検証スコアに基づき自動検出されるクラウドのフォールバックチェーンを備え、最終的には必ず、確実に動作するローカルモデルへ縮退（フォールバック）する。
  proj.helixmemory.blurb: Mem0、Cognee、Letta、Graphitiという4つの最高水準のバックエンドを1つのインターフェースに統合する、統合型コグニティブメモリエンジン。並列検索とソース横断のリランキングに対応。
  proj.helixqa.blurb: 「テストが通ること」ではなく「ユーザーが機能を使えること」を基準とする、Go製のアンチブラフQAオーケストレーション。記述済みのYAMLテストバンクに加え、LLMとビジョンによる完全自律セッションで実際のアプリを開いて文書化された全機能を検証し、Android、Android TV、Web、デスクトップにわたって未文書化のバグを探索する。実行時の証拠とAIが修正に着手できるチケットがなければPASSと判定しない。
  proj.helixspecifier.blurb: 仕様駆動開発の統合エンジン。作業規模に応じてプロセスの重さを自ら調整し、マルチエージェントの議論によって仕様を裏付ける。
  proj.helixtrack.blurb: 自由世界向けのJIRA＋Confluence代替。HTTP/3上の統一アクションルーティングAPIの背後にGoマイクロサービスを配置し、SQLCipherによる保存データの暗号化と、Web、デスクトップ、Android、iOSのネイティブクライアントを備える。
  proj.llmorchestrator.blurb: ヘッドレスCLIエージェント（OpenCode、Claude Code、Gemini、Junie、Qwen Code）を起動・制御する、スレッドセーフなコントロールプレーン。パイプとファイルのハイブリッドプロトコルを使用。
  proj.llmprovider.blurb: 43のプロバイダーを1つのインターフェースで扱う。サーキットブレーカー、ヘルスモニタリング、ジッター付きバックオフのリトライ、ハードコードされたフォールバックに頼らない実態に即した正確なモデル検出を備える。
  proj.llmsverifier.blurb: 「Do you see my code?」ゲートを必須とする検証の信頼できる情報源。実際に動作すると証明されたモデルだけが、利用可能としてマークされ、エクスポートされる。
  proj.mailserverfactory.blurb: 宣言的なJSONから、完全にプロビジョニングされたDocker化メールサーバーを生成。12種類の接続タイプと25のLinuxディストリビューションに対応し、439件のテスト合格とクリーンなSonarQubeゲートを報告。
  proj.serverfactorycore.blurb: Server Factoryシリーズを支える共通のプロビジョニングエンジンとVMイメージツール — QEMU、Libvirt、Parallelsの各ドライバーを1つのフレームワークで扱う。
  proj.visionengine.blurb: コンピュータビジョンと、マルチプロバイダー対応のLLMビジョンによるUI認識。ナビゲーショングラフを備える。
  pub.fundamentalkotlin.detail: 自費出版の著者。最新の改訂版は2022年9月（第3版）。Packt Publishing（英国）向けにも執筆。
