  summary.body: モバイルSDK、リアルタイムのハードウェア統合、分散バックエンドにわたる16年以上のプロフェッショナルなエンジニアリング経験は、いま1つの焦点に集約されています。それは、自律的なAI開発を大規模に信頼できるものにすることです。私が設計するのは単一の巨大なモノリスではなく、多数のモジュールが連携する「モジュール群（フリート）」です。数十の小さく疎結合で、独立してテストされたモジュールの上に大規模なプロダクトアプリケーションを構築し、そのすべてが共通のエンジニアリング憲章（Constitution）を継承し、アンチブラフかつ証拠に基づくQAの規律によって検証されます。
  summary.lead: マルチプロバイダー対応のLLMインフラや自律エージェントから、それらの信頼性を担保するQAとガバナンスの層まで、AI開発システムをエンドツーエンドで構築するAI／ソフトウェアエンジニア。デモではなく、プラットフォームをリリースします。
  summary.value: 私が提供できる価値：AI機能を研究段階のアイデアから、ガバナンスの効いた自己検証型の、本番運用を見据えたシステムへと仕上げる力です。信頼する前に各モデルが実際に動作することを確認するLLMルーティング、推測ではなく議論を重ねて合意に至るエージェント、文脈を失わないメモリとRAG層、そして「テストが通っている」ことが「機能が壊れている」ことを黙って意味することが決してないよう構成されたエコシステム全体です。
  tmpl.cl.emphasis: これらのプロジェクトを通じて私が重視してきたのは{list}であり、その同じ規律は、私がリリースするあらゆる成果物にも貫かれています。
