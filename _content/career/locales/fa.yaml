  proj.catalogizer.blurb: 'مدیریت مجموعهٔ رسانه‌ای چندپروتکلی، رمزنگاری‌شده و خودمیزبان (Go/Gin + React)، مقاوم در برابر ناپایداری ذخیره‌سازی شبکه‌ای و ساخته‌شده بر پایهٔ ۲۱ زیرماژول بازاستفاده‌پذیر.'
  proj.coursescreator.blurb: 'خط لولهٔ تولید دوره‌های هوش مصنوعی از markdown تا ویدیو با TTS، همراه با پخش‌کننده‌های دسکتاپ، موبایل و وب.'
  proj.helixagent.blurb: 'سرویس LLM گروهی (ensemble) در سطح تولید که به یک مدل تنها اعتماد نمی‌کند: یک پرامپت را میان ارائه‌دهندگان متعدد پخش می‌کند، مناظرهٔ ساختاریافتهٔ چندمرحله‌ای (پیشنهاد ← نقد ← بازبینی ← ترکیب) اجرا می‌کند و بر اساس امتیاز اعتبارسنجی زنده، با بازگشت به حالت جایگزین به‌صورت تدریجی، مسیریابی می‌کند — پشت یک API سازگار با OpenAI، همراه با لایهٔ داده HA، قابلیت مشاهده‌پذیری و گاردریل‌ها.'
  proj.helixcode.blurb: 'پلتفرم توسعهٔ هوش مصنوعی توزیع‌شده که کار را به وظایف آگاه از وابستگی روی ناوگانی از workerهای مدیریت‌شده با SSH تقسیم می‌کند، سپس نقطهٔ بازیابی (checkpoint) می‌گیرد و در صورت لزوم برمی‌گردد تا با وقفهٔ یک وظیفه چیزی از دست نرود — با انتخاب مدل آگاه از سخت‌افزار و چرخهٔ کامل plan/build/test/refactor پشت REST، CLI، TUI و MCP.'
  proj.helixconstitution.blurb: 'یک آیین‌نامهٔ مهندسی همگانی که به‌صورت زیرماژول Git توزیع می‌شود و در بیش از ۱۴۰ مخزن به ارث می‌رسد — قانون مهندسی دقیقاً مانند کد منتشر و نسخه‌گذاری (version-pin) می‌شود. دروازه‌های سرایت (propagation gates) همهٔ مخزن‌های مصرف‌کننده را با grep برای بندهای لازم جست‌وجو می‌کنند و هر دروازه با یک متاتست جهش (mutation) همراه است که ثابت می‌کند خود دروازه ظاهری و بی‌اثر نیست.'
  proj.helixllm.blurb: 'یک باینری، شش حالت استقرار: استنتاج سازگار با OpenAI و Anthropic روی HTTP/3 که از یک لپ‌تاپ تا خوشهٔ چندمیزبانی مقیاس می‌یابد، با استنتاج محلی llama.cpp (CUDA/Metal/ROCm) و زنجیرهٔ جایگزین ابری با کشف خودکار و امتیازدهی اعتبارسنجی که همیشه در نهایت به یک مدل محلی تضمین‌شده بازمی‌گردد.'
  proj.helixmemory.blurb: 'موتور حافظهٔ شناختی یکپارچه که چهار بک‌اند برتر — Mem0، Cognee، Letta و Graphiti — را پشت یک رابط واحد، با جست‌وجوی موازی و بازرتبه‌بندی میان‌منبعی، ترکیب می‌کند.'
  proj.helixqa.blurb: 'ارکستراسیون QA ضدبلوف به زبان Go بر پایهٔ یک قاعده: معیار «تست‌ها پاس شدند» نیست، بلکه «کاربران می‌توانند از قابلیت استفاده کنند» است. این ابزار بانک‌های تست YAML و نشست‌های کاملاً خودکار LLM و بینایی را اجرا می‌کند که برنامهٔ واقعی را باز می‌کنند، تک‌تک قابلیت‌های مستندشده را اعتبارسنجی می‌کنند و در Android، Android TV، وب و دسکتاپ به‌دنبال باگ‌های مستندنشده می‌گردند؛ و بدون شواهد زمان اجرای ثبت‌شده هرگز نتیجهٔ PASS نمی‌دهد و تیکت‌هایی تولید می‌کند که برای رفع خودکار توسط هوش مصنوعی آماده‌اند.'
  proj.helixspecifier.blurb: 'موتور تلفیقی توسعهٔ مشخصات‌محور (spec-driven) که تشریفات خود را متناسب با اندازهٔ کار مقیاس می‌دهد و مشخصات را با مناظرهٔ چندعاملی پشتیبانی می‌کند.'
  proj.helixtrack.blurb: 'جایگزین آزاد JIRA + Confluence: میکروسرویس‌های Go پشت یک API یکپارچهٔ مبتنی بر مسیریابی اکشن روی HTTP/3، با رمزنگاری SQLCipher برای داده‌های ذخیره‌شده و کلاینت‌های بومی وب، دسکتاپ، Android و iOS.'
  proj.llmorchestrator.blurb: 'صفحهٔ کنترل (control plane) ایمن برای نخ‌ها که عامل‌های CLI بدون رابط — OpenCode، Claude Code، Gemini، Junie و Qwen Code — را از طریق یک پروتکل ترکیبی pipe و فایل راه‌اندازی و هدایت می‌کند.'
  proj.llmprovider.blurb: 'یک رابط واحد روی ۴۳ ارائه‌دهنده، با قطع‌کننده‌های مدار (circuit breaker)، پایش سلامت، تلاش مجدد با backoff تصادفی (jitter) و کشف صادقانهٔ مدل بدون هیچ جایگزین سخت‌کدشده.'
  proj.llmsverifier.blurb: 'مرجع حقیقت برای اعتبارسنجی، با دروازهٔ اجباری «کد من را می‌بینی؟» که یعنی فقط مدل‌هایی که واقعاً کار کردنشان اثبات شده، قابل‌استفاده علامت می‌خورند یا خروجی گرفته می‌شوند.'
  proj.mailserverfactory.blurb: 'از JSON اعلانی تا سرورهای ایمیل کاملاً مستقرشده و داکرایزشده در ۱۲ نوع اتصال و ۲۵ توزیع لینوکس؛ با گزارش ۴۳۹ تست موفق و دروازهٔ SonarQube بدون ایراد.'
  proj.serverfactorycore.blurb: 'موتور مشترک تأمین‌منابع (provisioning) و ابزار ساخت ایمیج ماشین مجازی پشت مجموعهٔ Server Factory — درایورهای QEMU، Libvirt و Parallels زیر یک چارچوب.'
  proj.visionengine.blurb: 'بینایی ماشین به‌علاوهٔ درک رابط کاربری با بینایی LLM چندارائه‌دهنده و گراف‌های ناوبری.'
  pub.fundamentalkotlin.detail: 'خودنشر؛ آخرین ویرایش بازنگری‌شده سپتامبر ۲۰۲۲ (ویرایش سوم). همچنین نویسندهٔ آثاری برای Packt Publishing (بریتانیا).'
  pub.fundamentalkotlin.title: 'Fundamental Kotlin'
