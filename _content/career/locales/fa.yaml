  comp.ai.label: 'سیستم‌های هوش مصنوعی / LLM'
  comp.ai.item1: 'انتزاع چندارائه‌دهنده برای LLM (بیش از ۴۰ ارائه‌دهنده)، یکپارچه‌سازی ابزار از طریق MCP، RAG، پایگاه‌های داده برداری و embedding'
  comp.ai.item2: 'ارکستراسیون عامل‌ها — عامل‌های CLI بدون رابط (headless)، گردش‌کارهای گرافی، مناظرهٔ چندمرحله‌ای و اجماع'
  comp.ai.item3: 'برنامه‌ریزی (HiPlan / MCTS / Tree-of-Thoughts)، LLMOps، بنچمارک (SWE-bench، HumanEval، MMLU)'
  comp.ai.item4: 'اعتبارسنجی LLM، گاردریل‌های دفاعی برای LLM (guardrails)، بینایی ماشین و بینایی مبتنی بر LLM'
  comp.android.label: 'Android و Android TV'
  comp.android.item1: 'Kotlin و Java روی Android، Android TV و AOSP؛ Jetpack Compose، Leanback، ExoPlayer'
  comp.android.item2: 'یکپارچه‌سازی بی‌درنگ سخت‌افزار — Bluetooth، OBD2، اسکنرهای سه‌بعدی، خطوط لولهٔ حسگر'
  comp.android.item3: 'طراحی SDK، مهندسی ساخت با Gradle، آزمون روی دستگاه با ADB، خودکارسازی انتشار'
  comp.backend.label: 'مهندسی بک‌اند'
  comp.backend.item1: 'Go (Gin)، gRPC + Protobuf، HTTP/3 (QUIC)، WebSocket'
  comp.backend.item2: 'سیستم‌های توزیع‌شده، از جمله مشخصات صوری TLA+'
  comp.backend.item3: 'سرویس‌های REST پرگذردهی و workerهای همزمان'
  comp.cross.label: 'SDKهای چندپلتفرمی و موبایل'
  comp.cross.item1: 'Flutter/Dart و React Native در سطح SDK — بسته‌های منتشرشده که AWS، Google و بانک‌ها از آن‌ها استفاده می‌کنند'
  comp.cross.item2: 'Kotlin Multiplatform و منطق کسب‌وکار مشترک میان Android و iOS'
  comp.cross.item3: 'iOS با Swift؛ پل‌های native و کانال‌های پلتفرم'
  comp.data.label: 'داده'
  comp.data.item1: 'PostgreSQL، SQLite، SQLCipher (رمزگذاری در حالت سکون)، Redis، Neo4j، ClickHouse'
  comp.data.item2: 'ذخیره‌سازی شیء — MinIO، S3، GCS، Azure Blob'
  comp.frontend.label: 'فرانت‌اند و دسکتاپ'
  comp.frontend.item1: 'TypeScript/React (Tailwind، Redux Toolkit، i18next)، Angular'
  comp.frontend.item2: 'اپلیکیشن‌های دسکتاپ با Electron و Tauri/Rust'
  comp.frontend.item3: 'دسترس‌پذیری (WCAG 2.2 AA)، بودجهٔ کارایی، سیستم‌های طراحی'
  comp.gov.label: 'حاکمیت مهندسی'
  comp.gov.item1: 'قانون اساسی به‌صورت زیرماژول، با ارث‌بری و دروازه‌های سرایت (propagation gates)'
  comp.gov.item2: 'انضباط مستندسازی و پوشش در ناوگانی با بیش از ۱۴۰ مخزن'
  comp.infra.label: 'زیرساخت و DevOps'
  comp.infra.item1: 'Docker و Compose، Kubernetes + Helm، Prometheus + Grafana، OpenTelemetry'
  comp.infra.item2: 'QEMU، Libvirt، Parallels؛ ابزارهای تصویر ماشین مجازی و تأمین‌منابع (provisioning)'
  comp.infra.item3: 'CI/CD با GitHub Actions، Gradle و Make'
  comp.qa.label: 'QA و مهندسی کیفیت'
  comp.qa.item1: 'QA ضدبلوف و مبتنی بر شواهد (HelixQA)؛ چارچوب‌های challenge با دروازه‌های جهش (mutation)'
  comp.qa.item2: 'go test -race، آزمون رگرسیون بصری، آزمون روی دستگاه با ADB'
  comp.qa.item3: 'SonarQube و اسکن امنیتی — Semgrep، gosec، Trivy، Snyk، Gitleaks، Nancy'
