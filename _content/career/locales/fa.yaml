  summary.body: 'بیش از ۱۶ سال مهندسی حرفه‌ای در SDKهای موبایل، یکپارچه‌سازی بی‌درنگ سخت‌افزار و بک‌اندهای توزیع‌شده، اکنون در یک تمرکز به هم رسیده است: قابل‌اعتماد کردن توسعهٔ خودکار مبتنی بر هوش مصنوعی در مقیاس بزرگ. من مجموعه‌ای از ماژول‌های مستقل می‌سازم، نه سامانه‌های یکپارچهٔ یکدست (monolith) — اپلیکیشن‌های بزرگ محصولی که بر ده‌ها ماژول کوچک و مجزا که هر کدام به‌طور مستقل آزموده می‌شوند بنا شده‌اند؛ هر ماژول از یک «قانون اساسی» مهندسی مشترک ارث می‌برد و با انضباط QA ضدبلوف و مبتنی بر شواهد اعتبارسنجی می‌شود.'
  summary.lead: 'مهندس هوش مصنوعی/نرم‌افزار که سیستم‌های توسعهٔ مبتنی بر هوش مصنوعی را از ابتدا تا انتها می‌سازد — از زیرساخت LLM چندارائه‌دهنده و عامل‌های خودکار تا لایه‌های QA و حاکمیتی که آن‌ها را صادق نگه می‌دارند. من دمو تحویل نمی‌دهم؛ پلتفرم تحویل می‌دهم.'
  summary.value: 'آنچه می‌آورم: توانایی رساندن یک قابلیت هوش مصنوعی از ایدهٔ پژوهشی به سیستمی تحت حاکمیت مهندسی، خودبازبین و آمادهٔ استقرار در محیط تولید — مسیریابی LLM که پیش از اعتماد اثبات می‌کند هر مدل واقعاً کار می‌کند، عامل‌هایی که به‌جای حدس زدن مناظره می‌کنند و به اجماع می‌رسند، لایه‌های حافظه و RAG که زمینه را از دست نمی‌دهند، و یک اکوسیستم کامل که طوری سیم‌کشی شده که «تست‌ها سبزند» هرگز بی‌سروصدا به معنای «قابلیت خراب است» نباشد.'
