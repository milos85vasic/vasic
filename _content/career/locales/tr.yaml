  comp.ai.label: Yapay zekâ ve LLM sistemleri
  comp.ai.item1: 'Çoklu sağlayıcılı LLM soyutlaması (40+ sağlayıcı), MCP araç entegrasyonu, RAG, vektör veritabanları ve embedding''ler'
  comp.ai.item2: 'Ajan orkestrasyonu — headless CLI ajanları, graf iş akışları, çok turlu tartışma ve uzlaşı'
  comp.ai.item3: 'Planlama (HiPlan / MCTS / Tree-of-Thoughts), LLMOps, kıyaslama (SWE-bench, HumanEval, MMLU)'
  comp.ai.item4: 'LLM doğrulaması, savunmacı LLM korumaları (guardrails), bilgisayarlı görü ve LLM görüsü (LLM-vision)'
  comp.android.label: Android ve Android TV
  comp.android.item1: 'Android''de Kotlin ve Java, Android TV ve AOSP; Jetpack Compose, Leanback, ExoPlayer'
  comp.android.item2: 'Gerçek zamanlı donanım entegrasyonu — Bluetooth, OBD2, 3D tarayıcılar, sensör pipeline''ları'
  comp.android.item3: 'SDK tasarımı, Gradle build mühendisliği, ADB ile cihaz testi, sürüm otomasyonu'
  comp.backend.label: Backend mühendisliği
  comp.backend.item1: 'Go (Gin), gRPC + Protobuf, HTTP/3 (QUIC), WebSocket''ler'
  comp.backend.item2: 'TLA+ biçimsel spesifikasyonları dahil dağıtık sistemler'
  comp.backend.item3: 'Yüksek verimli REST servisleri ve eşzamanlı worker''lar'
  comp.cross.label: Çapraz platform ve mobil SDK'lar
  comp.cross.item1: 'SDK seviyesinde Flutter/Dart ve React Native — AWS, Google ve bankalar tarafından kullanılan yayımlanmış paketler'
  comp.cross.item2: 'Kotlin Multiplatform ve Android ile iOS arasında paylaşılan iş mantığı'
  comp.cross.item3: 'Swift ile iOS; yerel köprüler ve platform kanalları'
  comp.data.label: Veri
  comp.data.item1: 'PostgreSQL, SQLite, SQLCipher (bekleyen veri şifrelemesi), Redis, Neo4j, ClickHouse'
  comp.data.item2: 'Nesne depolama — MinIO, S3, GCS, Azure Blob'
  comp.frontend.label: Frontend ve masaüstü
  comp.frontend.item1: 'TypeScript/React (Tailwind, Redux Toolkit, i18next), Angular'
  comp.frontend.item2: 'Electron ve Tauri/Rust masaüstü uygulamaları'
  comp.frontend.item3: 'Erişilebilirlik (WCAG 2.2 AA), performans bütçeleri, tasarım sistemleri'
  comp.gov.label: Mühendislik yönetişimi
  comp.gov.item1: 'Git alt modülü olarak anayasa; kalıtım ve yayılım kapılarıyla (gates)'
  comp.gov.item2: '140+ depodan oluşan bir filo genelinde dokümantasyon ve kapsam disiplini'
  comp.infra.label: Altyapı ve DevOps
  comp.infra.item1: 'Docker ve Compose, Kubernetes + Helm, Prometheus + Grafana, OpenTelemetry'
  comp.infra.item2: 'QEMU, Libvirt, Parallels; VM imajı araçları ve provisioning'
  comp.infra.item3: 'GitHub Actions, Gradle ve Make ile CI/CD'
  comp.qa.label: QA ve kalite mühendisliği
  comp.qa.item1: 'Anti-bluff, kanıta dayalı kapılı QA (HelixQA); mutasyon kapılı challenge harness''ları'
  comp.qa.item2: 'go test -race, görsel regresyon testi, ADB ile cihaz testi'
  comp.qa.item3: 'SonarQube ve güvenlik taraması — Semgrep, gosec, Trivy, Snyk, Gitleaks, Nancy'
