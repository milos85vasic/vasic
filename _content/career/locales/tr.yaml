  summary.body: '16 yılı aşkın profesyonel mühendislik deneyimim — mobil SDK''lar, gerçek zamanlı donanım entegrasyonu ve dağıtık backend''ler — şimdi tek bir odakta buluşuyor: otonom yapay zekâ geliştirmeyi
    ölçekte güvenilir kılmak. Monolit değil, filo tasarlarım: onlarca küçük, birbirinden ayrık, bağımsız test edilen modülün üzerinde yükselen büyük ürün uygulamaları; her biri ortak bir mühendislik Anayasası''nı
    miras alır ve anti-bluff, kanıta dayalı bir QA disiplini ile doğrulanır.'
  summary.lead: Yapay zekâ geliştirme sistemlerini baştan sona inşa eden bir yapay zekâ/yazılım mühendisi — çok sağlayıcılı LLM altyapısı ve otonom ajanlardan, bunları dürüst tutan QA ve yönetişim katmanlarına
    kadar. Demo teslim etmem; platform teslim ederim.
  summary.value: 'Sunduğum değer: bir yapay zekâ yeteneğini araştırma fikrinden yönetilen, kendini doğrulayan, üretime uygun bir sisteme taşıyabilmek — her modelin gerçekten çalıştığını güvenmeden önce
    kanıtlayan LLM yönlendirmesi, tahmin yürütmek yerine tartışıp uzlaşıya varan ajanlar, bağlam kaybetmeyen bellek ve RAG katmanları ve "testler yeşil" ifadesinin asla sessizce "özellik bozuk" anlamına
    gelemeyeceği şekilde bağlanmış bütün bir ekosistem.'
