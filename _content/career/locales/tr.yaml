  proj.catalogizer.blurb: Çok protokollü, şifreli, kendi sunucunda barındırılabilir medya koleksiyonu yönetimi (Go/Gin + React) — güvenilmez ağ depolamasına karşı dayanıklı ve 21 yeniden kullanılabilir
    alt modül üzerine kurulu.
  proj.coursescreator.blurb: TTS ile markdown'dan videoya yapay zekâ destekli kurs pipeline'ı; masaüstü, mobil ve web oynatıcılarıyla.
  proj.helixagent.blurb: 'Tek bir modele güvenmeyi reddeden, üretim kalitesinde ensemble LLM servisi: bir istemi birçok sağlayıcıya dağıtır, yapılandırılmış çok turlu tartışma (Proposal → Critique → Review
    → Synthesis) yürütür ve canlı doğrulama puanlarına göre yönlendirir; sorunsuz yedek devreye alma (fallback) destekler — OpenAI uyumlu bir API''nin ardında yüksek erişilebilirlikli (HA) veri katmanı,
    observability ve guardrails ile.'
  proj.helixcode.blurb: İşi, SSH ile yönetilen bir worker filosu üzerinde bağımlılıkları gözeten görevlere bölen dağıtık yapay zekâ geliştirme platformu; bir görev kesintiye uğradığında hiçbir şey kaybolmasın
    diye checkpoint alır ve geri alır — donanıma göre model seçimi ve REST, CLI, TUI ile MCP arkasında tam plan/build/test/refactor yaşam döngüsüyle.
  proj.helixconstitution.blurb: Git alt modülü olarak dağıtılan ve 140'tan fazla depoda miras alınan evrensel bir mühendislik kuralları kitabı — mühendislik hukuku tıpkı kod gibi yayımlanır ve sürümü sabitlenir.
    Yayılım kapıları, tüketen her depoda gerekli maddeleri arar; her kapı, kapının kendisinin göstermelik olmadığını kanıtlayan bir mutasyon meta-testiyle eşleştirilmiştir.
  proj.helixllm.blurb: 'Tek bir ikili (binary) dosya, altı dağıtım modu: HTTP/3 üzerinden OpenAI ve Anthropic uyumlu çıkarım (inference); dizüstü bilgisayardan çok sunuculu kümeye ölçeklenir, yerel llama.cpp çıkarımı (CUDA/Metal/ROCm)
    ve otomatik keşif yapan, doğrulama puanlı bir bulut yedek (fallback) zinciri sunar — zincir her zaman garantili bir yerel modele düşer.'
  proj.helixmemory.blurb: Kendi sınıfının en iyisi dört backend'i — Mem0, Cognee, Letta, Graphiti — tek arayüz altında birleştiren, paralel arama ve kaynaklar arası yeniden sıralama sunan birleşik bilişsel
    bellek motoru.
  proj.helixqa.blurb: 'Go ile yazılmış, tek bir kurala dayanan anti-bluff QA orkestrasyonu: ölçüt "testler geçiyor" değil, "kullanıcılar özelliği kullanabiliyor"dur. Yazılı YAML test bankalarını ve tam
    otonom LLM-ve-görü oturumlarını çalıştırır; gerçek uygulamayı açar, belgelenmiş her özelliği doğrular, Android, Android TV, Web ve Masaüstü genelinde belgelenmemiş hataları avlar ve yakalanmış çalışma
    zamanı kanıtı ile yapay zekâya hazır düzeltme biletleri olmadan PASS vermeyi reddeder.'
  proj.helixspecifier.blurb: Süreç ağırlığını işin büyüklüğüne göre ölçekleyen ve spesifikasyonları çok ajanlı tartışmayla destekleyen, spesifikasyon güdümlü geliştirme füzyon motoru.
  proj.helixtrack.blurb: 'Özgür dünyanın JIRA + Confluence alternatifi: HTTP/3 üzerinden birleşik, eylem yönlendirmeli bir API''nin ardında Go mikroservisleri, bekleyen veri için SQLCipher şifrelemesi ve yerel Web, Masaüstü,
    Android ve iOS istemcileri.'
  proj.llmorchestrator.blurb: Başsız (headless) CLI ajanlarını — OpenCode, Claude Code, Gemini, Junie, Qwen Code — hibrit pipe-ve-dosya protokolü üzerinden başlatan ve yöneten, thread-safe bir kontrol düzlemi.
  proj.llmprovider.blurb: '43 sağlayıcı için tek arayüz: circuit breaker''lar, sağlık izleme, jittered-backoff yeniden denemeleri ve sabit kodlanmış yedek (fallback) içermeyen, dürüst model keşfi.'
  proj.llmsverifier.blurb: Zorunlu "Kodumu görüyor musun?" kapısı sayesinde yalnızca gerçekten çalıştığı kanıtlanmış modellerin kullanılabilir olarak işaretlendiği veya dışa aktarıldığı, tek doğruluk kaynağı niteliğinde
    bir doğrulama sistemi.
  proj.mailserverfactory.blurb: 'Bildirimsel (declarative) JSON''dan Docker tabanlı, tam kurulu posta sunucularına: 12 bağlantı türü ve 25 Linux dağıtımı genelinde; 439 başarılı test ve temiz bir SonarQube
    kalite kapısı bildirir.'
  proj.serverfactorycore.blurb: Server Factory serisinin altındaki ortak provisioning motoru ve VM imajı araçları — QEMU, Libvirt ve Parallels sürücüleri tek bir çatı altında.
  proj.visionengine.blurb: Bilgisayarlı görü ve çok sağlayıcılı LLM görüsü (LLM-vision) ile gezinme grafları üzerinden arayüz algılama.
  pub.fundamentalkotlin.detail: Kendi kendine yayımlayan yazar; son gözden geçirilmiş baskı Eylül 2022 (3. baskı). Ayrıca Packt Publishing (Birleşik Krallık) için de yazarlık yaptım.
