  "proj.catalogizer.blurb": "Gestión de colecciones multimedia multiprotocolo, cifrada y autoalojable (Go/Gin + React), resiliente ante almacenamiento de red poco fiable y construida sobre 21 submódulos reutilizables."
  "proj.coursescreator.blurb": "Un pipeline de IA para crear cursos en video a partir de markdown, con TTS y reproductores de escritorio, móvil y web."
  "proj.helixagent.blurb": "Un servicio LLM de conjunto (ensemble) listo para producción que se niega a confiar en un solo modelo: distribuye un prompt entre muchos proveedores, ejecuta un debate estructurado de varias rondas (Proposal → Critique → Review → Synthesis) y enruta según puntuaciones de verificación en vivo con respaldo gradual — detrás de una API compatible con OpenAI con una capa de datos HA, observabilidad y guardarraíles."
  "proj.helixcode.blurb": "Una plataforma de desarrollo de IA distribuida que divide el trabajo en tareas que respetan dependencias sobre una flota de workers gestionados por SSH, luego crea puntos de control y revierte para que nada se pierda cuando una tarea se interrumpe — con selección de modelos consciente del hardware y un ciclo de vida completo de plan/construir/probar/refactorizar detrás de REST, CLI, TUI y MCP."
  "proj.helixconstitution.blurb": "Un reglamento de ingeniería universal distribuido como submódulo de Git y heredado por más de 140 repositorios — leyes de ingeniería distribuidas y fijadas a una versión exacta, igual que el código. Las puertas de propagación recorren con grep cada repositorio consumidor en busca de las cláusulas exigidas, y cada puerta tiene un meta-test de mutación que demuestra que la propia puerta no es una farsa."
  "proj.helixllm.blurb": "Un solo binario, seis modos de despliegue: inferencia compatible con OpenAI y Anthropic sobre HTTP/3 que escala desde un portátil hasta un clúster multihost, con inferencia local llama.cpp (CUDA/Metal/ROCm) y una cadena de respaldo en la nube con descubrimiento automático y puntuaciones de verificación que siempre degrada a un modelo local garantizado."
  "proj.helixmemory.blurb": "Un motor de memoria cognitiva unificada que fusiona cuatro backends de primera categoría — Mem0, Cognee, Letta, Graphiti — detrás de una interfaz con búsqueda en paralelo y reordenamiento entre fuentes."
  "proj.helixqa.blurb": "Orquestación QA anti-bluff en Go construida sobre una regla: el criterio no es «las pruebas pasan» sino «los usuarios pueden usar la funcionalidad». Ejecuta bancos de pruebas YAML redactados a mano y sesiones LLM y de visión totalmente autónomas que abren la aplicación real, verifican cada funcionalidad documentada, buscan bugs no documentados a través de Android, Android TV, Web y Escritorio, y se niegan a puntuar un PASS sin evidencia de ejecución capturada más tickets listos para que una IA los corrija."
  "proj.helixspecifier.blurb": "Un motor de fusión de desarrollo guiado por especificaciones que ajusta su propio nivel de formalidad al tamaño del trabajo y respalda las especificaciones con debate multiagente."
  "proj.helixtrack.blurb": "Una alternativa libre al mundo JIRA + Confluence: microservicios Go detrás de una API unificada con enrutamiento de acciones sobre HTTP/3, cifrado SQLCipher en reposo y clientes nativos de Web, Escritorio, Android e iOS."
  "proj.llmorchestrator.blurb": "Un plano de control thread-safe que lanza y controla agentes CLI headless — OpenCode, Claude Code, Gemini, Junie, Qwen Code — sobre un protocolo híbrido de tubería y archivo."
  "proj.llmprovider.blurb": "Una interfaz sobre 43 proveedores con circuit breakers, monitoreo de salud, reintentos con backoff con jitter y descubrimiento honesto de modelos sin respaldo codificado."
  "proj.llmsverifier.blurb": "Una fuente de verdad de verificación cuya puerta obligatoria «¿Ves mi código?» significa que solo los modelos probados para funcionar son marcados como utilizables o exportados."
  "proj.mailserverfactory.blurb": "JSON declarativo a servidores de correo totalmente provisionados y Dockerizados a través de 12 tipos de conexión y 25 distribuciones de Linux; informa 439 pruebas aprobadas y una puerta SonarQube limpia."
  "proj.serverfactorycore.blurb": "El motor de provisionamiento compartido y herramientas de imagen de VM detrás de la línea Server Factory — drivers QEMU, Libvirt y Parallels bajo un solo marco."
  "proj.visionengine.blurb": "Percepción de interfaz mediante visión por computadora más visión LLM multiproveedor, con gráficos de navegación."
