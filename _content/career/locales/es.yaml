  "comp.ai.item1": "Abstracción multiproveedor de LLM (más de 40 proveedores), integración de herramientas MCP, RAG, bases de datos vectoriales y embeddings"
  "comp.ai.item2": "Orquestación de agentes — agentes CLI headless, flujos de trabajo en grafo, debate y consenso multironda"
  "comp.ai.item3": "Planificación (HiPlan / MCTS / Tree-of-Thoughts), LLMOps, benchmarking (SWE-bench, HumanEval, MMLU)"
  "comp.ai.item4": "Verificación de LLM, guardarraíles defensivos para LLM, visión por computadora y visión con LLM"
