  "comp.frontend.item2": "Aplicaciones de escritorio con Electron y Tauri/Rust"
  "comp.frontend.item3": "Accesibilidad (WCAG 2.2 AA), presupuestos de rendimiento, sistemas de diseño"
  "comp.gov.item1": "Constitución como submódulo con herencia y puertas de propagación"
  "comp.gov.item2": "Disciplina de documentación y cobertura en una flota de más de 140 repositorios"
  "comp.infra.item1": "Docker y Compose, Kubernetes + Helm, Prometheus + Grafana, OpenTelemetry"
  "comp.infra.item2": "QEMU, Libvirt, Parallels; herramientas de imágenes de VM y aprovisionamiento"
  "comp.infra.item3": "CI/CD con GitHub Actions, Gradle y Make"
  "comp.qa.item1": "QA anti-bluff basado en evidencia (HelixQA); entornos de ejecución de desafíos con controles (gates) de mutación"
