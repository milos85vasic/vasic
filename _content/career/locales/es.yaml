  "summary.body": "Más de 16 años de ingeniería profesional a través de SDKs móviles, integración de hardware en tiempo real y backends distribuidos, que ahora convergen en un enfoque: hacer que el desarrollo de IA autónomo sea confiable a escala. Diseño flotas, no monolitos: grandes aplicaciones de producto construidas sobre docenas de módulos pequeños, desacoplados y probados de forma independiente, cada uno con una Constitución de ingeniería compartida y verificado mediante una disciplina de QA anti-bluff basada en evidencia."
  "summary.lead": "Ingeniero de IA/software que construye sistemas de desarrollo de IA de extremo a extremo — desde infraestructura LLM multiproveedor y agentes autónomos hasta las capas de QA y gobernanza que los mantienen honestos. No entrego demos: entrego plataformas."
  "summary.value": "Lo que aporto: la capacidad de llevar una capacidad de IA desde una idea de investigación hasta un sistema gobernado, que se autoverifica y está listo para producción — enrutamiento LLM que demuestra que cada modelo funciona antes de confiar en él, agentes que debaten y llegan a consenso en lugar de adivinar, capas de memoria y RAG que no pierden contexto, y un ecosistema completo diseñado de modo que «las pruebas pasan» nunca signifique silenciosamente «la funcionalidad está rota»."
