  "comp.cross.item2": "Kotlin Multiplatform y lógica de negocio compartida entre Android e iOS"
  "comp.cross.item3": "iOS con Swift; puentes nativos y canales de plataforma"
  "comp.data.item1": "PostgreSQL, SQLite, SQLCipher (cifrado en reposo), Redis, Neo4j, ClickHouse"
  "comp.data.item2": "Almacenamiento de objetos — MinIO, S3, GCS, Azure Blob"
