  summary.body: 十六年以上的专业工程经验，横跨移动端 SDK、实时硬件集成与分布式后端，如今汇聚于一个焦点：让自主 AI 开发在大规模下值得信赖。我构建的是由众多模块组成的体系，而非单体应用——大型产品应用建立在数十个小而解耦、可独立测试的模块之上，每个模块都继承同一部工程宪法，并通过反虚报、以证据为门禁的 QA 规范加以验证。
  summary.lead: AI/软件工程师，端到端构建 AI 开发系统——从多提供商 LLM 基础设施和自主智能体，到确保其诚实可靠的 QA 与治理层。我不交付演示，我交付平台。
  summary.value: 我能带来的价值：将 AI 能力从研究构想落地为受治理、可自我验证、具备生产形态的系统——在信任之前先证明每个模型确实可用的 LLM 路由；通过辩论达成共识而非凭空猜测的智能体；不丢失上下文的记忆与 RAG 层；以及整套生态的联动设计，使“测试全绿”绝不会悄然变成“功能已坏”。
