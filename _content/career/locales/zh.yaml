  proj.catalogizer.blurb: 支持多协议、加密、可自托管的媒体库管理系统（Go/Gin + React），能够应对不稳定的网络存储，并基于 21 个可复用子模块构建。
  proj.coursescreator.blurb: 将 Markdown 转换为视频的 AI 课程制作流水线，配有 TTS 以及桌面端、移动端和 Web 播放器。
  proj.helixagent.blurb: 生产级的多模型集成（Ensemble）LLM 服务，不盲信任何单一模型：它将提示词分发给多个提供商，运行结构化的多轮辩论（提案 → 批评 → 评审 → 综合），并依据实时验证得分进行路由，同时具备平滑回退能力——通过兼容 OpenAI 的 API 对外提供服务，配有高可用数据层、可观测性与护栏。
  proj.helixcode.blurb: 分布式 AI 开发平台：将工作拆分为具备依赖感知的任务，分发到由 SSH 管理的工作节点集群，并通过检查点与回滚机制保证任务中断时不丢失任何进度——支持按硬件选择模型，并通过 REST、CLI、TUI 和 MCP 提供完整的规划/构建/测试/重构生命周期。
  proj.helixconstitution.blurb: 一部以 Git 子模块形式分发、被 140 多个代码仓库继承的通用工程宪法——工程规则像代码一样发布并锁定版本。传播门禁会在每个引用该宪法的仓库中检查是否包含所需条款，且每个门禁都配有一个变异元测试，用以证明门禁本身并非摆设。
  proj.helixllm.blurb: 单一可执行文件，六种部署模式：通过 HTTP/3 提供兼容 OpenAI 与 Anthropic 的推理服务，可从笔记本电脑扩展到多主机集群，支持本地 llama.cpp 推理（CUDA/Metal/ROCm），并具备自动发现、按验证得分排序的云端回退链，最终总能降级到有保障的本地模型。
  proj.helixmemory.blurb: 统一的认知记忆引擎：将四个同类最佳的后端（Mem0、Cognee、Letta、Graphiti）统一整合在同一接口之后，支持并行搜索与跨来源重排序。
  proj.helixqa.blurb: 用 Go 构建的反虚报 QA 编排系统，秉持一条原则：标准不是“测试通过”，而是“用户能够使用该功能”。它既运行编写好的 YAML 测试库，也运行全自主的 LLM 与视觉会话：打开真实应用，核验每项已文档化的功能，在 Android、Android TV、Web 与桌面端上排查未文档化的缺陷；若缺少已捕获的运行时证据及可供 AI 直接修复的工单，一律不判定 PASS。
  proj.helixspecifier.blurb: 规格驱动开发的融合引擎：流程的繁简随工作规模自动调整，并以多智能体辩论为规格提供支撑。
  proj.helixtrack.blurb: 免费的 JIRA + Confluence 替代方案：基于 Go 微服务，通过 HTTP/3 提供统一的动作路由 API，使用 SQLCipher 实现静态数据加密，并提供原生的 Web、桌面端、Android 和 iOS 客户端。
  proj.llmorchestrator.blurb: 线程安全的控制平面，通过管道与文件混合协议启动并驱动无头 CLI 智能体（OpenCode、Claude Code、Gemini、Junie、Qwen Code）。
  proj.llmprovider.blurb: 覆盖 43 家提供商的统一接口，具备熔断器、健康监控、带抖动的退避重试，以及如实的、不含硬编码回退的模型发现机制。
  proj.llmsverifier.blurb: 验证结果的唯一可信来源：其强制性的“Do you see my code?”门禁确保只有经证明确实可用的模型才会被标记为可用或被导出。
  proj.mailserverfactory.blurb: 将声明式 JSON 转换为完整部署就绪、基于 Docker 的邮件服务器，支持 12 种连接类型和 25 个 Linux 发行版；报告 439 项测试通过，SonarQube 质量门禁无告警。
  proj.serverfactorycore.blurb: Server Factory 产品线背后共用的环境部署（Provisioning）引擎与虚拟机镜像工具——在同一框架下提供 QEMU、Libvirt 和 Parallels 驱动。
  proj.visionengine.blurb: 结合计算机视觉与多提供商 LLM 视觉的界面感知引擎，并带有导航图。
  pub.fundamentalkotlin.detail: 自出版作者；最新修订版为 2022 年 9 月（第 3 版）。同时也为 Packt Publishing（英国）撰写过图书。
