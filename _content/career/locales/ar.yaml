  summary.body: "تتقاطع أكثر من 16 عاماً من الخبرة الهندسية المهنية في حزم SDK للجوال، والتكامل مع العتاد في الوقت الفعلي، والأنظمة الخلفية الموزعة، لتلتقي عند هدف واحد: جعل التطوير المستقل بالذكاء الاصطناعي جديراً بالثقة على نطاق واسع. أصمّم أساطيل لا كتلاً متراصة: تطبيقات منتجات كبيرة تقوم على عشرات الوحدات الصغيرة المنفصلة والمختبرة باستقلالية، وترث كل وحدة منها دستوراً هندسياً مشتركاً، ويتحقق منها منهج لضمان الجودة قائم على الأدلة ومكافحة للتضليل (anti-bluff)."
  summary.lead: "مهندس ذكاء اصطناعي وبرمجيات يبني أنظمة التطوير بالذكاء الاصطناعي من البداية إلى النهاية — من البنية التحتية متعددة المزوّدين لنماذج LLM والوكلاء المستقلين، إلى طبقات ضمان الجودة والحوكمة التي تحافظ على مصداقيتها. لا أُصدر عروضاً تجريبية؛ بل أُصدر منصات."
  summary.value: "ما أقدّمه: القدرة على نقل أي إمكانية في الذكاء الاصطناعي من فكرة بحثية إلى نظام محكوم وذاتي التحقق وجاهز للإنتاج — توجيه لنماذج LLM يثبت أن كل نموذج يعمل فعلاً قبل الوثوق به، ووكلاء يتناقشون ويتوصلون إلى إجماع بدل التخمين، وطبقات ذاكرة وRAG لا تفقد السياق، ومنظومة متكاملة مترابطة بحيث لا يمكن أن يعني «نجاح الاختبارات» بصمت أن «الميزة معطلة»."
