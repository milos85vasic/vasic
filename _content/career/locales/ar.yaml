  comp.ai.label: "أنظمة الذكاء الاصطناعي وLLM"
  comp.ai.item1: "تجريد LLM متعدد المزوّدين (أكثر من 40 مزوّداً)، وتكامل أدوات MCP، وRAG، وقواعد البيانات المتجهية والتضمينات (embeddings)"
  comp.ai.item2: "تنسيق الوكلاء — وكلاء CLI عديمو الواجهة، وسير عمل قائم على المخططات البيانية (graph workflows)، ونقاش متعدد الجولات وتوافق في الآراء"
  comp.ai.item3: "التخطيط (HiPlan / MCTS / Tree-of-Thoughts)، وLLMOps، والاختبارات المعيارية (SWE-bench وHumanEval وMMLU)"
  comp.ai.item4: "التحقق من LLM، وضوابط حماية دفاعية لنماذج LLM، والرؤية الحاسوبية ورؤية LLM"
  comp.android.label: "Android وAndroid TV"
  comp.android.item1: "Kotlin وJava على Android وAndroid TV وAOSP؛ وJetpack Compose وLeanback وExoPlayer"
  comp.android.item2: "التكامل مع العتاد في الوقت الفعلي — Bluetooth وOBD2 والماسحات ثلاثية الأبعاد وخطوط معالجة المستشعرات"
  comp.android.item3: "تصميم حزم SDK، وهندسة بناء Gradle، واختبار الأجهزة عبر ADB، وأتمتة الإصدارات"
  comp.backend.label: "هندسة الأنظمة الخلفية"
  comp.backend.item1: "Go (Gin)، وgRPC مع Protobuf، وHTTP/3 (QUIC)، وWebSockets"
  comp.backend.item2: "الأنظمة الموزعة، بما في ذلك مواصفات TLA+ الصورية"
  comp.backend.item3: "خدمات REST عالية الإنتاجية وعمليات معالجة متزامنة"
  comp.cross.label: "حزم SDK متعددة المنصات وتطوير الجوال"
  comp.cross.item1: "Flutter/Dart وReact Native على مستوى SDK — حزم منشورة تستخدمها AWS وGoogle ومصارف"
  comp.cross.item2: "Kotlin Multiplatform ومنطق الأعمال المشترك بين Android وiOS"
  comp.cross.item3: "iOS بلغة Swift؛ والجسور الأصلية (native bridges) وقنوات المنصة (platform channels)"
  comp.data.label: "البيانات"
  comp.data.item1: "PostgreSQL وSQLite وSQLCipher (التشفير أثناء التخزين) وRedis وNeo4j وClickHouse"
  comp.data.item2: "التخزين الكائني — MinIO وS3 وGCS وAzure Blob"
  comp.frontend.label: "الواجهات الأمامية وسطح المكتب"
  comp.frontend.item1: "TypeScript/React (مع Tailwind وRedux Toolkit وi18next) وAngular"
  comp.frontend.item2: "تطبيقات سطح المكتب بتقنيتي Electron وTauri/Rust"
  comp.frontend.item3: "إمكانية الوصول (WCAG 2.2 AA)، وميزانيات الأداء، وأنظمة التصميم"
  comp.gov.label: "حوكمة الهندسة"
  comp.gov.item1: "الدستور الهندسي كوحدة فرعية (submodule) مع الوراثة وبوابات الانتشار"
  comp.gov.item2: "الانضباط في التوثيق والتغطية عبر أسطول يضم أكثر من 140 مستودعاً"
  comp.infra.label: "البنية التحتية وDevOps"
  comp.infra.item1: "Docker وCompose وKubernetes مع Helm وPrometheus مع Grafana وOpenTelemetry"
  comp.infra.item2: "QEMU وLibvirt وParallels؛ وأدوات صور الأجهزة الافتراضية والتهيئة"
  comp.infra.item3: "التكامل والتسليم المستمر (CI/CD) عبر GitHub Actions وGradle وMake"
  comp.qa.label: "ضمان الجودة وهندسة الجودة"
  comp.qa.item1: "ضمان جودة قائم على الأدلة ومكافح للتضليل (HelixQA)؛ وأطر اختبار تحدّيات (challenge harnesses) مع بوابات اختبار الطفرات"
  comp.qa.item2: "go test -race، واختبار الانحدار البصري، واختبار الأجهزة عبر ADB"
  comp.qa.item3: "SonarQube وفحوص الأمان — Semgrep وgosec وTrivy وSnyk وGitleaks وNancy"
