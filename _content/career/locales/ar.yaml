  proj.catalogizer.blurb: "إدارة مجموعات الوسائط متعددة البروتوكولات، مشفّرة وقابلة للاستضافة الذاتية (Go/Gin وReact)، تتحمل تقلبات التخزين الشبكي غير المستقر، ومبنية على 21 وحدة فرعية قابلة لإعادة الاستخدام."
  proj.coursescreator.blurb: "خط إنتاج دورات بالذكاء الاصطناعي يحوّل markdown إلى فيديو مع تحويل النص إلى كلام (TTS)، ومشغّلات لسطح المكتب والجوال والويب."
  proj.helixagent.blurb: "خدمة LLM قائمة على تجميع النماذج (ensemble) بمستوى الإنتاج ترفض الاعتماد على نموذج واحد: توزّع الطلب على عدة مزوّدين، وتُجري نقاشاً منظماً متعدد الجولات (Proposal → Critique → Review → Synthesis)، وتوجّه الطلبات وفق درجات تحقق حيّة مع انتقال سلس إلى بدائل احتياطية — خلف واجهة API متوافقة مع OpenAI، مع طبقة بيانات عالية التوافرية، ومراقبة، وضوابط حماية."
  proj.helixcode.blurb: "منصة تطوير موزعة بالذكاء الاصطناعي تقسّم العمل إلى مهام تراعي التبعيات على أسطول من عقد التنفيذ (workers) يُدار عبر SSH، ثم تنشئ نقاط حفظ (checkpoints) وتتراجع عنها بحيث لا يضيع شيء عند انقطاع أي مهمة — مع اختيار للنماذج يراعي العتاد، ودورة حياة كاملة (plan/build/test/refactor) خلف REST وCLI وTUI وMCP."
  proj.helixconstitution.blurb: "كتاب قواعد هندسي شامل يُوزَّع كوحدة فرعية (submodule) في Git وتَرثه أكثر من 140 مستودعاً — قانون هندسي يُشحن ويُثبَّت على إصدار محدد تماماً كالشيفرة البرمجية. بوابات الانتشار تفحص بـ grep كل مستودع مستهلك بحثاً عن البنود المطلوبة، وتُقرن كل بوابة باختبار طفرات (mutation meta-test) يثبت أنها ليست شكلية."
  proj.helixllm.blurb: "ملف تنفيذي واحد وستة أنماط نشر: استدلال متوافق مع OpenAI وAnthropic عبر HTTP/3 يتوسع من حاسوب محمول إلى عنقود متعدد الخوادم، مع استدلال محلي عبر llama.cpp (CUDA/Metal/ROCm) وسلسلة بدائل سحابية تكتشف النماذج تلقائياً وتُرتَّب بدرجات التحقق، وتتراجع دائماً إلى نموذج محلي مضمون."
  proj.helixmemory.blurb: "محرك ذاكرة معرفية موحد يدمج أربع واجهات خلفية (backends) هي الأفضل في فئتها — Mem0 وCognee وLetta وGraphiti — خلف واجهة واحدة، مع بحث متوازٍ وإعادة ترتيب النتائج عبر المصادر."
  proj.helixqa.blurb: "تنسيق لضمان الجودة بمنهج «مكافحة التضليل» (anti-bluff) مكتوب بلغة Go ومبني على قاعدة واحدة: المعيار ليس «نجاح الاختبارات» بل «قدرة المستخدمين على استخدام الميزة». يشغّل بنوك اختبارات YAML مكتوبة، وجلسات مستقلة تماماً تعتمد على LLM والرؤية الحاسوبية تفتح التطبيق الفعلي وتتحقق من كل ميزة موثقة وتبحث عن الأخطاء غير الموثقة عبر Android وAndroid TV والويب وسطح المكتب، ويرفض منح PASS دون دليل تشغيل موثّق، إضافةً إلى تذاكر جاهزة لإصلاحها بالذكاء الاصطناعي."
  proj.helixspecifier.blurb: "محرك دمج لتطوير البرمجيات القائم على المواصفات، يضبط حجم إجراءاته وفق حجم العمل ويدعم المواصفات بنقاش متعدد الوكلاء."
  proj.helixtrack.blurb: "بديل حر لـ JIRA وConfluence: خدمات Go مصغّرة خلف واجهة برمجية موحدة تعتمد التوجيه بالإجراءات عبر HTTP/3، وتشفير SQLCipher للبيانات المخزّنة، وتطبيقات عميلة أصلية (native clients) للويب وسطح المكتب وAndroid وiOS."
  proj.llmorchestrator.blurb: "طبقة تحكم آمنة للخيوط (thread-safe) تُشغّل وكلاء CLI عديمي الواجهة وتتحكم بهم — OpenCode وClaude Code وGemini وJunie وQwen Code — عبر بروتوكول هجين من الأنابيب والملفات."
  proj.llmprovider.blurb: "واجهة واحدة فوق 43 مزوّداً، مع قواطع الدائرة (circuit breakers)، ومراقبة الصحة، وإعادة المحاولة بتأخير عشوائي (jittered backoff)، واكتشاف نزيه للنماذج دون بدائل مضمّنة في الشيفرة (no-hardcoded-fallback)."
  proj.llmsverifier.blurb: "مرجع موثوق للتحقق يفرض بوابة إلزامية «Do you see my code?»، بحيث لا تُصنَّف «صالحة للاستخدام» ولا تُصدَّر إلا النماذج التي ثبت فعلاً أنها تعمل."
  proj.mailserverfactory.blurb: "من JSON تصريحي (declarative) إلى خوادم بريد مهيّأة بالكامل ومعبّأة في Docker، عبر 12 نوعاً من الاتصال و25 توزيعة Linux؛ ويُبلغ عن نجاح 439 اختباراً وبوابة SonarQube نظيفة."
  proj.serverfactorycore.blurb: "محرك تجهيز الخوادم المشترك وأدوات صور الأجهزة الافتراضية (VM images) خلف خط Server Factory — برامج تشغيل (drivers) QEMU وLibvirt وParallels ضمن إطار واحد."
  proj.visionengine.blurb: "الرؤية الحاسوبية مع إدراك واجهات المستخدم عبر رؤية LLM متعددة المزوّدين، مع رسوم بيانية للتنقل."
  pub.fundamentalkotlin.detail: "مؤلف ناشر ذاتياً؛ آخر طبعة منقّحة في سبتمبر 2022 (الطبعة الثالثة). ألّف أيضاً لدى دار Packt Publishing (المملكة المتحدة)."
  pub.fundamentalkotlin.title: "Fundamental Kotlin"
