  summary.body: '16 жылдан астам кәсіби инженерлік тәжірибе — мобильді SDK, нақты уақыттағы аппараттық интеграция және үлестірілген
    backend — қазір бір бағытқа тоғысты: автономды ЖИ-әзірлеуді ауқымда сенімді ету. Мен монолиттерді емес, модульдер экожүйесін
    (флот) жобалаймын: ортақ инженерлік Конституцияны мұралайтын және anti-bluff, дәлелге негізделген QA тәртібімен тексерілетін,
    ондаған шағын, өзара байланыссыз, дербес тестіленетін модульдерге сүйенетін ірі өнім қолданбалары.'
  summary.lead: ЖИ-әзірлеу жүйелерін басынан аяғына дейін құратын ЖИ/бағдарламалық жасақтама инженерімін — көп провайдерлі
    LLM инфрақұрылымы мен автономды агенттерден бастап, оларды адал ұстайтын QA және басқару қабаттарына дейін. Мен демо емес,
    платформалар жеткіземін.
  summary.value: 'Мен не әкелемін: ЖИ мүмкіндігін зерттеу идеясынан басқарылатын, өзін-өзі тексеретін, өндіріске дайын жүйеге
    дейін жеткізу қабілеті — әр модельдің шынымен жұмыс істейтінін сенер алдында дәлелдейтін LLM маршруттау, болжаудың орнына
    пікірталас жүргізіп консенсусқа келетін агенттер, контекстті жоғалтпайтын жады мен RAG қабаттары және «тесттер жасыл»
    дегені «функция бұзылған» дегенді үнсіз жасыра алмайтындай жалғанған бүкіл экожүйе.'
