  exp.bosch.b2: Үздіксіз көлік телеметриясын жоғары өнімді талдау, буферлеу және сақтау тетіктерін әзірледім.
  exp.bosch.b3: Автомобиль саласындағы әріптестердің интеграцияларында қабылданған SDK жеткіздім.
  exp.bosch.location: Белград, Сербия
  exp.bosch.role: SDK әзірлеушісі
  exp.bosch.summary: Connected Vehicles SDK жетекші әзірлеушісі — Bluetooth арқылы OBD2 шинасымен нақты уақыттағы байланыс,
    деректерді жоғары өнімді өңдеу және сақтау.
  exp.harness.b1: Feature Flag бөлімінің көпплатформалы SDK отбасын басқардым — Android, iOS, Flutter, React Native және сервер
    жағындағы орталар.
  exp.harness.b2: 'AWS, Google және банк әріптестері пайдаланатын SDK жеткіздім: ортақ бағалау қозғалтқышы және әр платформаның ерекшеліктеріне сай келетін
    API-лармен.'
  exp.harness.b3: Жеті тіл мен төрт пакет экожүйесі бойынша релиз инженериясына жауапты болдым.
  exp.harness.location: Белград, Сербия
  exp.harness.role: SDK әзірлеушісі
  exp.harness.summary: 'Компанияның Feature Flag бөліміне арналған SDK отбасының жетекші әзірлеушісі — барлық негізгі мобильді
    платформаларға және одан тыс бағытталған. Клиенттер мен әріптестер: AWS, Google және әртүрлі банктер.'
