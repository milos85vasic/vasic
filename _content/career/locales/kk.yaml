  cl.open.android: 'Менің бағытым — өнім ауқымындағы Kotlin және Java: SDK, аппараттық интеграция және релиз инженериясы.'
  cl.open.androidtv: Менің бағытым — теледидар экранына арналған (ten-foot) интерфейстер, Leanback, медиа конвейерлері және
    құрылғылар тобында тексеру.
  cl.open.aosp: 'Менің бағытым — платформа деңгейіндегі Android: жүйелік қызметтер, құрылғыны іске қосу және аппараттық интеграция.'
  cl.open.desktop: Менің бағытым — Electron және Tauri, нативті көпірлер және offline-first десктоп өнімдері.
  cl.open.flutter: 'Менің бағытым — SDK деңгейіндегі Dart: плагин архитектурасы, платформалық арналар және жарияланған пакеттер.'
  cl.open.go: Менің бағытым — жоғары өткізу қабілетті сервистер, үлестірілген жүйелер және олар құрылатын кітапханалар.
  cl.open.mobile: Менің бағытым — Android, iOS, Flutter және React Native арқылы нативті және кроссплатформалық жеткізу.
  cl.open.reactnative: 'Менің бағытым — нативті көпір арқылы жұмыс істейтін TypeScript: нативті модульдер, SDK пакеттері және релизді автоматтандыру.'
  cl.open.web: Менің бағытым — TypeScript, React және Angular — дизайн-жүйелер, қолжетімділік және өнімділік бюджеттері.
  comp.ai.item1: "LLM-дің көп провайдерлі абстракциясы (40+ провайдер), MCP құралдарын біріктіру, RAG, векторлық дерекқорлар және эмбеддингтер"
  comp.ai.item2: "Агенттерді оркестрлеу — headless CLI агенттері, граф-workflow-лар, көп раундты пікірталас және консенсус"
  comp.ai.item3: "Жоспарлау (HiPlan / MCTS / Tree-of-Thoughts), LLMOps, бенчмаркинг (SWE-bench, HumanEval, MMLU)"
  comp.ai.item4: "LLM верификациясы, defensive-LLM guardrails, компьютерлік көру және LLM-vision"
  comp.ai.label: ЖИ / LLM жүйелері
