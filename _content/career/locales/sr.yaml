  summary.body: "Више од 16 година професионалног инжењерства — мобилни SDK-ови, интеграција хардвера у реалном времену и дистрибуирани бекендови — данас се своди на један фокус: да аутономни AI развој учиним поузданим у великом обиму. Градим флоте, а не монолите — велике апликације спремне за продукцију које стоје на десетинама малих, раздвојених, независно тестираних модула, од којих сваки наслеђује заједнички инжењерски Устав и проверава се anti-bluff QA дисциплином заснованом на доказима."
  summary.lead: "AI/софтверски инжењер који од почетка до краја гради системе за AI развој — од LLM инфраструктуре за више провајдера и аутономних агената до QA и слојева управљања који их одржавају поузданим и проверљивим. Не испоручујем демо верзије; испоручујем платформе."
  summary.value: "Шта доносим: способност да AI могућност преведем из истраживачке идеје у систем којим се управља, који сам себе проверава и спреман је за продукцију — LLM рутирање које доказује да сваки модел заиста ради пре него што му се поверује, агенти који дебатују и постижу консензус уместо да погађају, слојеви меморије и RAG-а који не губе контекст и цео екосистем повезан тако да „тестови су зелени“ никада не може тихо да значи „функција је неисправна“."
