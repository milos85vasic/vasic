  proj.catalogizer.blurb: "Управљање медијским колекцијама преко више протокола, шифровано и са могућношћу самосталног хостовања (Go/Gin + React), отпорно на нестабилна мрежна складишта и изграђено на 21 вишекратно употребљивом подмодулу."
  proj.coursescreator.blurb: "AI pipeline за курсеве који претвара markdown у видео, са TTS-ом и плејерима за десктоп, мобилне уређаје и веб."
  proj.helixagent.blurb: "LLM сервис спреман за продукцију који комбинује више модела и одбија да верује једном моделу: прослеђује упит многим провајдерима, води структурисану дебату у више рунди (Предлог → Критика → Преглед → Синтеза) и усмерава на основу резултата верификације уживо уз контролисан прелазак на резервну опцију — иза API-ја компатибилног са OpenAI-јем, са HA слојем података, уочљивошћу система (observability) и заштитним механизмима."
  proj.helixcode.blurb: "Дистрибуирана платформа за AI развој. Дели посао на задатке са праћењем међузависности преко флоте радника којима се управља преко SSH-а, прави контролне тачке и омогућава повратак на претходно стање, тако да ништа не нестаје када се задатак прекине. Бира моделе прилагођене хардверу и покрива цео животни циклус планирање/изградња/тестирање/рефакторисање иза REST-а, CLI-ја, TUI-ја и MCP-а."
  proj.helixconstitution.blurb: "Универзални инжењерски устав који се дистрибуира као Git submodule и наслеђује у више од 140 репозиторијума — инжењерски закон се испоручује и верзионише тачно као код. Капије за ширење правила претражују сваки репозиторијум који га користи у потрази за обавезним клаузулама, а свака капија има упарен мутациони мета-тест који доказује да сама капија није лажна."
  proj.helixllm.blurb: "Један бинарни фајл, шест режима примене: инференција компатибилна са OpenAI-јем и Anthropic-ом преко HTTP/3 која се скалира од лаптопа до кластера са више хостова, са локалном llama.cpp инференцијом (CUDA/Metal/ROCm) и ланцем резервних облачних провајдера који се сам открива и бодује верификацијом, а увек се спушта на загарантовани локални модел."
  proj.helixmemory.blurb: "Јединствени мотор когнитивне меморије који обједињује четири најбоља бекенда — Mem0, Cognee, Letta, Graphiti — иза једног интерфејса, са паралелном претрагом и поновним рангирањем преко више извора."
  proj.helixqa.blurb: "Anti-bluff QA оркестрација у језику Go заснована на једном правилу: мерило није „тестови пролазе“ већ „корисници могу да користе функционалност“. Покреће написане YAML банке тестова и потпуно аутономне сесије засноване на LLM-у и рачунарској визији које отварају праву апликацију, проверавају сваку документовану функционалност, траже недокументоване грешке на Android-у, Android TV-у, вебу и десктопу и одбијају да доделе PASS без снимљеног доказа о раду и тикета за исправку које AI може директно да обради."
  proj.helixspecifier.blurb: "Мотор за спајање приступа развоју вођеног спецификацијама који сам прилагођава формалност процеса величини посла и подупире спецификације дебатом више агената."
  proj.helixtrack.blurb: "Алтернатива за JIRA + Confluence из слободног света: Go микросервиси иза јединственог API-ја усмереног акцијама преко HTTP/3, SQLCipher шифровање података у мировању и нативни клијенти за веб, десктоп, Android и iOS."
  proj.llmorchestrator.blurb: "Контролна раван безбедна за рад у више нити која покреће и води headless CLI агенте — OpenCode, Claude Code, Gemini, Junie, Qwen Code — преко хибридног протокола заснованог на цевима и фајловима."
  proj.llmprovider.blurb: "Један интерфејс преко 43 провајдера, са circuit breaker-има, праћењем здравља, поновним покушајима са експоненцијалним одлагањем и насумичним варирањем (џитером) и поштеним откривањем модела без уграђених резервних вредности."
  proj.llmsverifier.blurb: "Извор истине за верификацију чија обавезна капија „Видиш ли мој код?“ значи да се само модели који доказано раде означавају као употребљиви или извозе."
  proj.mailserverfactory.blurb: "Декларативни JSON у потпуно подешене и спремне за рад Docker сервере за е-пошту за 12 типова веза и 25 Linux дистрибуција; пријављује 439 успешних тестова и чисту SonarQube капију."
  proj.serverfactorycore.blurb: "Заједнички мотор за обезбеђивање окружења и алати за VM слике иза линије Server Factory — QEMU, Libvirt и Parallels драјвери под једним фрејмворком."
  proj.visionengine.blurb: "Перцепција корисничког интерфејса заснована на рачунарској визији и LLM-визији више провајдера, са навигационим графовима."
  pub.fundamentalkotlin.detail: "Књигу сам објавио самостално; последње ревидирано издање — септембар 2022. (треће издање). Писао сам и за издавача Packt Publishing (УК)."
