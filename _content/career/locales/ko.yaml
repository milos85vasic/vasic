  summary.body: "모바일 SDK, 실시간 하드웨어 통합, 분산 백엔드에 걸친 16년 이상의 전문 엔지니어링 경험이 이제 하나의 초점으로 모입니다: 자율 AI 개발을 대규모에서 신뢰할 수 있게 만드는 것입니다. 저는 모놀리스가 아니라 수많은 모듈로 이루어진 제품군을 설계합니다 — 작고 분리되어 독립적으로 테스트되는 수십 개의 모듈을 기반으로 한 대규모 제품 애플리케이션이며, 모든 모듈은 공통의 엔지니어링 헌법을 상속하고 블러프 방지(anti-bluff), 증거 기반 QA 원칙으로 검증됩니다."
  summary.lead: "AI/소프트웨어 엔지니어로서 AI 개발 시스템을 처음부터 끝까지 구축합니다 — 다중 제공자 LLM 인프라와 자율 에이전트부터 이를 정직하게 유지하는 QA 및 거버넌스 계층까지. 저는 데모가 아니라 플랫폼을 출시합니다."
  summary.value: "제가 제공하는 가치: AI 역량을 연구 아이디어에서 거버넌스가 적용되고 스스로 검증하는 프로덕션 수준의 시스템으로 발전시키는 능력 — 신뢰하기 전에 각 모델이 실제로 동작함을 증명하는 LLM 라우팅, 추측하지 않고 토론하여 합의에 이르는 에이전트, 컨텍스트를 잃지 않는 메모리 및 RAG 계층, 그리고 \"테스트 통과\"가 어느새 \"기능 고장\"을 뜻하는 일이 없도록 전체가 유기적으로 연결된 생태계입니다."
