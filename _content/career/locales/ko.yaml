  comp.ai.label: "AI / LLM 시스템"
  comp.ai.item1: "40개 이상의 제공자를 아우르는 다중 제공자 LLM 추상화, MCP 도구 통합, RAG, 벡터 데이터베이스와 임베딩"
  comp.ai.item2: "에이전트 오케스트레이션 — 헤드리스 CLI 에이전트, 그래프 워크플로, 다중 라운드 토론과 합의"
  comp.ai.item3: "계획 수립(HiPlan / MCTS / Tree-of-Thoughts), LLMOps, 벤치마킹(SWE-bench, HumanEval, MMLU)"
  comp.ai.item4: "LLM 검증, 방어형 LLM 가드레일, 컴퓨터 비전과 LLM 비전"
  comp.android.label: "Android & Android TV"
  comp.android.item1: "Android, Android TV, AOSP에서의 Kotlin과 Java; Jetpack Compose, Leanback, ExoPlayer"
  comp.android.item2: "실시간 하드웨어 통합 — Bluetooth, OBD2, 3D 스캐너, 센서 파이프라인"
  comp.android.item3: "SDK 설계, Gradle 빌드 엔지니어링, ADB 디바이스 테스트, 릴리스 자동화"
  comp.backend.label: "백엔드 엔지니어링"
  comp.backend.item1: "Go(Gin), gRPC + Protobuf, HTTP/3(QUIC), WebSocket"
  comp.backend.item2: "TLA+ 형식 명세를 포함한 분산 시스템"
  comp.backend.item3: "고처리량 REST 서비스와 동시성 워커"
  comp.cross.label: "크로스플랫폼 및 모바일 SDK"
  comp.cross.item1: "SDK 수준의 Flutter/Dart와 React Native — AWS, Google, 은행이 사용하는 배포된 패키지"
  comp.cross.item2: "Kotlin Multiplatform과 Android·iOS 간 공유 비즈니스 로직"
  comp.cross.item3: "Swift 기반 iOS; 네이티브 브리지와 플랫폼 채널"
  comp.data.label: "데이터"
  comp.data.item1: "PostgreSQL, SQLite, SQLCipher(저장 데이터 암호화), Redis, Neo4j, ClickHouse"
  comp.data.item2: "오브젝트 스토리지 — MinIO, S3, GCS, Azure Blob"
  comp.frontend.label: "프런트엔드 및 데스크톱"
  comp.frontend.item1: "TypeScript/React(Tailwind, Redux Toolkit, i18next), Angular"
  comp.frontend.item2: "Electron 및 Tauri/Rust 데스크톱 애플리케이션"
  comp.frontend.item3: "접근성(WCAG 2.2 AA), 성능 예산, 디자인 시스템"
  comp.gov.label: "엔지니어링 거버넌스"
  comp.gov.item1: "상속과 전파 게이트를 갖춘, 서브모듈 형태의 엔지니어링 헌법(Constitution)"
  comp.gov.item2: "140개 이상의 저장소 전반에 걸친 문서화 및 테스트 커버리지 관리 원칙"
  comp.infra.label: "인프라 및 DevOps"
  comp.infra.item1: "Docker와 Compose, Kubernetes + Helm, Prometheus + Grafana, OpenTelemetry"
  comp.infra.item2: "QEMU, Libvirt, Parallels; VM 이미지 도구와 프로비저닝"
  comp.infra.item3: "GitHub Actions, Gradle, Make를 통한 CI/CD"
  comp.qa.label: "QA 및 품질 엔지니어링"
  comp.qa.item1: "블러프 방지(anti-bluff) 증거 기반 QA(HelixQA); 뮤테이션 게이트를 갖춘 챌린지 하니스"
  comp.qa.item2: "go test -race, 시각적 회귀 테스트, ADB 디바이스 테스트"
  comp.qa.item3: "SonarQube 및 보안 스캔 — Semgrep, gosec, Trivy, Snyk, Gitleaks, Nancy"
