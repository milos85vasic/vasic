  exp.harness.b1: "Feature Flag 사업부의 멀티플랫폼 SDK 제품군을 총괄했습니다 — Android, iOS, Flutter, React Native 및 서버 측 런타임"
  exp.harness.b2: "AWS, Google, 은행 파트너가 사용하는 SDK를 출시했으며, 공통 평가 엔진과 플랫폼별 관용적인 API를 제공했습니다"
  exp.harness.b3: "7개 언어와 4개 패키지 생태계에 걸친 릴리스 엔지니어링을 책임졌습니다"
  exp.harness.location: "세르비아 베오그라드"
