  exp.bosch.b2: "지속적으로 발생하는 차량 텔레메트리를 위해 고성능 파싱, 버퍼링, 영속화를 설계했습니다"
  exp.bosch.b3: "자동차 파트너 통합 전반에서 채택된 SDK를 출시했습니다"
