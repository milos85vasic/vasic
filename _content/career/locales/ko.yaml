  proj.catalogizer.blurb: "다중 프로토콜, 암호화, 셀프 호스팅이 가능한 미디어 컬렉션 관리 시스템(Go/Gin + React) — 불안정한 네트워크 스토리지에도 견고하며 재사용 가능한 21개 서브모듈로 구성되어 있습니다"
  proj.coursescreator.blurb: "TTS와 데스크톱, 모바일, 웹 플레이어를 갖춘 마크다운-비디오 AI 강의 제작 파이프라인"
  proj.helixagent.blurb: "단일 모델을 신뢰하지 않는 프로덕션급 앙상블 LLM 서비스: 프롬프트를 여러 제공자에 분산하고, 구조화된 다중 라운드 토론(제안 → 비평 → 검토 → 종합)을 수행하며, 실시간 검증 점수에 따라 라우팅하며 장애 시 단계적으로 폴백합니다 — OpenAI 호환 API 뒤에 HA 데이터 계층, 관측성, 가드레일을 갖추었습니다"
  proj.helixcode.blurb: "SSH로 관리되는 워커 군집에 걸쳐 작업을 의존성 인식 태스크로 분할하는 분산 AI 개발 플랫폼 — 체크포인트와 롤백으로 태스크가 중단되어도 아무것도 유실되지 않으며, 하드웨어 인식 모델 선택과 계획/빌드/테스트/리팩터링 전체 수명 주기를 REST, CLI, TUI, MCP로 제공합니다"
  proj.helixconstitution.blurb: "Git 서브모듈로 배포되어 140개 이상의 저장소가 상속하는 범용 엔지니어링 헌법(Constitution) — 엔지니어링 규칙이 코드와 똑같이 출시되고 버전이 고정됩니다. 전파 게이트는 이를 사용하는 모든 저장소에서 필수 조항을 검색하며, 각 게이트는 게이트 자체가 형식적이지 않음을 증명하는 뮤테이션 메타 테스트와 짝을 이룹니다"
  proj.helixllm.blurb: "하나의 바이너리, 6가지 배포 모드: 노트북에서 멀티 호스트 클러스터까지 확장되는 HTTP/3 기반의 OpenAI 및 Anthropic 호환 추론 — 로컬 llama.cpp 추론(CUDA/Metal/ROCm)과 자동 탐색 및 검증 점수 기반 클라우드 폴백 체인을 제공하며, 항상 보장된 로컬 모델로 단계적으로 전환됩니다"
  proj.helixmemory.blurb: "최고 수준의 백엔드 네 가지(Mem0, Cognee, Letta, Graphiti)를 하나의 인터페이스로 통합한 인지 메모리 엔진 — 병렬 검색과 소스 간 재순위화를 지원합니다"
  proj.helixqa.blurb: "Go로 구현한 블러프 방지(anti-bluff) QA 오케스트레이션으로, 기준은 \"테스트 통과\"가 아니라 \"사용자가 기능을 사용할 수 있는가\"입니다. 직접 작성한 YAML 테스트 모음과 완전 자율형 LLM·비전 세션을 실행하여 실제 앱을 열고 문서화된 모든 기능을 검증하며, Android, Android TV, 웹, 데스크톱 전반에서 문서화되지 않은 버그를 찾아내고, 런타임 증거와 AI가 바로 수정할 수 있는 티켓 없이는 PASS 판정을 내리지 않습니다"
  proj.helixspecifier.blurb: "작업 규모에 맞춰 절차의 무게를 스스로 조절하고 다중 에이전트 토론으로 명세를 뒷받침하는 명세 기반 개발 융합 엔진"
  proj.helixtrack.blurb: "자유롭게 쓸 수 있는 오픈 JIRA + Confluence 대안: HTTP/3 위의 통합 액션 라우팅 API 뒤에 놓인 Go 마이크로서비스, SQLCipher 저장 시 암호화, 웹, 데스크톱, Android, iOS 네이티브 클라이언트"
  proj.llmorchestrator.blurb: "OpenCode, Claude Code, Gemini, Junie, Qwen Code 같은 헤드리스 CLI 에이전트를 파이프와 파일을 결합한 프로토콜로 기동하고 구동하는 스레드 안전 컨트롤 플레인"
  proj.llmprovider.blurb: "43개 제공자를 하나의 인터페이스로 — 서킷 브레이커, 상태 모니터링, 지터 백오프 재시도, 하드코딩된 폴백 없는 정직한 모델 탐색을 제공합니다"
  proj.llmsverifier.blurb: "필수 \"Do you see my code?\" 게이트를 갖춘 검증의 단일 진실 공급원 — 실제로 동작함이 입증된 모델만 사용 가능으로 표시되거나 내보내집니다"
  proj.mailserverfactory.blurb: "선언형 JSON에서 완전히 프로비저닝된 Docker 기반 메일 서버를 생성 — 12가지 연결 유형과 25개 Linux 배포판을 지원하며, 439개의 통과 테스트와 깨끗한 SonarQube 게이트를 보고합니다"
  proj.serverfactorycore.blurb: "Server Factory 제품군을 뒷받침하는 공용 프로비저닝 엔진 및 VM 이미지 도구 — 하나의 프레임워크 아래 QEMU, Libvirt, Parallels 드라이버를 제공합니다"
  proj.visionengine.blurb: "컴퓨터 비전과 다중 제공자 LLM 비전 기반의 UI 인식, 내비게이션 그래프 포함"
  pub.fundamentalkotlin.detail: "자비 출판 저자이며, 최신 개정판은 2022년 9월(제3판)입니다. Packt Publishing(영국)에서도 집필했습니다."
  pub.fundamentalkotlin.title: "Fundamental Kotlin"
