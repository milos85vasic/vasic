  exp.leica.b2: "대용량 포인트 클라우드 페이로드를 위한 온디바이스 데이터 처리 및 동기화 파이프라인을 설계했습니다"
  exp.leica.b3: "Android 및 iOS 클라이언트 전반에서 Autodesk 파트너 연동을 완료했습니다"
