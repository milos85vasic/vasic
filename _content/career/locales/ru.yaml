  comp.ai.label: Системы ИИ и LLM
  comp.ai.item1: 'Абстракция над несколькими провайдерами LLM (более 40 провайдеров), интеграция инструментов MCP, RAG, векторные базы данных и эмбеддинги'
  comp.ai.item2: 'Оркестрация агентов — CLI-агенты без графического интерфейса (headless), графовые рабочие процессы, многораундовые дебаты и консенсус'
  comp.ai.item3: 'Планирование (HiPlan / MCTS / Tree-of-Thoughts), LLMOps, бенчмарки (SWE-bench, HumanEval, MMLU)'
  comp.ai.item4: 'Верификация LLM, ограничители (guardrails) для LLM, компьютерное зрение и LLM-зрение'
  comp.android.label: Android и Android TV
  comp.android.item1: 'Kotlin и Java на Android, Android TV и AOSP; Jetpack Compose, Leanback, ExoPlayer'
  comp.android.item2: 'Интеграция с оборудованием в реальном времени — Bluetooth, OBD2, 3D-сканеры, конвейеры данных датчиков'
  comp.android.item3: 'Проектирование SDK, инженерия сборки на Gradle, тестирование устройств через ADB, автоматизация релизов'
  comp.backend.label: Бэкенд-разработка
  comp.backend.item1: 'Go (Gin), gRPC + Protobuf, HTTP/3 (QUIC), WebSockets'
  comp.backend.item2: 'Распределённые системы, включая формальные спецификации на TLA+'
  comp.backend.item3: 'Высокопроизводительные REST-сервисы и параллельные воркеры'
  comp.cross.label: Кросс-платформенные и мобильные SDK
  comp.cross.item1: 'Flutter/Dart и React Native на уровне SDK — опубликованные пакеты, которые используют AWS, Google и банки'
  comp.cross.item2: 'Kotlin Multiplatform и общая бизнес-логика для Android и iOS'
  comp.cross.item3: 'iOS на Swift; нативные мосты и платформенные каналы'
  comp.data.label: Данные
  comp.data.item1: 'PostgreSQL, SQLite, SQLCipher (шифрование на диске), Redis, Neo4j, ClickHouse'
  comp.data.item2: 'Объектные хранилища — MinIO, S3, GCS, Azure Blob'
  comp.frontend.label: Фронтенд и десктоп
  comp.frontend.item1: 'TypeScript/React (Tailwind, Redux Toolkit, i18next), Angular'
  comp.frontend.item2: 'Десктопные приложения на Electron и Tauri/Rust'
  comp.frontend.item3: 'Доступность (WCAG 2.2 AA), бюджеты производительности, дизайн-системы'
  comp.gov.label: Управление инженерными практиками (governance)
  comp.gov.item1: 'Конституция как подмодуль с наследованием и проверками распространения'
  comp.gov.item2: 'Дисциплина документации и покрытия во всём парке из более чем 140 репозиториев'
  comp.infra.label: Инфраструктура и DevOps
  comp.infra.item1: 'Docker и Compose, Kubernetes + Helm, Prometheus + Grafana, OpenTelemetry'
  comp.infra.item2: 'QEMU, Libvirt, Parallels; инструментарий для образов виртуальных машин и их развёртывание'
  comp.infra.item3: 'CI/CD на GitHub Actions, Gradle и Make'
  comp.qa.label: QA и инженерия качества
  comp.qa.item1: 'QA в духе «anti-bluff» с проверкой по доказательствам (HelixQA); испытательные стенды с мутационными проверками'
  comp.qa.item2: 'go test -race, визуальное регрессионное тестирование, тестирование устройств через ADB'
  comp.qa.item3: 'SonarQube и сканирование безопасности — Semgrep, gosec, Trivy, Snyk, Gitleaks, Nancy'
