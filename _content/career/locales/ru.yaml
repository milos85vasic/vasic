  proj.catalogizer.blurb: 'Управление медиаколлекциями по нескольким протоколам: с шифрованием, возможностью самостоятельного развёртывания (Go/Gin + React), устойчивое к нестабильной работе сетевых хранилищ и построенное на 21 переиспользуемом подмодуле.'
  proj.coursescreator.blurb: Конвейер создания ИИ-курсов из markdown в видео с синтезом речи (TTS) и плеерами для десктопа, мобильных устройств и веба.
  proj.helixagent.blurb: 'LLM-сервис промышленного уровня на основе ансамбля моделей, который не доверяет одной модели: он рассылает запрос множеству провайдеров, проводит структурированные многораундовые дебаты (предложение → критика → рецензия → синтез) и маршрутизирует запросы по актуальным оценкам верификации с плавным переключением на резерв. Работает за OpenAI-совместимым API, с отказоустойчивым слоем данных, наблюдаемостью и ограничителями (guardrails).'
  proj.helixcode.blurb: 'Распределённая платформа ИИ-разработки: делит работу на задачи с учётом зависимостей и распределяет их по парку воркеров, управляемых по SSH, и использует контрольные точки и откат, чтобы при прерывании задачи ничего не терялось. Подбирает модели с учётом оборудования и покрывает полный цикл «план — сборка — тестирование — рефакторинг» через REST, CLI, TUI и MCP.'
  proj.helixconstitution.blurb: 'Универсальный свод инженерных правил, распространяемый как Git-подмодуль и наследуемый более чем 140 репозиториями: инженерный закон, который поставляется и фиксируется по версиям так же, как код. Проверки распространения ищут обязательные положения в каждом использующем репозитории, а каждая проверка снабжена мутационным метатестом, доказывающим, что сама проверка не фиктивна.'
  proj.helixllm.blurb: 'Один бинарный файл и шесть режимов развёртывания: инференс, совместимый с OpenAI и Anthropic, поверх HTTP/3, масштабируемый от ноутбука до кластера из нескольких хостов, с локальным инференсом на llama.cpp (CUDA/Metal/ROCm) и автоматически обнаруживаемой облачной резервной цепочкой с оценкой верификации, которая всегда деградирует до гарантированно доступной локальной модели.'
  proj.helixmemory.blurb: Единый движок когнитивной памяти, объединяющий четыре лучших в своём классе бэкенда — Mem0, Cognee, Letta, Graphiti — за одним интерфейсом, с параллельным поиском и переранжированием результатов из разных источников.
  proj.helixqa.blurb: 'Оркестрация QA в духе «anti-bluff» на Go, построенная на одном правиле: планка — не «тесты проходят», а «пользователи могут пользоваться функцией». Запускает написанные вручную наборы тестов в YAML и полностью автономные сессии на базе LLM и компьютерного зрения, которые открывают настоящее приложение, проверяют каждую задокументированную функцию, ищут недокументированные ошибки на платформах Android, Android TV, веб и десктоп и отказываются засчитывать PASS без собранных доказательств выполнения, а также формируют тикеты, готовые для исправления с помощью ИИ.'
  proj.helixspecifier.blurb: Объединяющий движок разработки на основе спецификаций, который масштабирует степень формальности процесса под размер работы и подкрепляет спецификации многоагентными дебатами.
  proj.helixtrack.blurb: 'Свободная альтернатива JIRA + Confluence: микросервисы на Go за единым API с маршрутизацией по действиям поверх HTTP/3, шифрование данных на диске через SQLCipher и нативные клиенты для веба, десктопа, Android и iOS.'
  proj.llmorchestrator.blurb: Потокобезопасная управляющая плоскость, которая запускает и ведёт CLI-агентов без графического интерфейса (headless) — OpenCode, Claude Code, Gemini, Junie, Qwen Code — по гибридному протоколу на основе каналов и файлов.
  proj.llmprovider.blurb: Единый интерфейс к 43 провайдерам с предохранителями (circuit breakers), мониторингом работоспособности, повторами с экспоненциальной задержкой и джиттером и честным обнаружением моделей без жёстко прописанных резервных вариантов.
  proj.llmsverifier.blurb: 'Единый источник истины о верификации: обязательная проверка «Видишь ли ты мой код?» гарантирует, что пригодными к использованию помечаются и экспортируются только модели, реально доказавшие свою работоспособность.'
  proj.mailserverfactory.blurb: 'Из декларативного JSON — полностью развёрнутые почтовые серверы в Docker: 12 типов подключения и 25 дистрибутивов Linux; 439 успешных тестов и пройденный контроль качества SonarQube.'
  proj.serverfactorycore.blurb: 'Общий движок развёртывания и инструментарий для образов виртуальных машин в основе линейки Server Factory: драйверы QEMU, Libvirt и Parallels в единой архитектуре.'
  proj.visionengine.blurb: Компьютерное зрение и восприятие интерфейсов на основе нескольких провайдеров LLM-vision с графами навигации.
  pub.fundamentalkotlin.detail: Автор, издающий книгу самостоятельно; последнее переработанное издание — сентябрь 2022 года (3-е издание). Также автор книг для Packt Publishing (Великобритания).
