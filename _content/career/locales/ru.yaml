  summary.body: 'Более 16 лет профессиональной разработки — мобильные SDK, интеграция с оборудованием в реальном времени и распределённые бэкенды — сегодня сходятся в одном фокусе: сделать автономную ИИ-разработку заслуживающей доверия в больших масштабах. Я проектирую экосистемы из множества модулей, а не монолиты: крупные продуктовые приложения опираются на десятки небольших, слабо связанных и независимо тестируемых модулей, каждый из которых наследует общую инженерную Конституцию и проверяется дисциплиной QA «anti-bluff», требующей доказательств.'
  summary.lead: 'Инженер ИИ и разработчик ПО, который строит системы для ИИ-разработки от начала до конца: от мультипровайдерной инфраструктуры LLM и автономных агентов до слоёв QA и управления, не позволяющих себя обманывать. Я не делаю демонстрационные прототипы — я создаю платформы.'
  summary.value: 'Что я приношу: умение довести возможности ИИ от исследовательской идеи до управляемой, самопроверяющейся системы промышленного уровня — маршрутизация LLM, которая доказывает работоспособность каждой модели, прежде чем ей доверять; агенты, которые ведут дебаты и приходят к консенсусу, а не гадают; слои памяти и RAG, не теряющие контекст; и вся экосистема построена так, чтобы сообщение «тесты зелёные» никогда не могло незаметно означать «функция сломана».'
  tmpl.cl.emphasis: 'В этих проектах моё внимание сосредоточено на: {list}. Та же дисциплина лежит в основе всего, что я выпускаю.'
