<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden GOOD fixture</title>
<style>
  :root {
    --bg: #f5f6f8; --card-bg: #ffffff; --fg: #1a1d21; --muted: #5b6470;
    --accent: #2f6feb; --accent-fg: #ffffff; --border: #d8dde3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card-bg: #1e232b; --fg: #eef1f5; --muted: #a4adbb;
      --accent: #5b8dff; --accent-fg: #0b1220; --border: #313844;
    }
  }
  [data-theme="dark"] {
    --bg: #14171c; --card-bg: #1e232b; --fg: #eef1f5; --muted: #a4adbb;
    --accent: #5b8dff; --accent-fg: #0b1220; --border: #313844;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 32px;
  }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px; width: 360px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
  }
  .card h1 { font-size: 22px; margin: 0 0 8px; line-height: 1.3; }
  .card p { font-size: 15px; color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
  .actions { display: flex; gap: 12px; }
  button {
    font-size: 15px; font-weight: 600; padding: 12px 20px;
    border-radius: 8px; border: 1px solid var(--border); cursor: pointer;
    background: transparent; color: var(--fg);
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
</style>
</head>
<body>
  <div class="card" data-testid="card">
    <h1>Confirm your subscription</h1>
    <p>You are about to subscribe to the Pro plan. You can cancel anytime from your account settings.</p>
    <div class="actions">
      <button class="primary" data-testid="confirm-btn">Confirm</button>
      <button data-testid="cancel-btn">Cancel</button>
    </div>
  </div>
</body>
</html>
