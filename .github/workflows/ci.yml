# =============================================================================
# CI — quality gates for the vasic umbrella repo
# -----------------------------------------------------------------------------
# Before this workflow existed, the ONLY GitHub Actions in play was
# milosvasic.ru/.github/workflows/pages.yml — a Jekyll *deploy*. Nothing ran the
# test suite, so a regression could only be caught by hand. This workflow runs
# the same gates a developer runs locally, on every push / PR to main.
#
# Every gate below is a REAL check that can genuinely fail — no vacuous
# always-pass steps. Each is mutation-paired or asserts on real content: the
# check has been shown to FAIL when the thing it guards is broken, not merely
# to exit 0 on a good tree. Gate 2 is the one that needed work — it used to be
# able to report ✅ over an empty build; it now asserts the generator's exit
# status per language and that the output is non-empty BEFORE it greps.
#
# Gates wired here (each is a separate step, fail-fast):
#   0. Hardcoded path audit    ./scripts/audit-hardcoded-paths.sh
#   1. Go unit tests           cd _tools/gen && go test ./...
#   2. Hardcoding audit        bash _tools/audit-hardcoding.sh      (builds the Go generator)
#   3. Reproducibility guard   bash _tools/translate/reproducibility-selftest.sh
#   4. Portfolio §1.1 gate     bash _tools/portfolio/self-validate.sh
#   5. Harness self-validation bash _tests/run-harness-selfvalidation.sh
#                              (visual §11.4.170 via headless chromium +
#                               export §11.4.168 via poppler + tesseract OCR)
#   6. Playwright (chromium)   the full local suite EXCEPT the exhaustive
#                              all-language crawl (see the note on Gate 6 below).
#
# Keep this list adjacent to any future gate insertion — it is indexed by hand.
#
# ---- Two deliberate, documented deviations (NOT bluffs) ---------------------
#
# (a) Submodules are initialised MANUALLY and NON-recursively, not via
#     `submodules: recursive`. A recursive checkout of the umbrella is KNOWN to
#     fail: milosvasic.ru embeds a nested submodule (red-elf/Upstreamable) whose
#     own .gitmodules is a broken 0-byte gitlink. This is the exact reason
#     milosvasic.ru/.github/workflows/pages.yml sets `submodules: false`. We
#     therefore init only the two submodules the gates actually need
#     (vasic.digital + milosvasic.ru), non-recursively, over anonymous HTTPS
#     (both are public GitHub Pages repos). Upstreamable is excluded from the
#     Jekyll build anyway (milosvasic.ru/_config.yml `exclude:`), so nothing is
#     lost. The repo registers SEVEN submodules, so FIVE go unfetched here:
#     ai_interviewing, design-toolkit, monetization, submodules/constitution
#     and submodules/superspec (note the paths — constitution and superspec
#     live under submodules/, not at the root). They are governance / design /
#     product submodules that no gate command reads.
#
# (b) The Playwright milosvasic.ru server serves `milosvasic.ru/_site`, and
#     `_site/` is git-ignored in that submodule. Exactly 8 files are
#     force-tracked (`git -C milosvasic.ru ls-files _site`): five assets (one
#     CSS, one PNG, three PDFs) AND three rendered pages — `_site/index.html`,
#     `_site/feed.xml`, `_site/pages/Cover_Letter.md`. Those three are stale
#     leftovers; the localized page tree the suite actually crawls is NOT
#     tracked. So we run `jekyll build` here to produce a real _site before
#     Playwright starts. vasic.digital, by contrast, is committed static HTML
#     and is served directly — no build.
#
# ---- Path resolution (the former /Volumes symlink bridge is GONE) ----------
#   HISTORY: this workflow used to symlink /Volumes/T7/Projects/vasic ->
#   $GITHUB_WORKSPACE because several in-repo configs hardcoded that absolute
#   path (the original author's macOS machine). That bridge has been removed.
#
#   _tests/playwright.config.js now derives its static roots itself with
#   path.resolve(__dirname, '..'), and a repo-wide sweep removed 33 hardcoded
#   occurrences across 18 files. The suite runs from ANY checkout location -
#   fresh clone, runner, or a developer machine at any path.
#
#   The "Hardcoded path audit" gate below enforces that: it fails the build if a
#   machine-specific absolute path is reintroduced. Comment-only mentions (like
#   this one) are ignored by design - documenting the bug is not the bug.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so PR pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Explicit, in-workspace browsers path so the "Cache Playwright browsers"
      # step below has a deterministic `path:` to restore into. Without this the
      # download lands in ~/.cache/ms-playwright and would have to be cached from
      # a home-relative path instead.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - name: Checkout (no auto-submodules — see deviation (a) in the header)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch the two submodules the gates need (non-recursive, HTTPS)
        run: |
          set -euxo pipefail
          # The gitlinks are registered with SSH URLs (git@github.com:...) which CI
          # has no key for. `insteadOf` proved unreliable for `git submodule update`
          # (it still tried SSH → "Permission denied (publickey)"), so set each
          # submodule's URL to anonymous HTTPS EXPLICITLY in .git/config, then update.
          # NON-recursive on purpose: never descend into milosvasic.ru's broken
          # red-elf/Upstreamable nested gitlink. Both repos are public.
          git submodule init vasic.digital milosvasic.ru
          git config submodule.vasic.digital.url https://github.com/vasic-digital/vasic-digital.github.io.git
          git config submodule.milosvasic.ru.url https://github.com/milos85vasic/milosvasic.ru.git
          git submodule update vasic.digital milosvasic.ru
          echo "vasic.digital html files:"; ls vasic.digital/index.html
          echo "milosvasic.ru Gemfile:";    ls milosvasic.ru/Gemfile

      - name: Set up Go (matches _tools/gen/go.mod → go 1.26)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: _tests/package-lock.json

      - name: Set up Ruby + Jekyll (for the milosvasic.ru _site build)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: milosvasic.ru

      - name: Install OCR + PDF tools for the export self-validation
        run: |
          set -euxo pipefail
          sudo apt-get update
          # poppler-utils -> pdftotext/pdfimages/pdftoppm ; tesseract-ocr -> OCR.
          # The export validator SKIPs with a reason if a tool is missing, but we
          # install them so the gate runs for real rather than degrading to SKIP.
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr

      # ---- Gate 0 ------------------------------------------------------------
      # Fails the build if a machine-specific absolute path is reintroduced.
      # This repo previously carried 33 such paths across 18 files, all pointing
      # at the original author's macOS volume; one of them made
      # _tools/deploy-langs.sh cd into a nonexistent directory SILENTLY (it sets
      # -uo pipefail but not -e) and then commit and push both site submodules.
      # Comment-only mentions are ignored, $HOME/~ are fine, and genuine
      # exceptions live in .hardcoded-paths-allow.
      - name: Gate — hardcoded path audit
        run: ./scripts/audit-hardcoded-paths.sh

      # ---- Gate 1 ------------------------------------------------------------
      - name: Gate — Go unit tests (_tools/gen)
        run: go test ./...
        working-directory: _tools/gen

      # ---- Gate 2 ------------------------------------------------------------
      - name: Gate — hardcoding audit (builds the Go generator)
        run: bash _tools/audit-hardcoding.sh

      # ---- Gate 3 ------------------------------------------------------------
      - name: Gate — HelixTranslate reproducibility self-test
        run: bash _tools/translate/reproducibility-selftest.sh

      # ---- Gate 4 ------------------------------------------------------------
      - name: Gate — portfolio §1.1 data-integrity self-validation
        run: bash _tools/portfolio/self-validate.sh

      # ---- Node deps + browser (needed by gates 5 and 6) ---------------------
      - name: Install test dependencies (_tests)
        run: npm ci
        working-directory: _tests

      # The chromium download is ~150 MB and the pinned @playwright/test version
      # (hence the browser revision) only moves when the lockfile moves, so key
      # on the lockfile hash. `restore-keys` still gives a warm partial hit when
      # the lockfile changes for an unrelated dependency.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pw-browsers
          key: ${{ runner.os }}-pw-${{ hashFiles('_tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pw-

      # Still run on a cache hit: the download becomes a no-op, but `--with-deps`
      # installs the OS libraries chromium needs, which the cache does not carry.
      - name: Install Playwright chromium (+ OS deps)
        run: npx playwright install --with-deps chromium
        working-directory: _tests

      # ---- Gate 5 ------------------------------------------------------------
      # Drives the visual oracle (headless chromium) and the export validator
      # (poppler + tesseract). Fixtures are committed, so nothing is rebuilt.
      - name: Gate — harness self-validation (visual §11.4.170 + export §11.4.168)
        run: bash _tests/run-harness-selfvalidation.sh

      # ---- Build the Jekyll site Playwright will serve on :8082 --------------
      - name: Build milosvasic.ru _site (Jekyll)
        run: bundle exec jekyll build --destination _site
        working-directory: milosvasic.ru
        env:
          JEKYLL_ENV: production

      # ---- Gate 6 ------------------------------------------------------------
      # The config auto-starts a python http.server for BOTH sites. We exclude
      # the exhaustive "all-language" link/sitemap crawl. To be precise about
      # WHY: CI sets neither VD_BASE nor MV_BASE, so that spec would run against
      # the local servers and finish in seconds — it is NOT too heavy to run
      # here. We exclude it because it is the spec built for LIVE production
      # crawls, and keeping it out leaves Gate 6 a smoke test of the shipped
      # pages rather than a full sitemap sweep duplicated on every push. The
      # title is "... exhaustive all-language link & sitemap integrity", so the
      # substring "all-language" (no trailing s) reliably excludes both its
      # per-site variants and nothing else.
      - name: Gate — Playwright (chromium), excluding the exhaustive all-language crawl
        run: npx playwright test --project=chromium --grep-invert "all-language"
        working-directory: _tests

      # ---- Evidence on failure ----------------------------------------------
      - name: Upload evidence (harness + Playwright HTML report)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: _tests/evidence/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces/screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: _tests/test-results/**
          if-no-files-found: ignore
          retention-days: 14
