phase_4_evidence:
  design_decision:
    rationale: Pre-existing progress stores on BOTH modules key on the opaque client-chosen X-Session header (workshop: internal/api ProgressStore reading-positions + pkg/learning SessionStore lesson/assessment progress, both atomic-write JSON files that survive re-index by design; ai_interviewing: progress table in SQLite keyed by session string). Rather than rewriting the stores, spec-007 adds a one-directional bridge: auth.UserProgressKey(userID) = "auth-user:<id>" — derived keys are deterministic (survive restarts + relogin, US4 acceptance 3), disjoint per account (US4 isolation), and carry a prefix no client-chosen header value can collide with.
  workshop_t007:
    pkg/authhttp: UserProgressKey + progress_bridge_test.go (RED observed: undefined UserProgressKey; GREEN: TestUserProgressKeyDerivesFromUserID + TestProgressIsolatedPerAccount — per-account isolation + relogin stability)
    internal/api/lessons.go sessionOf: authenticated context → derived key; X-Session header remains pre-auth fallback
    internal/api/progress.go ProgressHandler: same derivation
    cmd/workshop-server: wrapWithAuth(content, authDir) — top-level mux carving out public POST /api/auth/login|logout|switch + GET /api/auth/me + GET /api/health; ALL other content through authhttp.Middleware (fail-closed 503 if auth store unopenable); auth_wire_test.go: unauthenticated content 401s, health public, full login/switch/logout flow, both users equal access
    full suite: 25 packages ok / 0 FAIL (with the documented WORKSHOP_HTTP_DELTA_CONTRACT override for KG1)
  ai_interviewing_t008:
    internal/auth: UserProgressKey added (RED observed: undefined; GREEN: TestProgressKeyDerivation)
    api.go postProgress/getProgress: authenticated context overrides client session with derived key; TestProgressIsPerAccount proves two accounts posting the same item keep separate summaries (mutation: shared-session override FAILS the isolation test, restored green)
    TestProgressRequiresSession updated to the layered identity contract: unauthenticated=401 at middleware; authenticated always carries derived key (400 would now indicate broken derivation)
    full suite: 4 packages ok / 0 FAIL
  honest_scope: Backend per-account progress complete on both modules. Lesson-completion FLOWS (workshop lessons/assessment via curriculum-kit Progress; ai_interviewing lesson/mcq/exercise statuses) were already implemented per-session — this phase re-keyed them to accounts. Angular UI for progress display is frontend work, deferred with the login UI.
