  - id: "2.5"
    name: "Architecture correction (unplanned, discovered during T007 investigation)"
    status: complete
    detail: >
      MAJOR FINDING: workshop/platform/backend/pkg/search/rerank_window.go already implements a
      production reranking mechanism (reorderWindow: BM25-OR over the served window, fused via
      RRF with the incoming order), gated by Service.WindowRerank, OFF by default
      (WORKSHOP_SEARCH_WINDOW_RERANK=false) because it was measured to help some query classes
      and cost others. MMRReranker is NOT called anywhere in the production backend — it was
      measured non-deterministic (served set/order varied across identical calls) and
      score-corrupting (overwrites relevance score with Jaccard word-overlap) and was REMOVED
      from (*Service).fuse; pkg/crossref independently declined to use it for the identical
      reason. digital.vasic.rag/pkg/pipeline.Builder is never imported anywhere in workshop's
      backend either — the real query path is the hand-written fuse()/split() in service.go.
      Every planning document (research.md, plan.md, data-model.md, contracts/,
      quickstart.md, spec.md, tasks.md) assumed a composition point ("ahead of MMR", via
      pipeline.Builder) that does not exist. Corrected all seven files (operator-approved,
      2026-10-05): the new cross-encoder stage is now designed as a new flag
      (CrossEncoderRerank/-search-cross-encoder-rerank), MUTUALLY EXCLUSIVE with WindowRerank,
      composed directly into split() alongside the existing reorderWindow call.

