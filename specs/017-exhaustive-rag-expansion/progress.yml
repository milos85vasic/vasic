          refuses-a-changed-member, no-op-without-the-column) plus the two integration tests
          named under T037. A SEPARATE real gap was found and closed in passing:
          pkg/prebuilt/import.go's own comment claimed a "TestEmbeddingsDDLMatchesSearch" guards
