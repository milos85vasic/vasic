          found — same-DIMENSION, different-MODEL embedding rows were never excluded by the
          pre-existing dimension-only check in rankAgainst (confirmed by reading, not by
          reverting). Fixed via a queryModel parameter threaded through Retrieve/Neighbours,
          comparing against each candidate's own recorded model; empty-string opt-out preserves
          every pre-existing call site's behavior. All 3 GREEN.
      T039:
        status: pass
        detail: >
          Done 2026-10-05. BOTH T037's and T038's gaps were REAL and were FIXED, not merely
          confirmed (contradicting tasks.md's own "expected: none" framing and research.md §4's
          "no new mechanism" claim — research.md corrected in place, superseded text kept).
          T037's fix: pkg/search/carryforward.go's new carryForwardPerPID — copies a vector
          per-PID by exact content_hash match (embeddings.content_hash = passages.content_hash)
          whenever the whole-generation root_hash match finds nothing, so a corpus that
          genuinely grew still spares every unchanged member from re-embedding. embeddings
