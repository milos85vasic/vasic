          round, registered as G-IDX-2) already proves with a real index.Build +
          search.CarryForwardVectors that adding content to an indexed corpus invalidates
          carry-forward for the WHOLE corpus (root_hash is computed over the whole member set,
          so any addition changes it). `pkg/index/generation_stability_test.go`'s
          TestOldGenerationEmbeddingRowsAreUnchangedWhenASecondTextbookIsAdded adds the
          byte-for-byte proof T037 itself asks for (old generation's embedding rows AND its own
          generations metadata row's pid_count/root_hash/built_at never mutate; state correctly
          flips live->superseded, asserted not ignored). Both GREEN.
