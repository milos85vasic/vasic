transitive_handling:
  # §11.4.31: "Each declared dep itself ships a helix-deps.yaml. The
  # incorporator tooling MUST recurse — top-level project gets the union of all
  # transitively-declared deps, flattened to root."
  #
  # Honest boundary (§11.4.6) — verified, not assumed: of the TEN deps above,
  # four ship a helix-deps.yaml — `constitution`, `containers`, `LLMProvider`
  # and `RAG`. The six owned product submodules do not (re-checked 2026-09-01,
  # `workshop` included), so a recursive walk terminates at them for a
  # reason the schema does not model (missing manifest, not a declared leaf).
  # `containers`, `LLMProvider` and `RAG` terminate the walk for the OPPOSITE,
  # schema-modelled reason: each ships a manifest declaring `deps: []`, i.e. a
  # genuine leaf (verified 2026-09-01 by reading
  # submodules/{containers,LLMProvider,RAG}/helix-deps.yaml at the pinned shas;
  # both new leaves are corroborated by their go.mod, which requires no
  # `digital.vasic.*` module and declares no own-org `replace`).
  # `recursive: true` is declared because the constitution submodule
  # genuinely hosts a further seven own-org deps that consumer tooling must
  # reach.
  #
  # The earlier "eight deps / only two manifests" sentence is SUPERSEDED by the
  # paragraph above, not silently overwritten: it was true of the eight-dep
  # fleet and is simply no longer the fleet.
  recursive: true

  # §11.4.31: "When two submodules declare the same dependency at different
  # refs, CONFLICT — operator MUST resolve before incorporation proceeds. The
  # incorporator aborts on conflict (never silently picks one)."
  # A live instance now EXISTS and is unresolved: `design-toolkit` is declared
  # BOTH here (ref efd2c3fb, layout flat) and in
  # submodules/constitution/helix-deps.yaml (ref 16e4e76, layout flat). Those
  # refs DISAGREE, which is exactly the CONFLICT the clause above describes, so
  # `operator-required` is now a live obligation rather than a standing
  # possibility. It is recorded here rather than gated: fixing it means editing
  # the constitution submodule, which this repository does not do.
  # `scripts/verify-manifest-pins.sh` deliberately does NOT fail on it — it
  # checks THIS root's manifest against THIS root's gitlinks and says so in its
  # own honest-boundaries block, so the two concerns are never conflated.
  # Re-derive: grep -A2 'name: design-toolkit' submodules/constitution/helix-deps.yaml
  conflict_resolution: operator-required

# §11.4.31: "set true for Android/Kotlin/Apple roots (per §11.4.29 exception)".
# This root is Go + Node + Ruby with no Android/Kotlin/Apple subtree, so false.
language_specific_subtree: false

