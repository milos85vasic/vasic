ses, so a LAN caller satisfying G-HTTP-9 had that header occupied by the network credential, not a session token, and every subsequent call 401'd with "invalid or expired token" despite a valid session sitting in the cookie the login response itself set. Fixed by reordering authhttp.ExtractToken to check the "session" cookie before the Authorization header — the cookie is the more specific carrier, set for exactly this one purpose. New regression test TestSessionCookieWinsOverAnUnrelatedAuthorizationHeader reproduces the exact deadlock shape. Live-verified end to end from the host's real LAN IP after rebuild+restart: login + /api/auth/me + /api/chapters all succeed with the session cookie and gate token both present; /media/, /docs/, /api/chapters still 401 with no credential. A second fan-out agent, testing the sibling ai_interviewing service, separately found and this session fixed a critical, unrelated defect: that service's DEPLOYED binary was 9 days stale (dated 2026-09-07, auth source committed 2026-09-16) and had NO auth middleware wired at all, exposing every content route (including the employer-data/Project-Deep-Dives track) with zero credentials over both HTTP and HTTPS — fixed by rebuilding and restarting from current source (ai_interviewing commit 9ec52a7), no source change needed in that repository. go build/vet/test clean across all 26 backend packages. Prior entry, preserved: NO tag exists anywhere in this repository; gitlink tracks heads/main; 2026-09-17 — while exposing this server for LAN manual testing, found the routes()-level G-HTTP-9 wrap (a SEPARATE, deeper application than the apiPathsOnly fix the previous entry describes) still covered the SPA shell, because that inner wrap protects the whole mux including GET /. A non-loopback caller with no credential still could not load the login page. Narrowed the gate to /api/, /media/ and /docs/ (every real data route on that mux), freeing only the SPA shell. Two new regression tests (TestFullServer_SPAIsReachableFromANonLoopbackCallerWithNoCredential, TestFullServer_APIStillRequiresLoopbackOrCredential) prove both halves against the FULL run()-time handler composition, not just routes()'s own return value — the previous fix's own tests had not covered this. POST /api/auth/login stays gated by the shared bearer credential, on operator decision, since authhttp has no rate-limiting of its own to replace the network-layer brute-force protection. compose.yml now wires WORKSHOP_ACCESS_TOKEN through an `environment:` entry (an unset entry is always passed as empty; an empty command-list element can be dropped, corrupting every positional flag after it). Live-verified end to end from the host's real LAN IP: SPA and /login return 200 with no credential; /api/*, /media/, /docs/ all return 401 without one; POST /api/auth/login 401s with no credential and correctly falls through to invalid_credentials with the shared credential and a wrong password. go build/vet/test clean. Prior entries, preserved: NO tag exists anywhere in this repository; gitlink tracks heads/main; built the frontend login UI 2026-09-16 (same gap as the ai_interviewing sibling: zero auth wiring against Phase 16's backend requirement, every screen broken for a real visitor). New AuthService/interceptor/guard/login page (32 new tests, full suite 425/425). Found and fixed a SECOND real backend bug while verifying end to end: wrapWithAuth wrapped the whole content handler including the SPA/static handler, so an unauthenticated visitor got 401 for the login PAGE itself — fixed with apiPathsOnly (cmd/workshop-server/main.go), gating only /api/*, with 2 new regression tests. Wired the existing 16-file e2e suite (never successfully run against the live server since Phase 16 shipped) to authenticate via a new global-setup.ts + storageState; found and fixed a real regression this exposed (a pre-existing test helper's blanket localStorage.clear() was wiping the new auth session before every test in area-lessons-and-test.spec.ts) and a real, unrelated, pre-existing UI bug (chapter-todo list overflowed at 360px — pkg/frontend's own .ttext 14rem floor never fit a phone-width row; fixed to wrap instead of overflow). Full e2e result against the live, freshly-rebuilt container: 190 passed / 3 failed / 7 skipped of 200 — up from every test hanging on 401 — the 3 remaining failures are confirmed separate, pre-existing, unrelated findings (a stale test asserting a component's own deliberately-withdrawn "at least N%" wording; a state-2 rendering edge case needing further investigation; a live-corpus-shape precondition the test's own guard correctly detected as unmet). go build/vet/test clean across all 26 backend packages. Prior entries, preserved: a full boot-and-exhaustive-live-test pass found the auth-boundary contract drift was SYSTEMIC across 15 of 109 platform/gates/ scripts (new scripts/_live_auth.sh shared helper, all fixed); spec-008 Phase 17 (54/62 complete) — the original contract-drift finding, G-CLI-1, scripts/verify.sh V8, verify-cross-registry-attribution.sh, G-CH-10/14/24, docs/limits.md FR-031 closure.
    why: "The Workshop Curriculum — a teaching corpus of recorded sessions and their written materials under chapters/<NN>/ and nested sub-chapters chapters/<NN>.<NN>/, carried as an owned submodule of the umbrella. Its one mechanism is the SHA-256-verified multi-part video-archive pipeline in scripts/ (archive-videos.sh / extract-videos.sh / install-hooks.sh / self-test.sh), which used to keep gigabyte recordings in git as <=50 MB *.tar.gz.part-NNN chunks. SUPERSEDED 2026-09-08 on an operator decision: the 54 parts (2,624.8 MB) were UNTRACKED with `git rm --cached` and the pattern gitignored, so no new archive byte enters and a fresh checkout drops from ~2.7 GB to small. The *.sha256 manifests stay TRACKED at ~9 KB — they are the integrity record any future fetch verifies against. History rewriting is forbidden, so the already-committed blobs remain and size-pack did not fall; that limit is stated in the module README and printed by scripts/verify-obtainability.sh rather than glossed. The fetch mechanism is deliberately NOT invented: extract-videos.sh returns rc 2 COULD-NOT-DETERMINE with a TODO(storage-fetch) marker naming exactly what is missing, and a present-but-corrupt part still returns rc 1."
