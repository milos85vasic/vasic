# helix-deps.yaml — vasic umbrella
#
# Instantiates the schema specified verbatim by §11.4.31
# (Submodule-Dependency-Manifest Mandate) at
# `submodules/constitution/Constitution.md:1908-1950`, and modeled on the
# constitution's own manifest at `submodules/constitution/helix-deps.yaml`.
# Every key below (`schema_version`, `deps[].{name,ssh_url,ref,why,layout}`,
# `transitive_handling.{recursive,conflict_resolution}`,
# `language_specific_subtree`) comes from that schema. No key was invented.
#
# Scope. §11.4.31's operative sentence is "Every owned-by-us SUBMODULE MUST
# ship a machine-readable, version-controlled dependency manifest at the
# canonical path `helix-deps.yaml`". `vasic` is the consuming ROOT, not a
# submodule; the manifest is placed here because the schema's own comment
# defines the file as what "consuming projects read recursively", and because
# `docs/constitution-adoption/INVENTORY.md` gap G6 records its absence at this
# root as a HIGH gap.
#
# ── URLs ─────────────────────────────────────────────────────────────────────
# Every `ssh_url` is the URL declared in this repository's `.gitmodules`, which
# is what a fresh `git submodule update --init` actually clones. Where a working
# tree's live `git remote -v` differs from that, the divergence is called out in
# a comment on the entry and in `Constitution.md` → "Project-specific remotes".
# SSH-only: there is not one `https://` remote across the set (verified by
# `git remote -v` in every working tree, 2026-08-26; re-verified 2026-08-31 with
# `workshop` in the set, via this file's own recipe #2 below — it printed 0).
#
# ── Refs — WHAT `ref:` MEANS HERE, stated so nobody has to infer it ──────────
# `ref:` is a PIN, not a souvenir. It is the commit this repository's HEAD
# points the corresponding gitlink at, and the tree MUST match it. It is NOT a
# "last known good" record, NOT an aspiration, and NOT informational: a reader
# may rely on it, and a drift between it and the gitlink is a defect in THIS
# FILE, to be corrected, never explained away.
#
# Re-derive this status — do not trust it undated (project constitution,
# "Comprehensive Documentation": a document that states a status MUST name the
# command that re-derives it):
#
#     bash scripts/verify-manifest-pins.sh          # 0 in sync / 1 drift / 2 unknown
#     bash scripts/verify-manifest-pins.sh --fix    # rewrite every drifted ref
#
# That gate is wired into `scripts/verify-governance-cascade.sh` as check C9, so
# it also runs from the §11.4.32 sweep and from the local pre-push hook. Its
# comparison target is the INDEX gitlink (`git ls-files -s -- <path>`): the
# commit this repository is about to record, which for a clean tree is the same
# commit HEAD already records. That target is chosen so the gate fires at
# `git add` — one step BEFORE an untrue commit exists — and so a submodule being
# onboarded in the current change-window can still be checked. Divergence
# between index, HEAD and a submodule's working tree is REPORTED as a note and
# is never a verdict input; the full reasoning is in the checker's own header.
#
# HISTORY, recorded rather than quietly repaired (§11.4.6). Between 2026-08-26
# and 2026-09-01 every one of the seven refs then present drifted away from its
# gitlink and NOTHING in the tree could say so: C6 compared dep NAMES in both
# directions and stayed green over seven wrong commits. Measured at HEAD 16cd4ba8
# on 2026-09-01: 7 of 7 recorded refs wrong. The `workshop` entry was untrue in
# the very commit that created it — 16cd4ba8 added it recording ff59fca and moved
# the gitlink to 55076bf in the same commit. All seven are corrected below and C9
# now makes a repeat impossible without a red gate.
#
# SHA NOTE (§11.4.6). Both citations above have moved TWICE, and the chain is
# recorded rather than collapsed: `63ac4df` → `fc7574b2` (authorized
# content-boundary rewrite, 2026-09-01) → `16cd4ba8` (second authorized rewrite,
# 2026-09-02, which removed the third party's first name). The first two no
# longer resolve; `16cd4ba8` is what is cited and it does. The measurement is
# unchanged — only the name of the commit it was taken at moved, twice. Mapping
# and evidence: `docs/content-boundary-incident-2026-09-01.md` §8B and §11.4.
#
# FORM. §11.4.31 says `ref: main   # branch or pinned tag`. Every entry here
# records a full 40-character sha instead, for two reasons: three owned
# submodules (`ai_interviewing`, `monetization`, `workshop`) have no tag at all,
# and every remaining dep is pinned to a commit PAST its newest tag, so a tag
# would name a different commit than the gitlink and would be a false pin — the
# defect the `v1.8.0` entries on the two site submodules actually had. A sha is
# exact. `scripts/verify-manifest-pins.sh` still accepts a tag or branch ref for
# future entries and resolves it inside the checkout; an entry whose submodule
# is not initialised is reported as COULD-NOT-DETERMINE, never as a pass.
#
# QUOTED, deliberately. Under YAML 1.1 an unquoted 40-character token that
# happens to be all digits parses as an INTEGER, and one shaped like `1e5…`
# can parse as a FLOAT — a pin silently re-typed by the parser. Quoting makes
# every ref a string no matter which commit it names.
#
# NO `git describe` OUTPUT IS RECORDED in these comments. It was, and it went
# stale invisibly ("4 commits past v1.8.0" is now 5, "51 commits past" is now
# something else). A comment that restates a derived number is a second thing to
# keep in sync and the one nothing checks. Durable facts only — which branch a
# gitlink tracks, whether any tag exists at all — plus the command above.
#
# ── NOT specified by §11.4.31, therefore NOT invented here ───────────────────
# The schema has no field for excluding a third-party gitlink and no field for
# a governance/consumed-constitution role. `submodules/superspec` is therefore
# absent from `deps` (it is third-party — see the trailing comment block) rather
# than represented by a key the schema does not define.
#
# ── Honest boundaries (§11.4.6) ──────────────────────────────────────────────
# 1. §11.4.31 requires this file's name to appear "in the submodule's
#    README.md + governance trio". It is named in `Constitution.md` (header
#    table + gap G6 row). It is NOT yet named in `README.md`, nor in
#    `CLAUDE.md` / `AGENTS.md` / `QWEN.md` / `GEMINI.md`, whose "Known open
#    gaps" section still lists G6 as open. That is an unmet part of §11.4.31 and
#    is recorded rather than papered over.
# 2. §11.4.31's "Anti-bluff guarantee" requires this manifest to be paired with
#    a Challenge script that bootstraps a throwaway consuming project and runs
#    `incorporate-submodule` against it. `incorporate-submodule` does not exist
#    anywhere in this checkout (`submodules/constitution/scripts/` has no such
#    script, and no file under the submodule matches `*incorporate*`). The
#    verification proof therefore CANNOT be built from this checkout, and none
#    is claimed. What IS mechanically checked is weaker than §11.4.31's mandate:
#    the dep NAMES match `.gitmodules` in both directions
#    (verify-governance-cascade.sh C6) and every `ref:` matches its gitlink
#    (C9 / scripts/verify-manifest-pins.sh).
# 3. WITHDRAWN CLAIM (§11.4.6 requires withdrawal, not quiet replacement). This
#    file previously asserted "The manifest is accurate against
#    `git submodule status`". That assertion was FALSE for at least the six days
#    before 2026-09-01 and nothing measured it — see the HISTORY paragraph in the
#    Refs section. It is withdrawn, not restated. Accuracy is now a gate result,
#    not a sentence: run `bash scripts/verify-manifest-pins.sh`.

