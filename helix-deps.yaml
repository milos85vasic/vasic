#     A gitlink OF the milosvasic.ru submodule (a fourth-level repository), not
#     of this root. Its AGENTS.md and CLAUDE.md are the other two
#     known-excluded propagation-gate findings.
#
#   submodules/qa's own 27 nested gitlinks (CONST-047 / §11.4.32 recursive
#   scope — cascade check C7). Declared in HelixDevelopment/qa's own
#   .gitmodules under tools/opensource/* and tools/test-apps/*: Android/mobile
#   device QA tooling (device control, emulation, app automation, evidence and
