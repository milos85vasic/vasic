#   MEASURED 2026-09-23, that is NOT the state of this checkout: all 27 ARE
#   initialised (`git -C submodules/qa submodule status` prints 27 rows, none
#   with the '-' uninitialised prefix). The earlier "Deliberately NOT
#   initialized in this checkout" sentence is WITHDRAWN as false; nothing was
#   de-initialised to make this file true. Their carriers are excluded from the
#   covenant-propagation gate family as vendored-third-party in
#   config/covenant_propagation_exclusions.tsv. None of
#   the 27 accounts below is in an operator-listed org (milos85vasic,
#   vasic-digital, HelixDevelopment); each receives no §4 tag, no §11.4.157
#   carrier, and no §11.4.156 CI action (out of scope per §11.4.156(C)), same
#   as `submodules/superspec` above.
