<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenDesign Learning Kit — Component Demo</title>

  <style>
    /* ---- Load the OpenDesign token layer + the kit (decoupled deps only) ---- */
    @import url("../brand-milosvasic/milosvasic.css");
    @import url("kit-tokens.css");
    @import url("learning-kit.css");

    /* ---- Demo-only scaffolding (NOT part of the kit) ---------------------- */
    body {
      font-family: var(--od-font-body);
      background-color: var(--od-bg);
      color: var(--od-text);
      margin: 0;
      padding: clamp(1rem, 4vw, 2.5rem);
    }

    .demo-masthead {
      max-width: 1100px;
      margin: 0 auto 2rem;
    }
    .demo-masthead h1 {
      font-family: var(--od-font-display);
      font-size: var(--od-fs-3xl);
      margin: 0 0 .25rem;
    }
    .demo-masthead p {
      color: var(--od-text-muted);
      margin: 0;
      max-width: 70ch;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    @media (min-width: 1024px) {
      .demo-grid { grid-template-columns: 1fr 1fr; align-items: start; }
    }

    /* Each theme panel paints its OWN token background so light + dark are
       visible side by side on one standalone page. Only the ~10 theme tokens
       are re-declared here (values mirror the active OpenDesign brand). */
    .lk-demo-theme {
      background-color: var(--od-bg);
      color: var(--od-text);
      border: 1px solid var(--od-border);
      border-radius: var(--od-radius-xl);
      padding: clamp(1rem, 3vw, 1.75rem);
    }
    .lk-demo-theme[data-theme="dark"] {
      --od-bg: #14110d;
      --od-surface: #1c1813;
      --od-surface-2: #26211a;
      --od-text: #f2ede3;
      --od-text-muted: #a89f92;
      --od-border: #4a4136;
      --od-accent: #f05a6f;
      --od-accent-hover: #e8737b;
      --od-accent-active: #ef8d94;
      --od-on-accent: #14110d;
      --od-shadow-color: rgba(0, 0, 0, .55);
      color-scheme: dark;
    }

    .demo-theme-tag {
      display: inline-block;
      font-family: var(--od-font-mono);
      font-size: var(--od-fs-xs);
      letter-spacing: var(--od-tracking-wide);
      text-transform: uppercase;
      color: var(--od-text-muted);
      margin-bottom: 1.25rem;
    }

    .demo-block { margin-bottom: 1.75rem; }
    .demo-block > h3 {
      font-family: var(--od-font-mono);
      font-size: var(--od-fs-xs);
      letter-spacing: var(--od-tracking-wide);
      text-transform: uppercase;
      color: var(--od-text-muted);
      border-bottom: 1px dashed var(--od-border);
      padding-bottom: .35rem;
      margin: 0 0 .85rem;
    }
    .demo-row {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      align-items: center;
    }
    .demo-stack { display: grid; gap: .6rem; }

    /* Minimal button styling for hero/fab demo actions (reuses od tokens). */
    .demo-btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: var(--od-space-3) var(--od-space-5);
      border-radius: var(--od-radius-md);
      border: 1px solid var(--od-accent);
      background: var(--od-accent); color: var(--od-on-accent);
      font: inherit; font-weight: 600; cursor: pointer;
    }
    .demo-btn--ghost { background: transparent; color: var(--od-text); border-color: var(--od-border); }

    /* FAB/toast are position:fixed in the kit; in the demo we render them inline
       so both themes' copies are visible. */
    .demo-fixed-inline .lk-fab,
    .demo-fixed-inline .lk-toast-region { position: static; transform: none; }
    .demo-fixed-inline .lk-toast-region { width: 100%; }
  </style>
</head>
<body>
  <header class="demo-masthead">
    <h1>OpenDesign Learning Kit</h1>
    <p>
      A decoupled, brand-neutral component library (<code>lk-*</code>) driven entirely by the
      OpenDesign <code>--od-*</code> token layer. Every component below is rendered twice —
      in <strong>light</strong> and <strong>dark</strong> — from the same markup, proving the
      kit themes purely by consuming tokens.
    </p>
  </header>

  <!-- Component gallery authored ONCE, cloned into both theme panels ---------->
  <template id="lk-gallery">
    <div class="demo-block">
      <h3>Hero</h3>
      <div class="lk-hero">
        <span class="lk-hero__eyebrow">Path · Frontend</span>
        <h2 class="lk-hero__title">Master Modern CSS</h2>
        <p class="lk-hero__lede">Twelve hands-on modules from tokens to container queries. Build a
          production design system as you learn.</p>
        <div class="lk-hero__actions">
          <button class="demo-btn">Start learning</button>
          <button class="demo-btn demo-btn--ghost">Preview syllabus</button>
        </div>
      </div>
    </div>

    <div class="demo-block">
      <h3>Breadcrumb + Nav</h3>
      <ol class="lk-breadcrumb" style="margin-bottom:1rem">
        <li class="lk-breadcrumb__item"><a class="lk-breadcrumb__link" href="#">Home</a></li>
        <li class="lk-breadcrumb__sep" aria-hidden="true">/</li>
        <li class="lk-breadcrumb__item"><a class="lk-breadcrumb__link" href="#">Paths</a></li>
        <li class="lk-breadcrumb__sep" aria-hidden="true">/</li>
        <li class="lk-breadcrumb__item" aria-current="page">Modern CSS</li>
      </ol>
      <nav class="lk-nav" aria-label="Course sections">
        <a class="lk-nav__item lk-nav__item--active" href="#" aria-current="page">Overview</a>
        <a class="lk-nav__item" href="#">Modules</a>
        <a class="lk-nav__item" href="#">Practice <span class="lk-badge">3</span></a>
        <a class="lk-nav__item" href="#">Discussion</a>
      </nav>
    </div>

    <div class="demo-block">
      <h3>Stats</h3>
      <div class="demo-row">
        <div class="lk-stat" style="flex:1;min-width:120px">
          <span class="lk-stat__value">68%</span>
          <span class="lk-stat__label">Course progress</span>
          <span class="lk-stat__trend lk-stat__trend--up">▲ 12% this week</span>
        </div>
        <div class="lk-stat" style="flex:1;min-width:120px">
          <span class="lk-stat__value">14</span>
          <span class="lk-stat__label">Day streak</span>
          <span class="lk-stat__trend lk-stat__trend--down">▼ 2 vs. last</span>
        </div>
      </div>
    </div>

    <div class="demo-block">
      <h3>Pills &amp; Badges</h3>
      <div class="demo-row">
        <span class="lk-pill"><span class="lk-pill__dot"></span>Neutral</span>
        <span class="lk-pill lk-pill--accent">Enrolled</span>
        <span class="lk-pill lk-pill--success">Completed</span>
        <span class="lk-pill lk-pill--warning">In progress</span>
        <span class="lk-pill lk-pill--danger">Overdue</span>
        <span class="lk-badge">9+</span>
        <span class="lk-badge lk-badge--dot" aria-label="new"></span>
      </div>
    </div>

    <div class="demo-block">
      <h3>Chips</h3>
      <div class="demo-row">
        <button class="lk-chip lk-chip--selected" aria-pressed="true">All</button>
        <button class="lk-chip" aria-pressed="false">Beginner</button>
        <button class="lk-chip" aria-pressed="false">Advanced</button>
        <span class="lk-chip">React
          <button class="lk-chip__remove" aria-label="Remove React filter">×</button>
        </span>
      </div>
    </div>

    <div class="demo-block">
      <h3>Progress ring — SVG + conic</h3>
      <div class="demo-row">
        <div class="lk-progress-ring" role="img" aria-label="72 percent complete">
          <svg class="lk-progress-ring__svg" viewBox="0 0 96 96">
            <circle class="lk-progress-ring__track" cx="48" cy="48" r="43"></circle>
            <circle class="lk-progress-ring__value" cx="48" cy="48" r="43"
              stroke-dasharray="270.18" stroke-dashoffset="75.65"></circle>
          </svg>
          <span class="lk-progress-ring__label">72%</span>
        </div>
        <div class="lk-progress-ring lk-progress-ring--conic" style="--lk-progress:45"
             role="img" aria-label="45 percent complete">
          <span class="lk-progress-ring__label">45%</span>
        </div>
        <div class="lk-progress-ring lk-progress-ring--conic" style="--lk-progress:90"
             role="img" aria-label="90 percent complete">
          <span class="lk-progress-ring__label">90%</span>
        </div>
      </div>
    </div>

    <div class="demo-block">
      <h3>Track card</h3>
      <article class="lk-track-card" tabindex="0">
        <div class="lk-track-card__media"></div>
        <div class="lk-track-card__content">
          <span class="lk-track-card__eyebrow">12 modules · 6h</span>
          <h3 class="lk-track-card__title">Design Systems 101</h3>
          <p class="lk-track-card__desc">Tokens, components, theming and accessibility from first
            principles.</p>
        </div>
        <div class="lk-track-card__footer">
          <span class="lk-track-card__progress" style="--lk-progress:64%"></span>
          <span class="lk-track-card__progress-label">64%</span>
        </div>
      </article>
    </div>

    <div class="demo-block">
      <h3>Module cards</h3>
      <div class="demo-stack">
        <div class="lk-module-card lk-module-card--done lk-module-card--interactive" tabindex="0">
          <span class="lk-module-card__index">✓</span>
          <span class="lk-module-card__main">
            <span class="lk-module-card__title">Introduction to tokens</span>
            <span class="lk-module-card__meta">Completed · 18 min</span>
          </span>
          <span class="lk-pill lk-pill--success">Done</span>
        </div>
        <div class="lk-module-card lk-module-card--interactive" tabindex="0">
          <span class="lk-module-card__index">2</span>
          <span class="lk-module-card__main">
            <span class="lk-module-card__title">Color &amp; contrast</span>
            <span class="lk-module-card__meta">24 min</span>
          </span>
          <span class="lk-pill lk-pill--accent">Next</span>
        </div>
        <div class="lk-module-card lk-module-card--locked">
          <span class="lk-module-card__index">3</span>
          <span class="lk-module-card__main">
            <span class="lk-module-card__title">Motion &amp; interaction</span>
            <span class="lk-module-card__meta">Locked · 31 min</span>
          </span>
          <span class="lk-pill">🔒</span>
        </div>
      </div>
    </div>

    <div class="demo-block">
      <h3>Flashcard (click / focus to flip)</h3>
      <div class="lk-flashcard" tabindex="0" role="button" aria-label="Flashcard: flip to reveal">
        <div class="lk-flashcard__inner">
          <div class="lk-flashcard__face lk-flashcard__face--front">
            <span class="lk-flashcard__kicker">Term</span>
            <p class="lk-flashcard__term">Cascade</p>
            <p class="lk-flashcard__definition">Tap to reveal the definition</p>
          </div>
          <div class="lk-flashcard__face lk-flashcard__face--back">
            <span class="lk-flashcard__kicker">Definition</span>
            <p class="lk-flashcard__definition">The algorithm that resolves which CSS declaration
              wins when several apply to an element.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="demo-block">
      <h3>Quiz options — every state</h3>
      <div class="demo-stack">
        <button class="lk-quiz-option" type="button">
          <span class="lk-quiz-option__marker">A</span>
          <span class="lk-quiz-option__text">Default option</span>
        </button>
        <button class="lk-quiz-option lk-quiz-option--selected" type="button" aria-checked="true">
          <span class="lk-quiz-option__marker">B</span>
          <span class="lk-quiz-option__text">Selected option</span>
        </button>
        <button class="lk-quiz-option lk-quiz-option--correct" type="button">
          <span class="lk-quiz-option__marker">✓</span>
          <span class="lk-quiz-option__text">Correct answer</span>
        </button>
        <button class="lk-quiz-option lk-quiz-option--incorrect" type="button">
          <span class="lk-quiz-option__marker">✕</span>
          <span class="lk-quiz-option__text">Incorrect answer</span>
        </button>
      </div>
    </div>

    <div class="demo-block">
      <h3>Base card + skeleton loader</h3>
      <div class="demo-row" style="align-items:stretch">
        <div class="lk-card lk-card--interactive lk-card--accent" tabindex="0" style="flex:1;min-width:200px">
          <h3 class="lk-card__title">Interactive card</h3>
          <p class="lk-card__body">Hover or focus me — I lift and deepen my shadow, accent rail on
            the leading edge.</p>
        </div>
        <div class="lk-card" style="flex:1;min-width:200px" aria-busy="true">
          <div class="lk-skeleton lk-skeleton--thumb"></div>
          <div class="lk-skeleton lk-skeleton--title"></div>
          <div class="lk-skeleton lk-skeleton--text lk-skeleton--line-lg"></div>
          <div class="lk-skeleton lk-skeleton--text lk-skeleton--line-sm"></div>
        </div>
      </div>
    </div>

    <div class="demo-block">
      <h3>FAB + Toasts (shown inline)</h3>
      <div class="demo-fixed-inline demo-stack">
        <div class="demo-row">
          <button class="lk-fab">＋ New note</button>
          <button class="lk-fab lk-fab--icon" aria-label="Add">＋</button>
        </div>
        <div class="lk-toast-region" style="position:static">
          <div class="lk-toast" role="status">
            <span class="lk-toast__icon">ⓘ</span>
            <span class="lk-toast__body">
              <span class="lk-toast__title">Autosaved</span>
              <span class="lk-toast__msg">Your progress was saved a moment ago.</span>
            </span>
            <button class="lk-toast__close" aria-label="Dismiss">×</button>
          </div>
          <div class="lk-toast lk-toast--success" role="status">
            <span class="lk-toast__icon">✓</span>
            <span class="lk-toast__body">
              <span class="lk-toast__title">Module complete</span>
              <span class="lk-toast__msg">You earned the Color &amp; Contrast badge.</span>
            </span>
            <button class="lk-toast__close" aria-label="Dismiss">×</button>
          </div>
          <div class="lk-toast lk-toast--warning" role="status">
            <span class="lk-toast__icon">!</span>
            <span class="lk-toast__body">
              <span class="lk-toast__title">Quiz due soon</span>
              <span class="lk-toast__msg">Module 2 quiz closes in 2 hours.</span>
            </span>
            <button class="lk-toast__close" aria-label="Dismiss">×</button>
          </div>
          <div class="lk-toast lk-toast--danger" role="alert">
            <span class="lk-toast__icon">×</span>
            <span class="lk-toast__body">
              <span class="lk-toast__title">Connection lost</span>
              <span class="lk-toast__msg">We couldn't reach the server. Retrying…</span>
            </span>
            <button class="lk-toast__close" aria-label="Dismiss">×</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <main class="demo-grid">
    <section class="lk-demo-theme" data-theme="light" aria-label="Light theme">
      <span class="demo-theme-tag">Light theme</span>
      <div class="demo-panel-mount"></div>
    </section>
    <section class="lk-demo-theme" data-theme="dark" aria-label="Dark theme">
      <span class="demo-theme-tag">Dark theme</span>
      <div class="demo-panel-mount"></div>
    </section>
  </main>

  <script>
    // Clone the single gallery into both theme panels (identical markup, themed
    // only by the surrounding token scope).
    (function () {
      var tpl = document.getElementById('lk-gallery');
      document.querySelectorAll('.demo-panel-mount').forEach(function (mount) {
        mount.appendChild(tpl.content.cloneNode(true));
      });

      // Flashcard: toggle .is-flipped on click (focus-within already flips via CSS).
      document.addEventListener('click', function (e) {
        var card = e.target.closest('.lk-flashcard');
        if (card) card.classList.toggle('is-flipped');
      });

      // Quiz options: single-select within a stack (demo interactivity).
      document.addEventListener('click', function (e) {
        var opt = e.target.closest('.lk-quiz-option');
        if (!opt || opt.classList.contains('lk-quiz-option--correct') ||
            opt.classList.contains('lk-quiz-option--incorrect')) return;
        var stack = opt.parentElement;
        stack.querySelectorAll('.lk-quiz-option--selected').forEach(function (o) {
          o.classList.remove('lk-quiz-option--selected');
          o.setAttribute('aria-checked', 'false');
        });
        opt.classList.add('lk-quiz-option--selected');
        opt.setAttribute('aria-checked', 'true');
      });

      // Toast dismiss.
      document.addEventListener('click', function (e) {
        var close = e.target.closest('.lk-toast__close');
        if (close) close.closest('.lk-toast').remove();
      });
    })();
  </script>
</body>
</html>
