<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:#a31e39;--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:#ff6b81;--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">Courses-Creator — generation pipeline</text>
<text class="lbl" x="40" y="122">Content in</text>
<text class="lbl" x="860" y="122">Course out</text>
<text class="note" x="300" y="300">Optional-AI: basic ↔ enhanced path selected by provider keys · one backend, three clients (desktop / mobile / web)</text>
<path class="conn" marker-end="url(#a)" d="M200,195 L238,195"/>
<path class="conn" marker-end="url(#a)" d="M410,195 L448,195"/>
<path class="conn" marker-end="url(#a)" d="M610,195 L648,195"/>
<path class="conn" marker-end="url(#a)" d="M820,195 L858,195"/>
<rect class="box" x="40" y="150" width="160" height="90" rx="10"/>
<text class="t" x="120" y="184">Markdown source</text>
<text class="s" x="120" y="204">course outline</text>
<rect class="accent" x="240" y="150" width="170" height="90" rx="10"/>
<text class="t" x="325" y="184">LLM enrichment</text>
<text class="s" x="325" y="204">OpenAI · Anthropic · Ollama</text>
<rect class="box" x="450" y="150" width="160" height="90" rx="10"/>
<text class="t" x="530" y="184">TTS + music</text>
<text class="s" x="530" y="204">Bark · SpeechT5</text>
<rect class="box" x="650" y="150" width="170" height="90" rx="10"/>
<text class="t" x="735" y="184">Video assembly</text>
<text class="s" x="735" y="204">render + mux</text>
<rect class="good" x="860" y="150" width="110" height="90" rx="10"/>
<text class="gt" x="915" y="195">Publish</text>
</svg>