<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:var(--od-accent,#a31e39);--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:var(--od-accent,#ff6b81);--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">Mail Server Factory — JSON → Docker mail stack</text>
<text class="lbl" x="600" y="72">Installed Docker mail stack</text>
<text class="lbl" x="40" y="400">Connection-type fan-out</text>
<text class="note" x="500" y="524">Security: AES-256-GCM · firewall ports · TLS/HSTS · RBAC · audit log</text>
<rect class="box" x="40" y="220" width="180" height="90" rx="10"/>
<text class="t" x="130" y="254">JSON config</text>
<text class="s" x="130" y="274">declarative recipe</text>
<rect class="accent" x="280" y="190" width="220" height="150" rx="10"/>
<text class="t" x="390" y="265">Factory engine</text>
<text class="s" x="390" y="285">Kotlin 2.0 · JVM G1GC</text>
<rect class="box" x="600" y="90" width="340" height="58" rx="10"/>
<text class="t" x="770" y="124">Postfix</text>
<text class="s" x="770" y="144">SMTP</text>
<rect class="box" x="600" y="160" width="340" height="58" rx="10"/>
<text class="t" x="770" y="194">Dovecot</text>
<text class="s" x="770" y="214">IMAP / POP</text>
<rect class="box" x="600" y="230" width="340" height="58" rx="10"/>
<text class="t" x="770" y="264">TLS / HSTS</text>
<text class="s" x="770" y="284">certificates</text>
<rect class="box" x="600" y="300" width="340" height="58" rx="10"/>
<text class="t" x="770" y="334">Sieve</text>
<text class="s" x="770" y="354">filtering</text>
<rect class="box" x="40" y="420" width="920" height="72" rx="10"/>
<text class="t" x="490" y="464">Connection targets</text>
<text class="s" x="490" y="484">local · SSH · Docker · K8s · AWS SSM · Azure · GCP · Libvirt</text>
<path class="conn" marker-end="url(#a)" d="M220,265 L278,265"/>
<path class="conn" marker-end="url(#a)" d="M500,230 L598,119"/>
<path class="conn" marker-end="url(#a)" d="M500,250 L598,189"/>
<path class="conn" marker-end="url(#a)" d="M500,270 L598,259"/>
<path class="conn" marker-end="url(#a)" d="M500,300 L598,329"/>
<path class="conn" marker-end="url(#a)" d="M390,340 L390,418"/>
</svg>