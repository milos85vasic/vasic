<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:var(--od-accent,#a31e39);--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:var(--od-accent,#ff6b81);--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">HelixLLM — scored provider fallback chain</text>
<text class="lbl" x="470" y="74">Ranked by LLMsVerifier (5-min refresh)</text>
<text class="lbl" x="470" y="415">↓ skip on 429 / 5xx</text>
<rect class="accent" x="40" y="240" width="150" height="80" rx="10"/>
<text class="t" x="115" y="274">Request</text>
<text class="s" x="115" y="294">OpenAI / Anthropic API</text>
<rect class="box" x="240" y="240" width="170" height="80" rx="10"/>
<text class="t" x="325" y="274">HTTP/3 Gateway</text>
<text class="s" x="325" y="294">TLS 1.3 · QUIC</text>
<rect class="box" x="470" y="90" width="200" height="52" rx="10"/>
<text class="t" x="570" y="116">Chutes</text>
<rect class="box" x="470" y="152" width="200" height="52" rx="10"/>
<text class="t" x="570" y="178">OpenRouter</text>
<rect class="box" x="470" y="214" width="200" height="52" rx="10"/>
<text class="t" x="570" y="240">Cerebras</text>
<rect class="box" x="470" y="276" width="200" height="52" rx="10"/>
<text class="t" x="570" y="302">SambaNova</text>
<rect class="box" x="470" y="338" width="200" height="52" rx="10"/>
<text class="t" x="570" y="364">Together</text>
<rect class="good" x="470" y="440" width="200" height="64" rx="10"/>
<text class="gt" x="570" y="472">llama.cpp (local)</text>
<text class="s" x="570" y="492">guaranteed fallback</text>
<rect class="box" x="730" y="300" width="180" height="72" rx="10"/>
<text class="t" x="820" y="334">Response</text>
<text class="s" x="820" y="354">first success wins</text>
<path class="conn" marker-end="url(#a)" d="M190,280 L238,280"/>
<path class="conn" marker-end="url(#a)" d="M410,270 L468,116"/>
<path class="conn" marker-end="url(#a)" d="M570,142 L570,150"/>
<path class="conn" marker-end="url(#a)" d="M570,204 L570,212"/>
<path class="conn" marker-end="url(#a)" d="M570,266 L570,274"/>
<path class="conn" marker-end="url(#a)" d="M570,328 L570,336"/>
<path class="conn" marker-end="url(#a)" d="M570,390 L570,438"/>
<path class="conn" marker-end="url(#a)" d="M670,240 L728,320"/>
<path class="conn" marker-end="url(#a)" d="M670,472 L728,346"/>
</svg>