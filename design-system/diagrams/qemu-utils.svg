<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:var(--od-diagram-ink,#1e293b);--muted:var(--od-diagram-muted,#475569);--line:var(--od-diagram-line,#94a3b8);--accent:var(--od-accent,#a31e39);--panel:var(--od-diagram-panel,#f8fafc);--panel2:var(--od-diagram-panel2,#eef2f7);--tint:var(--od-diagram-tint,#f4dde1);--good:var(--od-diagram-good,#dcfce7);--goodln:var(--od-diagram-good-line,#16a34a);--goodink:var(--od-diagram-good-ink,#14532d);}
@media(prefers-color-scheme:dark){svg{--ink:var(--od-diagram-ink,#e2e8f0);--muted:var(--od-diagram-muted,#cbd5e1);--line:var(--od-diagram-line,#64748b);--accent:var(--od-accent,#ff6b81);--panel:var(--od-diagram-panel,#1e293b);--panel2:var(--od-diagram-panel2,#273449);--tint:var(--od-diagram-tint,#3a2530);--good:var(--od-diagram-good,#14321f);--goodln:var(--od-diagram-good-line,#4ade80);--goodink:var(--od-diagram-good-ink,#bbf7d0);}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">Qemu-Utils — VM lifecycle + networking</text>
<text class="lbl" x="30" y="100">VM lifecycle</text>
<text class="lbl" x="410" y="252">Bridge + TAP networking</text>
<path class="conn" marker-end="url(#a)" d="M190,160 L208,160"/>
<path class="conn" marker-end="url(#a)" d="M390,160 L408,160"/>
<path class="conn" marker-end="url(#a)" d="M560,160 L578,160"/>
<path class="conn" marker-end="url(#a)" d="M760,160 L788,160"/>
<path class="conn" marker-end="url(#a)" d="M485,200 L485,268"/>
<path class="conn" marker-end="url(#a)" d="M450,340 L320,378"/>
<path class="conn" marker-end="url(#a)" d="M485,340 L485,378"/>
<path class="conn" marker-end="url(#a)" d="M520,340 L680,378"/>
<rect class="box" x="30" y="120" width="160" height="80" rx="10"/>
<text class="t" x="110" y="164">ISO / image</text>
<rect class="box" x="210" y="120" width="180" height="80" rx="10"/>
<text class="t" x="300" y="154">Cache</text>
<text class="s" x="300" y="174">compressed / uncompressed</text>
<rect class="accent" x="410" y="120" width="150" height="80" rx="10"/>
<text class="t" x="485" y="164">Run VM</text>
<text class="s" x="485" y="184">QEMU</text>
<rect class="box" x="580" y="120" width="180" height="80" rx="10"/>
<text class="t" x="670" y="154">Publish</text>
<text class="s" x="670" y="174">remote endpoint</text>
<rect class="dash" x="790" y="120" width="180" height="80" rx="10"/>
<text class="t" x="880" y="154">Accel path</text>
<text class="s" x="880" y="174">Linux KVM · macOS HVF</text>
<rect class="box" x="410" y="270" width="150" height="70" rx="10"/>
<text class="t" x="485" y="310">Host bridge</text>
<rect class="box" x="210" y="380" width="150" height="60" rx="10"/>
<text class="t" x="285" y="410">TAP0 → VM</text>
<rect class="box" x="410" y="380" width="150" height="60" rx="10"/>
<text class="t" x="485" y="410">TAP1 → VM</text>
<rect class="box" x="610" y="380" width="150" height="60" rx="10"/>
<text class="t" x="685" y="410">TAP2 → VM</text>
</svg>