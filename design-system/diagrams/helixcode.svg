<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:var(--od-accent,#a31e39);--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:var(--od-accent,#ff6b81);--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">HelixCode — layered architecture</text>
<text class="lbl" x="40" y="90">API layer</text>
<text class="lbl" x="40" y="240">Core services</text>
<text class="lbl" x="40" y="462">Data layer</text>
<path class="conn" marker-end="url(#a)" d="M220,164 L220,248"/>
<path class="conn" marker-end="url(#a)" d="M480,164 L480,248"/>
<path class="conn" marker-end="url(#a)" d="M740,164 L740,248"/>
<path class="conn" marker-end="url(#a)" d="M360,332 L360,468"/>
<path class="conn" marker-end="url(#a)" d="M600,332 L600,468"/>
<rect class="box" x="120" y="100" width="200" height="64" rx="10"/>
<text class="t" x="220" y="134">REST API</text>
<rect class="box" x="380" y="100" width="200" height="64" rx="10"/>
<text class="t" x="480" y="134">WebSocket</text>
<rect class="box" x="640" y="100" width="200" height="64" rx="10"/>
<text class="t" x="740" y="134">MCP</text>
<text class="s" x="740" y="154">multi-transport</text>
<rect class="box" x="40" y="250" width="170" height="82" rx="10"/>
<text class="t" x="125" y="284">Auth &amp; Sessions</text>
<text class="s" x="125" y="304">JWT</text>
<rect class="box" x="226" y="250" width="170" height="82" rx="10"/>
<text class="t" x="311" y="284">Worker Pool</text>
<text class="s" x="311" y="304">SSH · health monitor</text>
<rect class="box" x="412" y="250" width="170" height="82" rx="10"/>
<text class="t" x="497" y="284">Task + Checkpointing</text>
<text class="s" x="497" y="304">rollback / resume</text>
<rect class="box" x="598" y="250" width="170" height="82" rx="10"/>
<text class="t" x="683" y="296">Project &amp; Workflow</text>
<rect class="box" x="784" y="250" width="170" height="82" rx="10"/>
<text class="t" x="869" y="284">LLM Providers</text>
<text class="s" x="869" y="304">llama.cpp · Ollama · OpenAI</text>
<rect class="box" x="260" y="470" width="200" height="72" rx="10"/>
<text class="t" x="360" y="504">PostgreSQL 15+</text>
<text class="s" x="360" y="524">11-table schema</text>
<rect class="box" x="500" y="470" width="200" height="72" rx="10"/>
<text class="t" x="600" y="504">Redis 7</text>
<text class="s" x="600" y="524">optional cache</text>
</svg>