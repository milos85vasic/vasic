<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:#a31e39;--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:#ff6b81;--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">HelixPlay — media pipeline (per-stage tech)</text>
<text class="lbl" x="30" y="122">GPU host</text>
<text class="lbl" x="880" y="122">Phone · TV · laptop · browser</text>
<text class="note" x="420" y="320">Triple-stack clients (Wails · Flutter · Angular→WASM) over one Go core</text>
<rect class="box" x="30" y="150" width="150" height="90" rx="10"/>
<text class="t" x="105" y="184">Capture</text>
<text class="s" x="105" y="204">DXGI · SCK · PipeWire</text>
<rect class="box" x="200" y="150" width="150" height="90" rx="10"/>
<text class="t" x="275" y="184">Encode</text>
<text class="s" x="275" y="204">NVENC·QSV·AMF·VT</text>
<rect class="box" x="370" y="150" width="150" height="90" rx="10"/>
<text class="t" x="445" y="184">Packetize</text>
<text class="s" x="445" y="204">RTP</text>
<rect class="accent" x="540" y="150" width="150" height="90" rx="10"/>
<text class="t" x="615" y="184">Transmit</text>
<text class="s" x="615" y="204">WebRTC · QUIC · UDP</text>
<rect class="box" x="710" y="150" width="150" height="90" rx="10"/>
<text class="t" x="785" y="184">Decode</text>
<text class="s" x="785" y="204">hardware</text>
<rect class="good" x="880" y="150" width="150" height="90" rx="10"/>
<text class="gt" x="955" y="184">Render</text>
<text class="s" x="955" y="204">client</text>
<path class="conn" marker-end="url(#a)" d="M180,195 L198,195"/>
<path class="conn" marker-end="url(#a)" d="M350,195 L368,195"/>
<path class="conn" marker-end="url(#a)" d="M520,195 L538,195"/>
<path class="conn" marker-end="url(#a)" d="M690,195 L708,195"/>
<path class="conn" marker-end="url(#a)" d="M860,195 L878,195"/>
</svg>