<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:#a31e39;--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:#ff6b81;--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">LLMOrchestrator — control-plane fan-out</text>
<text class="lbl" x="620" y="52">Coding agents (spawned + driven)</text>
<text class="lbl" x="40" y="340">Resilience</text>
<path class="conn" marker-end="url(#a)" d="M220,255 L278,255"/>
<path class="conn" marker-end="url(#a)" d="M520,220 L618,99"/>
<path class="conn" marker-end="url(#a)" d="M520,235 L618,169"/>
<path class="conn" marker-end="url(#a)" d="M520,255 L618,239"/>
<path class="conn" marker-end="url(#a)" d="M520,275 L618,309"/>
<path class="conn" marker-end="url(#a)" d="M520,295 L618,379"/>
<path class="conn" marker-end="url(#a)" d="M400,330 L400,398"/>
<path class="conn" marker-end="url(#a)" d="M220,392 L278,320"/>
<rect class="box" x="40" y="210" width="180" height="90" rx="10"/>
<text class="t" x="130" y="255">Client / caller</text>
<rect class="accent" x="280" y="180" width="240" height="150" rx="10"/>
<text class="t" x="400" y="225">MultiProviderPool</text>
<text class="s" x="400" y="245">round-robin / preference</text>
<rect class="box" x="620" y="70" width="320" height="58" rx="10"/>
<text class="t" x="780" y="104">OpenCode</text>
<rect class="box" x="620" y="140" width="320" height="58" rx="10"/>
<text class="t" x="780" y="174">Claude Code</text>
<rect class="box" x="620" y="210" width="320" height="58" rx="10"/>
<text class="t" x="780" y="244">Gemini</text>
<rect class="box" x="620" y="280" width="320" height="58" rx="10"/>
<text class="t" x="780" y="314">Junie</text>
<rect class="box" x="620" y="350" width="320" height="58" rx="10"/>
<text class="t" x="780" y="384">Qwen Code</text>
<rect class="dash" x="280" y="400" width="240" height="64" rx="10"/>
<text class="t" x="400" y="434">Transport</text>
<text class="s" x="400" y="454">pipe JSON-lines · file inbox/outbox</text>
<rect class="box" x="40" y="360" width="180" height="64" rx="10"/>
<text class="t" x="130" y="394">Circuit breaker</text>
<text class="s" x="130" y="414">closed→open→half-open</text>
</svg>