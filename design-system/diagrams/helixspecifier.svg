<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:var(--od-accent,#a31e39);--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:var(--od-accent,#ff6b81);--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">HelixSpecifier — three pillars → one flow</text>
<text class="lbl" x="60" y="72">Three pillars</text>
<text class="note" x="620" y="288">effort in → ceremony out (scaling dial)</text>
<rect class="box" x="60" y="90" width="240" height="80" rx="10"/>
<text class="t" x="180" y="124">SpecKit</text>
<text class="s" x="180" y="144">specification</text>
<rect class="box" x="360" y="90" width="240" height="80" rx="10"/>
<text class="t" x="480" y="124">Superpowers</text>
<text class="s" x="480" y="144">capability skills</text>
<rect class="box" x="660" y="90" width="240" height="80" rx="10"/>
<text class="t" x="780" y="124">GSD</text>
<text class="s" x="780" y="144">get-stuff-done</text>
<rect class="accent" x="360" y="240" width="240" height="90" rx="10"/>
<text class="t" x="480" y="274">Fusion engine</text>
<text class="s" x="480" y="294">Go · adaptive ceremony</text>
<rect class="good" x="360" y="390" width="240" height="80" rx="10"/>
<text class="gt" x="480" y="424">Executed flow</text>
<text class="s" x="480" y="444">+ quality score</text>
<path class="conn" marker-end="url(#a)" d="M180,170 L420,238"/>
<path class="conn" marker-end="url(#a)" d="M480,170 L480,238"/>
<path class="conn" marker-end="url(#a)" d="M780,170 L540,238"/>
<path class="conn" marker-end="url(#a)" d="M480,330 L480,388"/>
</svg>