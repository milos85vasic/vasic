<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:#a31e39;--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:#ff6b81;--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">HelixBuilder — one install.sh → nine categories</text>
<text class="lbl" x="400" y="52">Category selector fan-out</text>
<text class="lbl" x="80" y="200">Pick your pipeline</text>
<path class="conn" marker-end="url(#a)" d="M470,150 L180,218"/>
<path class="conn" marker-end="url(#a)" d="M490,150 L480,218"/>
<path class="conn" marker-end="url(#a)" d="M510,150 L780,218"/>
<path class="conn" marker-end="url(#a)" d="M460,150 L180,308"/>
<path class="conn" marker-end="url(#a)" d="M490,150 L480,308"/>
<path class="conn" marker-end="url(#a)" d="M520,150 L780,308"/>
<path class="conn" marker-end="url(#a)" d="M455,150 L180,398"/>
<path class="conn" marker-end="url(#a)" d="M490,150 L480,398"/>
<path class="conn" marker-end="url(#a)" d="M525,150 L780,398"/>
<rect class="accent" x="400" y="70" width="180" height="80" rx="10"/>
<text class="t" x="490" y="104">install.sh</text>
<text class="s" x="490" y="124">category selector</text>
<rect class="box" x="80" y="220" width="200" height="70" rx="10"/>
<text class="t" x="180" y="255">General</text>
<rect class="box" x="380" y="220" width="200" height="70" rx="10"/>
<text class="t" x="480" y="255">Coder</text>
<rect class="box" x="680" y="220" width="200" height="70" rx="10"/>
<text class="t" x="780" y="255">Tester</text>
<rect class="box" x="80" y="310" width="200" height="70" rx="10"/>
<text class="t" x="180" y="345">Translation</text>
<rect class="box" x="380" y="310" width="200" height="70" rx="10"/>
<text class="t" x="480" y="345">Animation</text>
<rect class="box" x="680" y="310" width="200" height="70" rx="10"/>
<text class="t" x="780" y="345">Audio</text>
<rect class="box" x="80" y="400" width="200" height="70" rx="10"/>
<text class="t" x="180" y="435">JPEG</text>
<rect class="box" x="380" y="400" width="200" height="70" rx="10"/>
<text class="t" x="480" y="435">PNG</text>
<rect class="box" x="680" y="400" width="200" height="70" rx="10"/>
<text class="t" x="780" y="435">SVG</text>
</svg>