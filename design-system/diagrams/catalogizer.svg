<text class="t" x="835" y="362">Prometheus · OTel</text>
<text class="s" x="835" y="382">metrics · traces</text>
<rect class="tint" x="250" y="440" width="230" height="72" rx="10"/>
<text class="t" x="365" y="474">SMB · FTP · NFS · WebDAV</text>
