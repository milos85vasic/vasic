<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:#a31e39;--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:#ff6b81;--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">Helix-Flow — roadmap (planned platform)</text>
<path class="conn" marker-end="url(#a)" d="M420,180 L160,238"/>
<path class="conn" marker-end="url(#a)" d="M440,180 L350,238"/>
<path class="conn" marker-end="url(#a)" d="M460,180 L550,238"/>
<path class="conn" marker-end="url(#a)" d="M480,180 L740,238"/>
<rect class="dash" x="300" y="90" width="300" height="90" rx="10"/>
<text class="t" x="450" y="124">Helix-Flow Platform</text>
<text class="s" x="450" y="144">roadmap · not yet built</text>
<rect class="dash" x="60" y="240" width="180" height="80" rx="10"/>
<text class="t" x="150" y="274">Go · Python · Shell</text>
<text class="s" x="150" y="294">planned services</text>
<rect class="dash" x="260" y="240" width="180" height="80" rx="10"/>
<text class="t" x="350" y="274">PostgreSQL / PL·pgSQL</text>
<text class="s" x="350" y="294">planned data</text>
<rect class="dash" x="460" y="240" width="180" height="80" rx="10"/>
<text class="t" x="550" y="274">Terraform / HCL</text>
<text class="s" x="550" y="294">planned infra</text>
<rect class="dash" x="660" y="240" width="180" height="80" rx="10"/>
<text class="t" x="750" y="274">Web · HTML/CSS/JS</text>
<text class="s" x="750" y="294">planned UI</text>
<text class="lbl" x="300" y="72">Documented: tagline only</text>
<text class="note" x="300" y="372">Conceptual by design — internals will be drawn once a real architecture doc exists</text>
</svg>