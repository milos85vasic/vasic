<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:#a31e39;--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:#ff6b81;--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">LLMProvider — one interface · 43 adapters</text>
<text class="lbl" x="600" y="72">Vendor fan-out</text>
<text class="lbl" x="40" y="392">Credentials</text>
<rect class="box" x="40" y="230" width="180" height="90" rx="10"/>
<text class="t" x="130" y="264">Application</text>
<text class="s" x="130" y="284">Complete / Stream</text>
<rect class="accent" x="280" y="200" width="220" height="150" rx="10"/>
<text class="t" x="390" y="234">LLMProvider</text>
<text class="s" x="390" y="254">single Go interface</text>
<rect class="box" x="600" y="90" width="340" height="58" rx="10"/>
<text class="t" x="770" y="124">43 provider adapters</text>
<text class="s" x="770" y="144">OpenAI · Anthropic · Gemini …</text>
<rect class="box" x="600" y="165" width="340" height="58" rx="10"/>
<text class="t" x="770" y="199">Generic OpenAI-compatible</text>
<text class="s" x="770" y="219">any /v1 endpoint</text>
<rect class="dash" x="600" y="250" width="340" height="58" rx="10"/>
<text class="t" x="770" y="284">Honest discovery</text>
<text class="s" x="770" y="304">live /v1/models + TTL cache</text>
<rect class="dash" x="40" y="410" width="180" height="64" rx="10"/>
<text class="t" x="130" y="444">apikeys</text>
<text class="s" x="130" y="464">single credential source</text>
<rect class="box" x="280" y="410" width="220" height="64" rx="10"/>
<text class="t" x="390" y="444">Circuit breaker</text>
<text class="s" x="390" y="464">closed→open→half-open</text>
<rect class="box" x="560" y="410" width="240" height="64" rx="10"/>
<text class="t" x="680" y="444">Retry</text>
<text class="s" x="680" y="464">backoff + jitter · status-aware</text>
<path class="conn" marker-end="url(#a)" d="M220,275 L278,275"/>
<path class="conn" marker-end="url(#a)" d="M500,240 L598,119"/>
<path class="conn" marker-end="url(#a)" d="M500,270 L598,194"/>
<path class="conn" marker-end="url(#a)" d="M500,300 L598,279"/>
<path class="conn" marker-end="url(#a)" d="M390,350 L390,408"/>
<path class="conn" marker-end="url(#a)" d="M500,340 L640,408"/>
<path class="conn" marker-end="url(#a)" d="M130,410 L280,350"/>
</svg>