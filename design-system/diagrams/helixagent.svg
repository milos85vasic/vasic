<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:#a31e39;--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:#ff6b81;--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">HelixAgent — ensemble debate flow</text>
<text class="lbl" x="250" y="92">Provider ensemble · scored by LLMsVerifier</text>
<text class="lbl" x="40" y="384">Debate protocol</text>
<path class="conn" marker-end="url(#a)" d="M190,147 L248,127"/>
<path class="conn" marker-end="url(#a)" d="M190,156 L248,188"/>
<path class="conn" marker-end="url(#a)" d="M190,164 L248,248"/>
<path class="conn" marker-end="url(#a)" d="M190,172 L248,308"/>
<path class="conn" marker-end="url(#a)" d="M400,129 L468,192"/>
<path class="conn" marker-end="url(#a)" d="M400,189 L468,205"/>
<path class="conn" marker-end="url(#a)" d="M400,249 L468,220"/>
<path class="conn" marker-end="url(#a)" d="M400,309 L468,235"/>
<path class="conn" marker-end="url(#a)" d="M555,270 L555,352 L140,352 L140,398"/>
<path class="conn" marker-end="url(#a)" d="M240,432 L268,432"/>
<path class="conn" marker-end="url(#a)" d="M470,432 L498,432"/>
<path class="conn" marker-end="url(#a)" d="M700,432 L728,432"/>
<path class="conn" marker-end="url(#a)" d="M820,400 L820,236"/>
<rect class="accent" x="40" y="110" width="150" height="74" rx="10"/>
<text class="t" x="115" y="144">Prompt</text>
<text class="s" x="115" y="164">one question</text>
<rect class="box" x="250" y="104" width="150" height="50" rx="10"/>
<text class="t" x="325" y="132">Claude</text>
<rect class="box" x="250" y="164" width="150" height="50" rx="10"/>
<text class="t" x="325" y="192">Gemini</text>
<rect class="box" x="250" y="224" width="150" height="50" rx="10"/>
