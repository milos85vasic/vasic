<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:var(--od-accent,#a31e39);--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:var(--od-accent,#ff6b81);--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">HelixTrack — architecture map</text>
<text class="lbl" x="40" y="96">Native clients</text>
<text class="lbl" x="650" y="60">Decoupled services · HTTP/3 QUIC</text>
<text class="lbl" x="650" y="344">Encrypted data layer</text>
<text class="note" x="278" y="178">UDP discovery</text>
<rect class="box" x="40" y="110" width="190" height="60" rx="10"/>
<text class="t" x="135" y="144">Web · Angular 19</text>
<rect class="box" x="40" y="180" width="190" height="60" rx="10"/>
<text class="t" x="135" y="214">Desktop · Tauri 2.0</text>
<rect class="box" x="40" y="250" width="190" height="60" rx="10"/>
<text class="t" x="135" y="284">Android · Kotlin</text>
<rect class="box" x="40" y="320" width="190" height="60" rx="10"/>
<text class="t" x="135" y="354">iOS · Swift</text>
<rect class="accent" x="330" y="205" width="250" height="120" rx="10"/>
<text class="t" x="455" y="244">HelixTrack Core</text>
<text class="s" x="455" y="264">Go + Gin · unified /do API</text>
<rect class="box" x="650" y="80" width="250" height="62" rx="10"/>
<text class="t" x="775" y="114">Auth service</text>
<rect class="box" x="650" y="154" width="250" height="62" rx="10"/>
<text class="t" x="775" y="188">Permissions service</text>
<rect class="box" x="650" y="228" width="250" height="62" rx="10"/>
<text class="t" x="775" y="262">Localization service</text>
<rect class="box" x="650" y="360" width="250" height="72" rx="10"/>
<text class="t" x="775" y="394">PostgreSQL / SQLite</text>
<text class="s" x="775" y="414">SQLCipher AES-256</text>
<rect class="box" x="650" y="452" width="250" height="60" rx="10"/>
<text class="t" x="775" y="486">Redis cache</text>
<path class="conn" marker-end="url(#a)" d="M230,140 L328,240"/>
<path class="conn" marker-end="url(#a)" d="M230,210 L328,255"/>
<path class="conn" marker-end="url(#a)" d="M230,280 L328,272"/>
<path class="conn" marker-end="url(#a)" d="M230,350 L328,288"/>
<path class="conn" marker-end="url(#a)" d="M580,240 L648,111"/>
<path class="conn" marker-end="url(#a)" d="M580,255 L648,185"/>
<path class="conn" marker-end="url(#a)" d="M580,270 L648,259"/>
