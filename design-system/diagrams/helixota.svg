<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:var(--od-diagram-ink,#1e293b);--muted:var(--od-diagram-muted,#475569);--line:var(--od-diagram-line,#94a3b8);--accent:var(--od-accent,#a31e39);--panel:var(--od-diagram-panel,#f8fafc);--panel2:var(--od-diagram-panel2,#eef2f7);--tint:var(--od-diagram-tint,#f4dde1);--good:var(--od-diagram-good,#dcfce7);--goodln:var(--od-diagram-good-line,#16a34a);--goodink:var(--od-diagram-good-ink,#14532d);}
@media(prefers-color-scheme:dark){svg{--ink:var(--od-diagram-ink,#e2e8f0);--muted:var(--od-diagram-muted,#cbd5e1);--line:var(--od-diagram-line,#64748b);--accent:var(--od-accent,#ff6b81);--panel:var(--od-diagram-panel,#1e293b);--panel2:var(--od-diagram-panel2,#273449);--tint:var(--od-diagram-tint,#3a2530);--good:var(--od-diagram-good,#14321f);--goodln:var(--od-diagram-good-line,#4ade80);--goodink:var(--od-diagram-good-ink,#bbf7d0);}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">HelixOTA — three-plane architecture</text>
<text class="lbl" x="40" y="92">Control plane</text>
<text class="lbl" x="370" y="92">Data plane</text>
<text class="lbl" x="700" y="92">Device</text>
<text class="note" x="490" y="440">Extractable seams: control ↔ data · data ↔ device</text>
<rect class="accent" x="40" y="110" width="240" height="80" rx="10"/>
<text class="t" x="160" y="144">Control plane</text>
<text class="s" x="160" y="164">Go + Gin · HTTP/3 QUIC</text>
<rect class="box" x="40" y="210" width="240" height="64" rx="10"/>
<text class="t" x="160" y="242">Rollout orchestrator</text>
<text class="s" x="160" y="262">5→10→30→100 %</text>
<rect class="box" x="40" y="290" width="240" height="64" rx="10"/>
<text class="t" x="160" y="322">React dashboard</text>
<rect class="box" x="370" y="110" width="240" height="80" rx="10"/>
<text class="t" x="490" y="144">PostgreSQL</text>
<text class="s" x="490" y="164">release metadata</text>
<rect class="box" x="370" y="200" width="240" height="64" rx="10"/>
<text class="t" x="490" y="232">MinIO / S3</text>
<text class="s" x="490" y="252">artifact store</text>
<rect class="box" x="370" y="280" width="240" height="64" rx="10"/>
<text class="t" x="490" y="312">OpenTelemetry</text>
<text class="s" x="490" y="332">Prometheus · Grafana</text>
<rect class="accent" x="700" y="110" width="240" height="80" rx="10"/>
<text class="t" x="820" y="144">Device agent</text>
<text class="s" x="820" y="164">Kotlin / KMP</text>
<rect class="box" x="700" y="210" width="240" height="64" rx="10"/>
<text class="t" x="820" y="242">update_engine</text>
<text class="s" x="820" y="262">AVB / dm-verity</text>
<rect class="good" x="700" y="290" width="240" height="80" rx="10"/>
<text class="gt" x="820" y="324">A/B slots</text>
<text class="s" x="820" y="344">zero-brick rollback</text>
<path class="conn" marker-end="url(#a)" d="M280,150 L368,150"/>
<path class="conn" marker-end="url(#a)" d="M280,242 L368,232"/>
<path class="conn" marker-end="url(#a)" d="M610,150 L698,150"/>
<path class="conn" marker-end="url(#a)" d="M610,232 L698,242"/>
<path class="conn" marker-end="url(#a)" d="M280,320 L698,330"/>
</svg>