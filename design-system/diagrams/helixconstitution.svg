<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:#a31e39;--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:#ff6b81;--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">HelixConstitution — inheritance &amp; propagation</text>
<text class="lbl" x="40" y="96">Inheritance (extend, never weaken)</text>
<text class="lbl" x="560" y="216">Fleet propagation · gate-checked</text>
<text class="note" x="475" y="205">distributed as submodule</text>
<rect class="accent" x="40" y="120" width="340" height="90" rx="10"/>
<text class="t" x="210" y="154">Universal base Constitution</text>
<text class="s" x="210" y="174">Git submodule · §11.4.x covenants</text>
<rect class="box" x="40" y="250" width="340" height="80" rx="10"/>
<text class="t" x="210" y="290">Project layer</text>
<text class="s" x="210" y="310">own Constitution / CLAUDE / AGENTS</text>
<rect class="box" x="40" y="360" width="340" height="80" rx="10"/>
<text class="t" x="210" y="400">Subdirectory overrides</text>
<text class="s" x="210" y="420">optional · most local</text>
<rect class="accent" x="560" y="240" width="180" height="90" rx="10"/>
<text class="t" x="650" y="274">Constitution repo</text>
<text class="s" x="650" y="294">one source of truth</text>
<rect class="box" x="800" y="120" width="140" height="50" rx="10"/>
<text class="t" x="870" y="150">HelixTrack</text>
<rect class="box" x="800" y="186" width="140" height="50" rx="10"/>
<text class="t" x="870" y="216">HelixCode</text>
<rect class="box" x="800" y="290" width="140" height="50" rx="10"/>
<text class="t" x="870" y="320">HelixQA</text>
<rect class="dash" x="800" y="356" width="140" height="50" rx="10"/>
<text class="t" x="870" y="386">…140+ repos</text>
<path class="conn" marker-end="url(#a)" d="M210,210 L210,248"/>
<path class="conn" marker-end="url(#a)" d="M210,330 L210,358"/>
<path class="conn" marker-end="url(#a)" d="M380,165 L558,262"/>
<path class="conn" marker-end="url(#a)" d="M740,265 L798,148"/>
<path class="conn" marker-end="url(#a)" d="M740,275 L798,212"/>
<path class="conn" marker-end="url(#a)" d="M740,300 L798,314"/>
<path class="conn" marker-end="url(#a)" d="M740,310 L798,380"/>
</svg>