<text class="note" x="620" y="268">if none verified</text>
<rect class="accent" x="330" y="48" width="230" height="58" rx="10"/>
<text class="t" x="445" y="82">Translation request</text>
<rect class="box" x="330" y="132" width="230" height="72" rx="10"/>
