<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:#1e293b;--muted:#475569;--line:#94a3b8;--accent:var(--od-accent,#a31e39);--panel:#f8fafc;--panel2:#eef2f7;--tint:#f4dde1;--good:#dcfce7;--goodln:#16a34a;--goodink:#14532d;}
@media(prefers-color-scheme:dark){svg{--ink:#e2e8f0;--muted:#cbd5e1;--line:#64748b;--accent:var(--od-accent,#ff6b81);--panel:#1e293b;--panel2:#273449;--tint:#3a2530;--good:#14321f;--goodln:#4ade80;--goodink:#bbf7d0;}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">Docs Chain — dependency DAG · change propagation</text>
<text class="lbl" x="40" y="216">Change propagates downstream</text>
<text class="lbl" x="300" y="100">Transform outputs (exec)</text>
<text class="lbl" x="610" y="384">Persisted state</text>
<text class="note" x="500" y="512">Phases 1–5 implemented (GREEN) · Phases 6–7 planned</text>
<rect class="box" x="40" y="230" width="170" height="90" rx="10"/>
<text class="t" x="125" y="264">Markdown source</text>
<text class="s" x="125" y="284">chain member</text>
<rect class="accent" x="300" y="220" width="210" height="110" rx="10"/>
<text class="t" x="405" y="275">DAG engine</text>
<text class="s" x="405" y="295">Kahn topological sort</text>
<rect class="box" x="610" y="90" width="200" height="70" rx="10"/>
<text class="t" x="710" y="125">HTML</text>
<text class="s" x="710" y="145">exec transform</text>
<rect class="box" x="610" y="190" width="200" height="70" rx="10"/>
<text class="t" x="710" y="225">PDF</text>
<text class="s" x="710" y="245">exec transform</text>
<rect class="box" x="610" y="290" width="200" height="70" rx="10"/>
<text class="t" x="710" y="325">DOCX</text>
<text class="s" x="710" y="345">exec transform</text>
<rect class="box" x="610" y="400" width="200" height="70" rx="10"/>
<text class="t" x="710" y="435">SQLite state</text>
<text class="s" x="710" y="455">modernc pure-Go</text>
<rect class="dash" x="40" y="400" width="170" height="70" rx="10"/>
<text class="t" x="125" y="435">fsnotify watch</text>
<text class="s" x="125" y="455">content-hash / mtime</text>
<path class="conn" marker-end="url(#a)" d="M210,275 L298,275"/>
<path class="conn" marker-end="url(#a)" d="M510,255 L608,125"/>
<path class="conn" marker-end="url(#a)" d="M510,270 L608,225"/>
<path class="conn" marker-end="url(#a)" d="M510,290 L608,325"/>
<path class="conn" marker-end="url(#a)" d="M510,320 L608,435"/>
<path class="conn" marker-end="url(#a)" d="M210,435 L298,320"/>
</svg>