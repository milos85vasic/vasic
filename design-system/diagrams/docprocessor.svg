<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'Inter',system-ui,sans-serif">
<style>
svg{--ink:var(--od-diagram-ink,#1e293b);--muted:var(--od-diagram-muted,#475569);--line:var(--od-diagram-line,#94a3b8);--accent:var(--od-accent,#a31e39);--panel:var(--od-diagram-panel,#f8fafc);--panel2:var(--od-diagram-panel2,#eef2f7);--tint:var(--od-diagram-tint,#f4dde1);--good:var(--od-diagram-good,#dcfce7);--goodln:var(--od-diagram-good-line,#16a34a);--goodink:var(--od-diagram-good-ink,#14532d);}
@media(prefers-color-scheme:dark){svg{--ink:var(--od-diagram-ink,#e2e8f0);--muted:var(--od-diagram-muted,#cbd5e1);--line:var(--od-diagram-line,#64748b);--accent:var(--od-accent,#ff6b81);--panel:var(--od-diagram-panel,#1e293b);--panel2:var(--od-diagram-panel2,#273449);--tint:var(--od-diagram-tint,#3a2530);--good:var(--od-diagram-good,#14321f);--goodln:var(--od-diagram-good-line,#4ade80);--goodink:var(--od-diagram-good-ink,#bbf7d0);}}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.accent{fill:var(--panel);stroke:var(--accent);stroke-width:2;}
.tint{fill:var(--tint);stroke:var(--accent);stroke-width:1.5;}
.good{fill:var(--good);stroke:var(--goodln);stroke-width:1.5;}
.dash{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4;}
.t{fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle;}
.s{fill:var(--muted);font-size:11px;text-anchor:middle;}
.gt{fill:var(--goodink);font-size:15px;font-weight:700;text-anchor:middle;}
.h{fill:var(--ink);font-size:20px;font-weight:700;}
.lbl{fill:var(--muted);font-size:12px;font-weight:600;}
.note{fill:var(--muted);font-size:11px;text-anchor:middle;}
.conn{stroke:var(--line);stroke-width:1.75;fill:none;}
.strike{stroke:var(--accent);stroke-width:2.5;}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--line)"/></marker></defs>
<text class="h" x="32" y="44">DocProcessor — dual extractor → HelixQA convergence</text>
<text class="lbl" x="620" y="52">Dual-extractor switch</text>
<text class="note" x="560" y="182">one path or the other</text>
<text class="lbl" x="40" y="344">Coverage</text>
<path class="conn" marker-end="url(#a)" d="M220,160 L298,160"/>
<path class="conn" marker-end="url(#a)" d="M540,150 L618,102"/>
<path class="conn" marker-end="url(#a)" d="M540,175 L618,190"/>
<path class="conn" marker-end="url(#a)" d="M420,210 L420,268"/>
<path class="conn" marker-end="url(#a)" d="M420,354 L420,398"/>
<path class="conn" marker-end="url(#a)" d="M540,442 L618,442"/>
<rect class="box" x="40" y="120" width="180" height="80" rx="10"/>
<text class="t" x="130" y="154">Documentation</text>
<text class="s" x="130" y="174">product docs</text>
<rect class="accent" x="300" y="120" width="240" height="90" rx="10"/>
<text class="t" x="420" y="165">DocProcessor</text>
<text class="s" x="420" y="185">Go 1.25+ extractor</text>
<rect class="dash" x="620" y="70" width="300" height="64" rx="10"/>
<text class="t" x="770" y="102">LLM agent path</text>
<text class="s" x="770" y="122">optional extraction</text>
<rect class="box" x="620" y="158" width="300" height="64" rx="10"/>
<text class="t" x="770" y="190">Heuristic parser</text>
<text class="s" x="770" y="210">offline fallback</text>
<rect class="box" x="300" y="270" width="240" height="84" rx="10"/>
<text class="t" x="420" y="312">Feature map</text>
<text class="s" x="420" y="332">documented features</text>
<rect class="good" x="300" y="400" width="240" height="84" rx="10"/>
<text class="gt" x="420" y="442">HelixQA proves</text>
<text class="s" x="420" y="462">evidence · convergence</text>
<rect class="box" x="620" y="400" width="300" height="84" rx="10"/>
<text class="t" x="770" y="442">Coverage matrix</text>
<text class="s" x="770" y="462">documented vs verified %</text>
</svg>